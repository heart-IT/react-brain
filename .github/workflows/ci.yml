# Corpus + tools gate (`npm test`): corpus lint (schema/TOC/reachability/dup-URL
# invariants), the harvest triage-rule check + engine tests, and the golden-fixture
# eval (detection/fit/signals/routing/stack/MCP). All offline — no secrets, no
# network beyond npm ci. Assertion counts are printed by the tools, not pinned here.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  site:
    # the website is a rendering of the corpus — prove it still builds from the YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
