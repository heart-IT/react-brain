id: RB-E-SHEETS
topic: "Bottom sheets & modal sheets (React Native)"
category: sheets
group: ui
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-SHEETS.md
confidence: medium
platforms: [react-native]
options:
  - { name: "@gorhom/bottom-sheet", tradeoff: "The JS incumbent: DRAWS a sheet on Reanimated (>=3.16 or 4) + Gesture Handler (>=2.16.1) rather than presenting the OS one; dynamic sizing, scroll handoff, most flexible for custom gesture-heavy sheets; ~9.1k stars, largest deployed base. 5.2.14 (2026-05-09, verified vs npm); see note: GORHOM MAINTENANCE." }
  - { name: "@swmansion/react-native-bottom-sheet", tradeoff: "Software Mansion's native sheet components (inline AND modal, snap points; software-mansion-labs): platform-authentic behavior, peer RN >=0.76. Still 0.x — 0.16.2 latest, 0.17.0-next.2 on `next` (2026-09-24, verified vs npm) — pin, expect churn." }
  - { name: "react-native-true-sheet (@lodev09)", tradeoff: "Native sheets on iOS, Android and web; the most complete native option (Fabric-only, native a11y, built-in keyboard handling, tablet side sheets, iOS 26+ Liquid Glass, Reanimated 4 interop, React Navigation sheet navigator). 3.11.14 (2026-09-09, verified vs npm); see note: TRUE-SHEET 4.0 LINE." }
  - { name: "react-native-screens FormSheet", tradeoff: "The sheet as a NAVIGATION DESTINATION: native-stack presents a route as a form sheet (detents); still experimental on the 4.x line (4.28.0, 2026-09-14; 5.0.0-alpha.3 on `next`, verified vs npm) — RB-E-NAV owns it. true-sheet's sheet navigator covers the same case without waiting on the screens rewrite." }
recommend:
  default: "Default to a NATIVE sheet — react-native-true-sheet today — unless you need custom gesture choreography, where @gorhom/bottom-sheet remains the flexible JS incumbent. gorhom DRAWS a sheet in JS; the native libraries PRESENT the OS one, so detents, dismissal physics, screen-reader semantics and iOS 26 Liquid Glass come from the platform. Pin versions: the SWM line is 0.x and true-sheet ships every few days."
  when:
    - "custom gesture-heavy sheet UIs (drag handoff to inner scroll, dynamic snap logic) → @gorhom/bottom-sheet"
    - "platform-authentic native sheet, stable today → react-native-true-sheet (3.11.x; New Architecture required — it is Fabric-only)"
    - "the sheet must hold a form or a text input → react-native-true-sheet (built-in keyboard handling and native a11y strings; in a JS-drawn sheet keyboard avoidance is yours to solve)"
    - "iPad / Android tablet layouts → react-native-true-sheet (side sheets; a phone-shaped bottom sheet stretched across a tablet is the giveaway of a JS-drawn one)"
    - "betting on the Software Mansion native line → @swmansion/react-native-bottom-sheet (0.x — pin versions, expect breaking changes)"
    - "the sheet is really a SCREEN (deep-linkable, own route) → react-native-screens FormSheet via native-stack (experimental — pin; see RB-E-NAV)"
note: >
  The axis mirrors RB-E-POLISH's toasts: a JS-flexible incumbent vs platform-authentic native
  entrants. gorhom DRAWS a sheet with Reanimated + Gesture Handler, so every platform behavior
  (detents, dismissal physics, keyboard avoidance, screen-reader semantics, tablet layout,
  Liquid Glass) is re-implemented or missing; true-sheet and the SWM library PRESENT the OS sheet
  and inherit them. With true-sheet now the most complete native option and gorhom quiet since
  May, the JS incumbent is the specialist choice for custom gesture work, not the safe first pick.
  Medium confidence because adoption still lags the argument.

  GORHOM MAINTENANCE (2026-09-24, verified vs npm + the GitHub repo): 5.2.14 (2026-05-09) is still
  latest and the master branch has no commit since 2026-05-09; open issues are 48 (74 on
  2026-08-18) → not abandoned, but no fix is shipping; a gorhom bug you hit is yours to patch.

  TRUE-SHEET 4.0 LINE (2026-09-24, verified vs npm): 3.11.x still gets patches (3.11.12–3.11.14,
  2026-08-18 to 2026-09-09) while 4.0.0-beta.1 → beta.18 shipped between 2026-08-09 and 2026-09-23.
  Reanimated (>=4), worklets, React Navigation core (>=7) and Radix dialog peers are all optional
  (peerDependenciesMeta) → a Reanimated 3 app can adopt it without the interop. The 4.0 tripwire
  fires on the stable release.

  ADOPTION (2026-08-18, 34-app census): a sheet library in 7 of 14 RN apps — gorhom in 7,
  true-sheet in 1. That is what a recent inversion looks like.

  HISTORY:
    2026-09-24 REOPENED: pins refreshed (true-sheet 3.11.14 + 4.0 beta.18, screens 4.28.0, SWM 0.17.0-next.2); gorhom open issues 74 → 48 with still no release or push since 2026-05-09; true-sheet's optional peers stated.
    2026-08-18 CHALLENGED → OVERTURNED: default inverted from gorhom to true-sheet (true-sheet became the most complete native option; gorhom stopped shipping); graduated drafted → reviewed.
    2026-07-16 GAP CLOSED: entry created by the TWiR #284–290 back-audit (SWM native sheet #284, true-sheet 3.11 #287, screens FormSheet #290; gorhom never covered).
