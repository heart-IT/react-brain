detect_source:   # source-level signals owned by this entry (regex over repo source)
  - pattern: "useNativeDriver:\\s*false"
    signal: "JS-driven Animated animations (useNativeDriver: false)"
    hint: "drive animations off the JS thread — native driver where supported, else Reanimated (perf depth → react-native-best-practices)"
tripwires:   # standing caveats as executable conditions — evaluated by `harvest firsthand`; fired ⇒ do the then:, update prose, remove the row
  - when: { pkg: "@shopify/react-native-skia", deprecated: true }
    then: "the Skia handover landed — @shopify/react-native-skia is flagged on npm, so Candillon's fork has published under its new name: find it, repoint the option rows + detect rows + reading claims in this entry and in RB-E-CHARTS / RB-E-GAMES / RB-E-SVG, and add a migrate rule off the @shopify name"
    added: 2026-09-21
  - when: { pkg: "react-native-screen-choreography", atleast: "1.0.0" }
    then: "screen-choreography hit 1.0 — the API churn caveat expires: drop the 'pin it, 0.x' hedging from the option row and the note, and consider promoting it from a when-clause to the shared-element default for Expo Router"
    added: 2026-09-21
  - when: { pkg: "@rive-app/react-native", atleast: "1.0.0" }
    then: "the Nitro Rive line hit 1.0 — add the rive-react-native → @rive-app/react-native migrate rule the note's WATCH promises, and drop the 'pin, 0.x' caveat from the option row"
    added: 2026-07-16
  - when: { pkg: "rive-react-native", deprecated: true }
    then: "legacy Rive SDK formally deprecated on npm — add the migrate rule (urgency: deprecated) per the note's WATCH; receipts: this flag + the Margelo rewrite post"
    added: 2026-07-16
