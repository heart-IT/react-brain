updated: 2026-09-24   # Reanimated 4.7 floor (RN 0.86-0.88, Worklets 0.13.x) + Worklets 0.13 row; prior 2026-09-21: Skia stewardship moves to its author under a new name (Shopify leaves RN) · Reanimated 4.7 new layout-animations engine is the default · Expo-Router shared-element GAP CLOSED with screen-choreography 0.6
reading:
  - title: "React Native Gesture Handler's Touchable: The Button We Wish We Had Sooner"
    url: "https://swmansion.com/blog/react-native-gesture-handler-s-touchable-the-button-we-wish-we-had-sooner/"
    by: "Jakub Piasecki (Software Mansion), 2026-08-20"
    what: "The maintainer's account of why Gesture Handler had accumulated NINE separate button components (drop-ins for RN's Touchables, then for Pressable, each with different feedback) and why RNGH 3's answer is one configurable Touchable that deprecates the rest. The durable selection fact for anyone on RNGH 3: new pressables go through Touchable, not the legacy exports; the post includes measured press-feedback latency comparisons against RN's Pressable."
    claim: "You ship react-native-gesture-handler 3 — build buttons on its unified Touchable; the library's 9 legacy button/touchable exports are deprecated."
    applies_when: { deps: ["react-native-gesture-handler"], platforms: [react-native] }
  - title: "CSS vs. JavaScript Animations"
    url: "https://www.joshwcomeau.com/animation/css-vs-javascript/"
    by: "Josh W. Comeau"
    what: "First-principles explainer on the real distinction (main-thread contention, compositor-friendly properties, WAAPI) rather than the CSS-is-always-faster myth. A durable animation mental model that applies to web and RN reasoning alike."
  - title: "How react-native-ease runs animations with no JavaScript loop"
    url: "https://www.peterp.me/articles/how-react-native-ease-runs-animations-with-no-javascript-loop/"
    by: "Peter Piekarczyk"
    what: "Deep dive on driving animations entirely via Core Animation / ObjectAnimator with no per-frame JS, incl. iOS model vs presentation layers and cross-platform spring physics. The mental model for truly native-driven RN animation."
    claim: "You ship react-native-ease — animations run entirely via Core Animation/ObjectAnimator with no per-frame JS or UI-thread worklet work; the mental model is iOS model vs presentation layers plus cross-platform spring physics."
    applies_when: { deps: ["react-native-ease"], platforms: [react-native] }
  - title: "Chasing a Phantom Jump: making Skia + Reanimated smooth on low-end Android"
    url: "https://blog.margelo.com/profiling-skia-reanimated-low-end-android"
    by: "Vishesh Raheja (Margelo)"
    what: "A low-end-Android profiling deep-dive: smoothness is frame-cadence timing, not curve math; the dominant fix is SurfaceView over TextureView (no per-frame texture upload, ~50-65% less RenderThread CPU), plus stable-reference buffer mutation and quantizing per-frame values. With profiler-triangulation methodology (gfxinfo/Perfetto/Hermes)."
    claim: "You ship Skia — on low-end Android the dominant smoothness fix is SurfaceView over TextureView (no per-frame texture upload, ~50-65% less RenderThread CPU); smoothness is frame-cadence timing, not curve math."
    applies_when: { deps: ["@shopify/react-native-skia"], platforms: [react-native] }
  - title: "The real cost of React Native animations: benchmarking every approach"
    url: "https://expo.dev/blog/the-real-cost-of-react-native-animations-benchmarking-every-approach"
    by: "Janic Duplessis (Expo; react-native-ease author)"
    what: "The only cross-library per-frame benchmark: UI-thread cost of core Animated vs Reanimated (shared values AND the CSS API) vs Ease on real devices — at ~500 animating views only the fully native-driven approach stays under frame budget (Reanimated SVs measured ~36ms/frame). CAVEAT: the author created Ease, the approach that wins — treat the numbers as vendor-run and re-measure on your own screens; the methodology and the per-frame cost model are the durable part."
    claim: "You ship Reanimated — the only cross-library per-frame benchmark measured its shared values at ~36ms/frame at ~500 animating views; only the fully native-driven approach stayed under budget (vendor-run by the Ease author — re-measure)."
    applies_when: { deps: ["react-native-reanimated"], platforms: [react-native] }
  - title: "Which React Native Animation Library Should You Use for Performance?"
    url: "https://andrei-calazans.com/posts/2026-07-15-which-react-native-animation-library/"
    by: "Andrei Calazans"
    what: "The INDEPENDENT replication the Expo/Ease benchmark above asks for — same three-way question (Animated with useNativeDriver, Reanimated 4.5, Ease 0.7), different author, reproducible harness (AndreiCalazans/react-native-animation-performance), Android release build on New Arch, 90Hz physical device, Maestro-driven, median of 3, 60 boxes animating. It splits the answer BY ANIMATION TYPE instead of picking a winner: for touch/state/loop all three keep JS at the idle floor and Ease drops the fewest frames with Animated close behind; SCRUB is the fork — Animated drives the value via PanResponder→setValue on the JS thread (29% JS CPU, ~26% of JS frames dropped, and useNativeDriver cannot save a value you set from JS each frame) while Reanimated keeps it entirely on the UI thread (2.9% JS CPU). Blunt version: Reanimated when a finger is dragging, Ease or the native driver otherwise. Two caveats the author states himself: 60 independent nodes deliberately punishes per-node cost (Reanimated's useAnimatedStyle mapper), so the UI-thread loop ranking is partly an artifact — at one hero element Reanimated is likely best overall; and the ~50MB memory premium it measured DISAPPEARS with Worklets Bundle Mode on (−~100MB PSS in the follow-up re-run)."
    claim: "You ship Reanimated — independently measured, it is the only library keeping continuous gesture input off the JS thread (2.9% vs Animated's 29% JS CPU while scrubbing), but its per-node UI-thread cost dominates when many nodes animate at once."
    applies_when: { deps: ["react-native-reanimated", "react-native-ease"], platforms: [react-native] }
  - title: "A React trick to improve exit animations"
    url: "https://barvian.me/react-exit-animations"
    by: "Max Barvian"
    what: "Uses Suspense to freeze exiting content during animations; explains Fragment refs, useInsertionEffect, and Suspense DOM-update behavior. A durable web exit-animation technique grounded in React internals."
  - title: "Rewriting Rive React Native with Nitro Modules: up to 94× Faster Multi-View Loads"
    url: "https://blog.margelo.com/rewriting-rive-react-native-with-nitro-modules"
    by: "Miklós Fazekas (Margelo)"
    what: "Why the Rive RN SDK's wins came from MODELING, not micro-optimization: the legacy module flattened files/view-models into a per-view God object, so every view re-parsed state; Nitro HybridObjects make them shared typed objects (parse once, render many) — 94× on a 24-view load, ~4.7× lower memory, ~0.3-0.4µs calls vs ~1.5µs TurboModule / ~21µs legacy bridge (iPhone 13 mini, release; the rewrite authors' own benchmark). A general lesson for native-module design: model objects, not modules."
    claim: "You ship Rive — the Nitro line (@rive-app/react-native, 0.4.x early) makes files/view-models shared typed objects: parse once, render many views (94× multi-view loads, ~4.7× lower memory in the authors' benchmark); the legacy unscoped package is quiet."
    applies_when: { deps: ["rive-react-native", "@rive-app/react-native"], platforms: [react-native] }
