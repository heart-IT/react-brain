id: RB-E-PAYMENTS
topic: "In-app purchases & payments"
category: payments
group: platform-native
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-PAYMENTS.md
confidence: medium
platforms: [react-native]
options:
  - { name: "expo-iap (5.3.1)", tradeoff: "OpenIAP-compliant IAP; Google Play Billing v8 / Apple StoreKit; avoids ejecting. Verified 2026-08-14 — still shipping in lockstep with react-native-iap" }
  - { name: "react-native-iap (16.3.1)", tradeoff: "long-standing community IAP wrapper; its STANDALONE repo is archived but the package is NOT deprecated — it moved into the hyodotdev/openiap monorepo and still ships in lockstep with expo-iap (both published 2026-08-14). DIST-TAG TRAP: on both packages the `next` tag is BEHIND `latest` (react-native-iap next = 15.4.0-rc.3, expo-iap next = 4.4.0-rc.7, verified 2026-08-18) — installing @next silently downgrades you a major" }
  - { name: "RevenueCat (react-native-purchases 10.7.1)", tradeoff: "hosted subscription infra + entitlements across stores; fees vs less server work. Also brings remote-configurable paywalls and pricing experiments — features of the hosting decision, not separate choices" }
  - { name: "@premieroctet/react-native-wallet (1.0.2)", tradeoff: "Apple PassKit / Google Wallet passes (tickets, loyalty, coupons) — NOT tap-to-pay; iOS needs a Pass Type ID + entitlements. MIND THE PACKAGE NAME: bare `react-native-wallet` on npm is an UNRELATED 2020 module (1.0.8, erikpoort, Apple-Wallet-only); the library meant here is the scoped @premieroctet one — last published 2025-06-26, so treat it as stable-but-quiet and pin it" }
recommend:
  default: "Subscriptions → RevenueCat (it absorbs receipt validation + entitlement infra). Direct store billing without a third party → expo-iap (Expo) or react-native-iap."
  when:
    - "small team, subscriptions, don't want a billing backend → RevenueCat"
    - "one-time purchases / avoid vendor fees → expo-iap / react-native-iap (you own validation)"
    - "wallet passes (tickets/loyalty/coupons) → @premieroctet/react-native-wallet (set up an Apple Pass Type ID + entitlements; not tap-to-pay)"
    - "remote paywall config / pricing A-B tests → that is RevenueCat's tooling layer, not a separate library decision"
note: >
  Store rules + receipt validation make IAP testing-heavy; hosted options (RevenueCat) trade
  fees for less backend.
  STALE FACT CORRECTED (2026-08-04, firsthand watch): this entry previously called
  react-native-iap "deprecated/archived → prefer expo-iap". That read an archived REPO as a dead
  PACKAGE. Both libraries moved into the hyodotdev/openiap monorepo (the OpenIAP protocol project;
  the old hyochan/react-native-iap and hyochan/expo-iap repos were archived 2026-04-26 on the way
  out) and both are actively released from it: react-native-iap 16.0.2 and expo-iap 5.0.1 shipped
  the SAME day (2026-08-03), neither carries an npm deprecation flag. Pick between them on runtime
  (Expo module vs bare RN wrapper), not on liveness.
  GRADUATED drafted → reviewed 2026-08-18 (upkeep-routine step 4), and the graduation found a REAL
  ERROR rather than confirming the entry: the wallet option row was written as `react-native-wallet`,
  which on npm is an unrelated 2020 package (1.0.8, Apple-Wallet-only, erikpoort). The library the
  row actually describes — PassKit AND Google Wallet, from premieroctet, which the entry already
  linked in sources — is published as @premieroctet/react-native-wallet (1.0.2, 2025-06-26). Same
  failure the twir-291 spot-check caught with tsrx/octanejs: an npm NAME that resolves is not the
  same as the npm name resolving to YOUR library. Verify identity (repository field), not existence.
  Version state re-verified 2026-08-18: react-native-iap 16.3.1 and expo-iap 5.3.1 (both 2026-08-14,
  lockstep intact), react-native-purchases 10.7.1 (2026-08-13), no deprecation flags anywhere.
defer_to_skill: null
doc: "RB-E-PAYMENTS.md"   # long-form Explanation entry in content_dir
updated: 2026-08-18   # graduated drafted → reviewed; wallet option row was pointing at the WRONG npm package
sources:
  - "https://github.com/hyodotdev/openiap"
  - "https://registry.npmjs.org/react-native-iap/latest"
  - "https://registry.npmjs.org/expo-iap/latest"
  - "https://github.com/premieroctet/react-native-wallet"
  - "https://registry.npmjs.org/@premieroctet%2Freact-native-wallet"
reading:
  - title: "Cross-platform subscription state: sharing entitlements between Android and iOS"
    url: "https://www.revenuecat.com/blog/engineering/cross-platform-subscription/"
    by: "Jaewoong Eum (RevenueCat)"
    what: "Why unifying subscription entitlements across iOS/Android is hard — Apple signed-JWS vs Google purchase-token REST, HTTPS notifications vs Cloud Pub/Sub, subscription groups vs base plans/offers — and the four-part DIY architecture. The root reason IAP libraries/services exist."
  - title: "Building the RC Fortress: protecting payments against outages"
    url: "https://www.revenuecat.com/blog/engineering/building-the-rc-fortress/"
    by: "RevenueCat Engineering"
    what: "A resilience case study for keeping purchases working when subscription backends fail — cached paywall snapshots, temporary offline entitlements, buffered request log/replay — with tradeoffs made explicit. The realities of subscription infra regardless of library."
detect:   # package.json dep → this entry (pkg: exact | @scope/* | name*; token matched against recommend text)
  - { pkg: "react-native-purchases", label: "RevenueCat", token: "revenuecat" }
  - { pkg: "react-native-iap", label: "react-native-iap", token: "react-native-iap" }
  - { pkg: "expo-iap", label: "expo-iap", token: "expo-iap" }
  - { pkg: "@premieroctet/react-native-wallet", label: "wallet passes (PassKit/Google Wallet)", token: "wallet" }
