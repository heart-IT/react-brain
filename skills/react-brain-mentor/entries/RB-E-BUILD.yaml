watching:
  - title: "How React Native Builds Actually Work (APK, AAB, IPA, APP)"
    url: "https://www.youtube.com/watch?v=1o0pEjYGUWM"
    by: "Code with Beto"
    what: "Walkthrough of what actually happens between `npx expo run` and an installable artifact — the Gradle/Xcode stages behind APK/AAB/IPA and where Metro's bundle lands in them. The A/V companion to this entry's build-pipeline facts. (Verified via YouTube oEmbed: title + author.)"
reading:
  - title: "How Turbopack chunks your JavaScript"
    url: "https://nextjs.org/blog/turbopack-chunking"
    by: "Sam Poder (Turbopack team, Vercel)"
    what: "The chunking-strategy explainer plus the Next.js 16.3 knobs that come out of it — the first thing to read when a Next app's problem is 'too many requests' or 'too much JS per page'. The framing is a three-way tradeoff with no free answer: one chunk for everything caches perfectly but over-ships; one chunk per page never over-ships but duplicates shared code into every page; one chunk per module never duplicates but explodes the request count. Turbopack's default sits in between by MERGING chunks at build time, weighting a single-page visit at 2/3. Measured on nextjs.org itself, that default cut requests by more than half versus no merging while shipping slightly less code, whereas maximum merging cut requests further but shipped ~10% more overall — better for a visitor who lands once, worse for one who navigates. The 16.3 features address the two structural limits (merging happens before anyone visits, and the algorithm has to guess how people browse): experimental.turbopackChunking.generateComponentChunks emits un-merged chunks alongside merged ones so the RUNTIME picks whichever is cheaper given what the browser already has; firstPageLoadPriority (default 0.67, bounce rate is a sensible starting value), priorityRoutes and clusters let you replace the guesses with your own analytics; and three ship-less-code flags — experimental.turbopackCjsTreeShaking (CJS tree-shaking was previously ESM-only), experimental.turbopackSharedRuntime (one runtime chunk instead of per-page: one fewer blocking request and ~10 KB per navigation), and a default runtime that no longer ships WebAssembly/Web Worker code unless detected. All experimental in 16.3; the CJS and shared-runtime flags are stated as future defaults."
    claim: "Your Next.js bundle ships too many requests or too much per-page JS — 16.3 turns Turbopack's chunking guesses into config (firstPageLoadPriority, priorityRoutes, clusters) plus generateComponentChunks, CJS tree-shaking and a shared runtime."
    applies_when: { deps: ["next"], platforms: [react] }
  - title: "How Teamworks Cut Mobile Release Time to 10 Minutes"
    url: "https://www.callstack.com/case-studies/accelerating-teamworks-mobile-delivery-with-re-pack-and-module-federation"
    by: "Callstack (case study)"
    what: "The production receipt for the Re.Pack/Module-Federation lane: Teamworks' seven mini-apps moved off Metro onto Re.Pack + Module Federation with a shell app and two CI/CD lanes (host vs mini-app), cutting change lead time from 1-2 days to ~10 minutes with multiple staging deploys per day. Vendor case study (Callstack builds Re.Pack) — but the numbers are client receipts, and it grounds this entry's own when-clause: module federation is worth the complexity when independent teams need independent release cadences in one app."
    claim: "You ship Re.Pack — the Teamworks case is the reference architecture: mini-apps on Module Federation behind a shell app with separate host/mini-app CI lanes took change lead time from days to ~10 minutes."
    applies_when: { deps: ["@callstack/repack"], platforms: [react-native] }
  - title: "Working With the React Native Super App Showcase Repository"
    url: "https://www.callstack.com/blog/working-with-the-react-native-super-app-showcase-repository"
    by: "Callstack"
    what: "The HOW behind the Teamworks receipt above: Callstack's open-source Super App Showcase (Re.Pack + Module Federation V2, monorepo) explained role by role — a Host Shell that is the ONLY package with native binaries (owns root nav, boot, auth gates, remote origins), federated mini-apps each exposing one navigator/context as a remote bundle, and a singleton Shared SDK for anything that must exist exactly once (streaming connections, shared state, design tokens). Two non-negotiable rules carry the architecture: native code lives only in the host shell (a doubly-registered native module crashes outright, no soft warning), and every shared dep reads version AND requiredVersion from one dependency catalog because Module Federation does not enforce strict equality itself. (Fetched via browser-UA curl; callstack.com 403s WebFetch.)"
    claim: "You build a Re.Pack/Module-Federation super app — hold the showcase's two invariants: native modules only in the host shell (double registration hard-crashes), and singleton shared deps pinned via one catalog for version AND requiredVersion."
    applies_when: { deps: ["@callstack/repack"], platforms: [react-native] }
  - title: "Things I Learned While Building Expo"
    url: "https://evanbacon.dev/blog/expo"
    by: "Evan Bacon (Expo core, 9 years; Expo Router creator — farewell essay, 2026-05)"
    what: "The philosophical background behind this entry's Expo-vs-bare row, from the person who built much of it: dogfooding as the design tool, users articulating symptoms not solutions ('a runtime that was theirs, not ours' → dynamic runtime generation / prebuild), trust compounding through the expo-eject criticism years, and telemetry settling architecture debates. Durable platform-building judgment, found by the 2026-07-16 back-audit of TWiR #284."
  - title: "Rust Is Eating JavaScript"
    url: "https://leerob.com/rust"
    by: "Lee Robinson"
    what: "The first-principles explainer for WHY the JS toolchain is going Rust — memory safety, no GC, real parallelism, the redundant-parsing problem — mapping the whole landscape (esbuild, SWC, Oxc/Biome, Rspack, Rolldown). Durable cross-cutting context, not a single release."
  - title: "Vite 8.0 is out!"
    url: "https://vite.dev/blog/announcing-vite8"
    by: "The Vite / VoidZero team"
    what: "Why maintaining two pipelines (esbuild + Rollup) was unsustainable and how Rolldown unifies dev/prod on one Rust bundler (10-30x faster), with Oxc semantic analysis driving better tree-shaking. The primary source for the Vite+Rolldown+Oxc consolidation."
    claim: "You ship Vite — v8 unifies dev and prod on Rolldown (one Rust bundler, 10-30x faster) instead of the unsustainable esbuild+Rollup pair, with Oxc semantic analysis driving better tree-shaking."
    applies_when: { deps: ["vite"], platforms: [react] }
  - title: "Exploring Inlined Requires: how they really work"
    url: "https://andrei-calazans.com/posts/2026-06-02-how-metro-inlined-requires-work/"
    by: "Andrei Calazans"
    what: "Exactly what Metro's inlineRequires Babel transform does, why React/RN stay hoisted, why default imports aren't inlined, and how rnx-kit's esbuild path differs (real tree-shaking vs startup-only). The canonical Metro startup-mechanics reference."
    claim: "You bundle with Metro — inlineRequires mechanics: why React/RN stay hoisted, why default imports aren't inlined, and how rnx-kit's esbuild path differs (real tree-shaking vs startup-only)."
    applies_when: { deps: ["metro", "@react-native/metro-config"], platforms: [react-native] }
  - title: "The Complete Guide to React Native Build Optimization"
    url: "https://themythicalengineer.com/the-complete-guide-to-react-native-build-optimization.html"
    by: "The Mythical Engineer"
    what: "Why RN Android builds are slow (conservative Gradle/Metro/C++ defaults) and how parallel Gradle, dynamic Metro workers, ccache, and single-architecture builds cut times from 20+ min to 2-5 min, with benchmarks. The RN-CI build-perf dimension the other readings here don't cover."
