id: RB-E-BUILD
topic: "Build tooling, bundlers & monorepo"
category: build-tooling
group: tooling-ops
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-BUILD.md
confidence: high
platforms: [react, react-native]
options:
  - { name: "Metro", tradeoff: "RN bundler; 0.87 ships with RN 0.87 (2026-08-11) — source-map generation 2x faster and source maps take half the memory (both feed React Native DevTools load time), TypeScript/ESM config files (metro.config.mts) are STABLE, package self-resolve lands, and support for YAML configs + .es6 extensions is REMOVED" }
  - { name: "Vite 8 / Rspack 2.2 / webpack 5.111", tradeoff: "web bundlers; VITE SECURITY FLOOR: 8.0.5 / 7.3.2 (CVE-2026-39364, dev server — see note); Vite 8 defaults to the Rust Rolldown bundler; Rspack 2 adds RSC + 2.1 ships the Rust React Compiler via its built-in SWC loader (7–13x the Babel plugin), and 2.2 (2026-08-26) is a performance release — ~3x faster built-in CSS parsing, ~5% off production builds, and HMR that no longer refetches CSS on a JS-only change (a 4.1 MB stylesheet went ~385 ms → ~6 ms per hot update), plus Browserslist Baseline targets; webpack 5.110 closes much of the config gap (zero-loader CSS/HTML/TS/Wasm + Vite-compatible import.meta APIs, and now built-in CSS/HTML minification + performance hints) and 5.111 (2026-09-14) makes ESM OUTPUT STABLE, adds output.copy for static files and improves the CSS minimizer; Vite still the default for new web" }
  - { name: "Turborepo / Nx + pnpm/yarn workspaces", tradeoff: "monorepo task graph + caching; pnpm 12 (2026-08-26) is the Rust rewrite and is STABLE — see note" }
  - { name: "Expo vs bare RN", tradeoff: "managed velocity vs native control" }
  - { name: "Noxcturnal (Expo, experimental)", tradeoff: "FIRST-PARTY Rust Metro transform worker — oxc under the hood, exposed to Node through napi-rs, shipped in Expo SDK 58 beta behind `experiments.noxcturnalTransformWorker`. Expo's own numbers: ~3x faster per-module transforms and ~2x faster cold bundling (largest test app, ~5,500 files: 5.26s → 2.46s, with 443 files still falling back to Babel). READ THE ACTIVATION RULES BEFORE BUDGETING THE WIN — see note; for most real apps it is partial, not total" }
  - { name: "react-native-swc", tradeoff: "Rust/SWC Metro transform — faster than Babel; custom Babel plugins need SWC equivalents (e.g. worklets plugin for Reanimated)" }
  - { name: "react-native-boost 2.0", tradeoff: "ADVOCATE FLIP 2026-09-21 — a different mechanism from every transformer row here: it does not speed transforms up, it REWRITES your JSX at build time to skip RN component layers (Text/View and now Animated, ActivityIndicator, StyleSheet, Platform), so the win is render cost, not bundle time. 2.0 (2026-09-13, verified vs the release) replaces the Babel plugin with a METRO CONFIG PLUGIN — which is what makes the new optimizers possible — adds cross-file ancestor/helper analysis to bail out less, supports Uniwind, and validates runtime parity against RN 0.88 RC. The honest caveat is the whole product: its value proposition is behavioural PARITY with React Native while removing layers, which is a promise every release re-makes, so measure your own screens and keep the escape hatch. No independent adoption evidence in this corpus yet" }
  - { name: "facetpack (early)", tradeoff: "@ecrindigital/facetpack — Rust/OXC Metro transformer (claims ~36x Babel transforms), one-line metro.config, Babel fallback for Flow packages, Doctor CLI; v0.2 (2026-01), early-stage" }
  - { name: "RNRepo (Software Mansion)", tradeoff: "prebuilt native binaries via Maven; cuts CI build time (~50% reported)" }
  - { name: "Re.Pack 5 (Rspack)", tradeoff: "Metro alternative on Rust-based Rspack; module federation / super-apps" }
  - { name: "Rock (Callstack)", tradeoff: "native build-artifact caching (reported 35min → <4min); works with Metro or Re.Pack" }
  - { name: "Rollipop (early alpha)", tradeoff: "Metro replacement powered by Rolldown (the Vite team's Rust bundler) — inherits the Rollup/Rolldown plugin ecosystem, Yarn PnP by default, dev dashboard; bare RN CLI only (no Expo); early-alpha, not production" }
  - { name: "Vite+ (beta)", tradeoff: "VoidZero's unified toolchain — one entry point over Vite, Vitest, Rolldown, tsdown, Oxlint, Oxfmt; MIT; framework-agnostic; BETA (2026-07) — 'stable, but not yet complete', migration command may need manual follow-up" }
recommend:
  default: "Web: Vite 8 (Rolldown). React Native: Metro (+ Hermes V1, precompiled iOS binaries). Monorepo: pnpm workspaces + Turborepo. Expo for managed velocity."
  when:
    - "RN bundler alternative for module federation / super-apps → Re.Pack 5 (worth the complexity when independent teams need independent JS release cadences within one app — Callstack's own criterion)"
    - "want the Rolldown/Rollup plugin ecosystem on RN (experimental) → Rollipop — early alpha, prototype only, not an Expo path"
    - "slow RN CI → prebuilt binaries (RNRepo) and/or Rock build caching"
    - "Babel is the Metro bottleneck → on Expo SDK 58+, try the first-party Noxcturnal transformer FIRST (one config flag, automatic Babel fallback) and measure; the third-party options (react-native-swc, facetpack) are for bare RN or when Noxcturnal's activation rules exclude your project — pin them and keep the Babel fallback"
    - "Pear app → esbuild-bundle to dist (desktop) or Metro + bare-pack for the Bare worker (mobile), not the web/Metro defaults — see RB-E-P2P"
    - "new web project → Vite; legacy web → webpack/Rspack"
note: >
  VITE DEV-SERVER SECURITY FLOOR — 8.0.5 / 7.3.2 (2026-09-21, verified against the upstream GitHub
  advisory GHSA-v2wj-q39q-566r AND F5 Labs' August 2026 telemetry; surfaced by React Status #491):
  CVE-2026-39364, rated HIGH, is a `server.fs.deny` bypass in the Vite DEVELOPMENT server.
  Affected ranges are vite >=7.1.0 <=7.3.1 (patched 7.3.2) and >=8.0.0 <=8.0.4 (patched 8.0.5), so
  anything on the current 8.3.x line is already clear — the floor is recorded because this corpus
  recommends Vite and a reader may be pinned to an older line. The mechanism is worth understanding
  rather than just patching: Vite exposes an internal @fs route to serve files from the host
  filesystem and relies on the server.fs.deny deny-list to protect .env files, certificates and
  private source; appending query parameters such as ?raw, ?import&raw or ?import&url&inline makes
  the server skip deny-list filtering and return the file with a 200. It co-fires with three older
  bypasses of the same route (CVE-2025-30208, CVE-2025-31125, CVE-2024-45811), which is the real
  lesson: this route has been bypassed repeatedly, so treat deny-list filtering as defence in depth
  and not as the boundary.
  THE EXPOSURE CONDITION IS THE ACTIONABLE PART: Vite binds to localhost by default and is only
  reachable if you expose it — `--host`, `server.host`, or a Docker port mapping that publishes the
  dev server. That is not hypothetical. F5's honeynet recorded a sustained campaign against exposed
  Vite dev servers in August 2026 — 807 session-grouped attacks and roughly 32,000 events —
  cycling wordlists of env files, AWS keys, Azure tokens and Infrastructure-as-Code state files,
  with the same source cluster also probing the Next.js middleware bypass (CVE-2025-29927). So the
  standing rule for this entry: patch to the floor, and do not publish a dev server to a network
  you do not control, including from CI containers and cloud dev boxes.
  THE RUST-METRO-TRANSFORM RACE NOW HAS A FIRST-PARTY ENTRANT, AND ITS FINE PRINT IS THE STORY
  (2026-09-21, verified vs the Expo SDK 58 beta changelog of 2026-09-15): "Noxcturnal" is a module
  transformer written in Rust on top of oxc and bound into Node with napi-rs, and Expo measured
  per-module transforms ~3x faster with end-to-end COLD bundling ~2x faster — their largest test
  app, ~5,500 files, went 5.26s to 2.46s. Note what the same sentence says: 443 of those files still
  fell back to Babel. The activation rules are why, and they decide whether this is worth anything
  to YOUR app: it only turns on when the project has NO custom transform worker and NO Babel plugins
  or presets, and it SKIPS files needing the Reanimated or Worklets Babel transforms. Reanimated is
  close to universal in production RN, so the realistic reading for an existing app is a partial
  win on the files that qualify, not the headline 2x — and for an app with any Babel plugin, no win
  at all until Expo adds configuration (they say that is planned). It is also early enough that Expo
  says the implementation and the numbers may change before stable. Two things follow for this
  entry: the "Babel is the Metro bottleneck" when-clause now routes to the first-party option first
  because it is one flag with an automatic fallback rather than a dependency with a plugin-porting
  cost, and the third-party OXC/SWC transformers keep their slot precisely for the projects
  Noxcturnal excludes. Warm bundling is unaffected either way — Metro's cache already covers it,
  which is why this is framed as a cold-bundle and CI concern.
  FEWER NEEDLESS NATIVE REBUILDS (same changelog): SDK 58 defaults `fingerprint` to the `balanced`
  preset — bumping `version` in app.json or touching files inside node_modules no longer changes the
  fingerprint, and native modules are hashed by package NAME AND VERSION rather than by their file
  contents. This is the setting that decides whether CI rebuilds native or reuses a build, so a
  stable hash with no extra config is a direct CI-minutes win; presets are configurable if you want
  a stricter tradeoff.
  ENGINE + BUILD (verified vs RN 0.84 blog): Hermes V1 is the DEFAULT JS engine since RN 0.84
  (2026-02-11; experimental opt-in from 0.82, also opt-in in Expo SDK 55) — automatic if already
  on Hermes. RN 0.84 also ships PRECOMPILED iOS binaries by default (fetched at pod install,
  faster builds) and raised the minimum to Node 22.11+. RN is on a bi-monthly release cadence.
  Prebuilt native libraries (RN 0.83 artefacts, RNRepo) are the broader trend. BUNDLERS: Metro
  stays the RN default (RN 0.79 added ~3x faster cold start); Expo SDK 56 extends the trend with
  prebuilt XCFrameworks for its most complex modules (~16% faster median clean iOS builds,
  verified vs the SDK 56 changelog); Re.Pack 5 (on Rspack) is the main
  alternative, and Rollipop (leegeunhyeok/rollipop, early alpha per its repo) now brings Rolldown —
  the same Rust bundler behind Vite 8 — directly to the RN side; remote-JS Chrome debugging was
  removed in RN 0.79 (use RN DevTools). Rollipop verified vs its repo 2026-06-30 (early-alpha, not production).
  WEB TOOLCHAIN: a Rust wave — Vite 8 on Rolldown (1.0; ~10–30x Rollup), the Oxc family
  (Oxlint/Oxfmt), and now Bun itself: v1.4 ships the Zig→Rust rewrite (2026-07, verified vs the
  Bun post — ~20% smaller binaries, every instrumentable memory leak resolved; the agentic-port
  story behind it lives in RB-E-AI-DEVTOOLS reading); Cloudflare acquired VoidZero
  (Vite/Vitest/Rolldown/Oxc) — tools stay MIT.
  Vite+ BETA (2026-07-02, verified vs the VoidZero announcement; 2nd signal after TWiR #289's
  watch flag): the consolidation made product — one CLI over the whole VoidZero stack, MIT,
  framework-agnostic; beta, so watch rather than migrate existing multi-tool setups yet.
  HERMES' OWN RELEASE LINE (2026-07-16, verified vs the static_h blog): Hermes now ships its
  own stable releases decoupled from RN — the 2026-06 line (260318099.0.0) adds Set operations,
  Object/Map.groupBy, iterator helpers, Promise.withResolvers, a built-in TextDecoder, and a
  `--transform-ts` flag (native type-only stripping à la Node --strip-types — no Babel pass).
  Adversarially stress-tested 2026-06-25 (SURVIVES, high): Vite 8 shipped stable (2026-03) with
  Rolldown GA as the default; the Rust React-Compiler napi pullback affects only that compiler's
  JS path, not Rolldown-as-bundler; Metro stays the RN default. UPDATE 2026-07-06: the Rust React
  Compiler has since merged into SWC and ships in Rspack 2.1 (7–13x the Babel version, verified vs
  the Rspack 2.1 blog) — Rolldown's pullback is a Rolldown-integration choice, not a dead Rust port.
  WEBPACK CONVERGES ON THE VITE DX (5.109, 2026-07-28, verified vs the webpack blog): the
  `experiments.css` / `.html` / `.typescript` / `.asyncWebAssembly` flags flip from opt-in to an
  `"auto"` default — each feature turns itself on UNLESS a loader is already registered for those
  files (built-in TS type-stripping additionally needs Node >= 22.6). Existing configs behave
  exactly as before; a fresh project imports CSS, HTML, TypeScript and Wasm with zero loaders and
  zero config. It also adopts Vite's module APIs outright — `import.meta.glob` (with eager/import/
  query/base/exhaustive/caseSensitive), `import.meta.env` (MODE/DEV/PROD/SSR/BASE_URL) and
  `import.meta.resolve` — plus `?raw` / `?inline` / `?url` asset query suffixes under
  `experiments.futureDefaults`. This narrows the practical reason to reach for Vite on
  CONFIGURATION grounds; the Rust-speed argument is untouched, so the default above stands.
  PNPM 12 (2026-08-26, verified vs the release post; CONSUMES the pre-ship skip on the pnpm 12 RC):
  the Rust rewrite is stable and deliberately not a migration — commands, flags, settings and the
  LOCKFILE FORMAT all carry over from pnpm 11. On the install path, note the post has DATED: at
  publication npm's `latest` still pointed at pnpm 11 and the post told you to use
  `pnpm self-update latest-12`, but the registry has since moved — `latest` is 12.3.4 (verified vs
  registry.npmjs.org 2026-09-10), so a plain install now gets pnpm 12. The real gotcha is that git
  dependencies became IDENTITIES — for GitHub/GitLab/
  Bitbucket a specifier now only names the repo and always resolves through HTTPS, so the lockfile
  never records an SSH URL; a machine that needs SSH for private repos configures
  `git config --global url."git@github.com:".insteadOf https://github.com/` rather than encoding it
  in the manifest (unknown hosts and credential-bearing URLs are kept verbatim). Two wins worth
  the bump: an unrecognized key in pnpm-workspace.yaml is now REPORTED instead of silently ignored
  — an error when the project pins a matching pnpm version, a warning otherwise — which closes a real
  supply-chain hole, since a misspelled `minimumReleaseAge` used to disable the install-age policy
  silently (see RB-E-SECURITY); and peer resolution now cuts dependency cycles at a deterministic
  edge, so the lockfile depends only on the dependency graph — byte-identical across reinstalls and
  project reordering, where pnpm 11 could churn it — with large cyclic workspaces resolving peers
  2–3x faster on ~25% less memory. Smaller wins in the same release: `packageImportMethod: auto`
  now tries a HARDLINK before a reflink on Linux, which the post says roughly halves the time an
  install spends materializing node_modules from a warm store on btrfs; plus project-aware global
  bins and registry revisions.
