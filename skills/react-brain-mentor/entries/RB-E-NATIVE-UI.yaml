id: RB-E-NATIVE-UI
topic: "Native UI extensions — Live Activities, widgets, App Clips, portals"
category: native-ui
group: platform-native
status: reviewed   # long-form entry written + source-checked
confidence: medium
platforms: [react-native]
options:
  - { name: "expo-widgets (Expo)", tradeoff: "Home-screen widgets + Live Activities from Expo UI components, no SwiftUI/native code; full env access, no pre-render. STABLE in Expo SDK 56 (alpha in SDK 55) on iOS; SDK 58 (beta) adds an Android implementation on a dedicated Hermes runtime. See note: ANDROID WIDGETS." }
  - { name: "Voltra (Callstack)", tradeoff: "Live Activities + widgets with SwiftUI-style layout (VStack/HStack); since v2.0 (2026-06-18) on Turbo Modules, so it runs in BARE RN (v2 migration required); iOS 16.2+ (interactive 17+), iOS 18+ activity families. 2.3 (2026-09-15) adds server-driven widgets and per-instance Android config. See note: VOLTRA 2.3." }
  - { name: "Expo Targets", tradeoff: "Native targets (widgets, App Clips, share extensions) in Swift/Kotlin or RN; multi-step setup. The pick when the surface needs custom native code the other rows do not expose." }
  - { name: "expo-app-intents", tradeoff: "ALPHA (Expo SDK 58 beta): exposes Apple App Intents (Siri, Shortcuts, Spotlight, Apple Intelligence) from an Expo app; `npx expo-app-intents init` scaffolds it. Docs and examples still to come, so prototype only. See note: APP INTENTS." }
  - { name: "react-native-teleport", tradeoff: "Portals rendering in the native layer (re-parenting); web + native. 1.2.0 removes the Android black/white flash when teleporting video and maps, with no API or config to adopt. See note: TELEPORT 1.2." }
recommend:
  default: "iOS widgets / Live Activities: expo-widgets on Expo (stable since SDK 56, no native code), Voltra 2 on bare RN. Android widgets: expo-widgets on Expo SDK 58 (beta), Voltra 2.3 on bare RN. Custom native targets / App Clips / share extensions → Expo Targets. What changes the pick is Expo vs bare RN, then whether the Android side (days old on both) is production-ready for you."
  when:
    - "iOS widgets / Live Activities on Expo → expo-widgets (SDK 56+, stable, no SwiftUI)"
    - "Live Activities on bare RN → Voltra 2 (Turbo Modules; no longer Expo-only)"
    - "widgets / App Clips / share extensions needing custom native → Expo Targets"
    - "ANDROID home-screen widgets on Expo → expo-widgets (SDK 58 beta; own JS bundle on a dedicated Hermes runtime)"
    - "ANDROID widgets on bare RN, or a widget needing per-instance settings or server-driven props → Voltra 2.3"
    - "Siri / Shortcuts / Spotlight / Apple Intelligence entry points → expo-app-intents (alpha; SDK 58 beta), else Expo Targets if you want to own the Swift"
    - "native-layer portals, e.g. moving a playing video or map between parents without a flash → react-native-teleport (1.2+)"
note: >
  THE PICTURE: native UI extensions (widgets, Live Activities, App Clips, App Intents) live outside
  the React tree, so the question is who generates the native target. On Expo, expo-widgets does it
  from Expo UI components with no SwiftUI; on bare RN, Voltra 2 does it over Turbo Modules; for
  anything custom, Expo Targets hands you the native target. The iOS side is settled; the Android
  side arrived on both main options in September 2026 and is days old, so prototype your platform
  coverage before committing a product surface to it.

  ANDROID WIDGETS (2026-09-21, verified vs the Expo SDK 58 beta changelog of 2026-09-15 + the
  Voltra 2.3.0/2.3.1 releases): expo-widgets gained an Android implementation where each widget
  runs its own JS bundle on a DEDICATED HERMES RUNTIME, with interactions and Material Colors →
  a widget is a second app-sized thing to keep fast; treat widget JS as a startup-budget question,
  not free reuse of app code. On iOS the same changelog adds a staleDate option on
  LiveActivity.start()/update(), stable ActivityKit identifiers and runtime widget configuration
  changes.

  VOLTRA 2.3 (2026-09-15, verified vs the v2.3.0 release): SERVER-DRIVEN Dynamic Widgets (a widget
  fetches its own props from your server on a schedule, per placement, instead of the app pushing);
  PER-INSTANCE Android widget configuration that survives a launcher backup/restore
  (setWidgetInstanceConfiguration: two placements of one widget showing different cities);
  experimental JSON-diff Dynamic Live Activities on iOS; an ArcProgressIndicator gauge for
  Android. Voltra 2.0 (2026-06-18, verified vs the v2.0.0 release) rewrote onto Turbo Modules and
  dropped the Expo-Modules / Dev-Client requirement.

  APP INTENTS (2026-09-21, verified vs the SDK 58 beta changelog): intent types are declared in
  Swift INLINE MODULES under an `app-intents` directory, because Apple's build-time metadata
  extraction only sees code in the app target; the package delivers invocations to JavaScript and
  stores entity values → you still write Swift for the intent declarations.

  EXPO UI (2026-09-21, verified vs the SDK 58 beta changelog): @expo/ui gained NavigationStack,
  NavigationLink, NavigationDestination, Toolbar, a navigationTitle modifier and two/three-column
  NavigationSplitView on iOS; Compose Image, DateRangePicker, DateRangePickerDialog and
  VerticalSlider on Android; ShapeStyle-accepting modifiers (material or gradient fills); and a
  screenshot per component in the docs. The fix most likely to matter in an existing app: views
  inside <RNHostView> are now MEASURED where SwiftUI/Compose placed them, which was behind dropped
  presses, gestures stolen by an enclosing scrollable, and missing touches inside BottomSheet,
  Popover, AlertDialog and DropdownMenu. The web BottomSheet dropped the unmaintained `vaul` for an
  in-house HTML <dialog>.

  EXPO UI + WORKLETS (2026-07-10, verified vs the post's og:description): Expo UI integrates
  react-native-worklets, so SwiftUI and Compose state can be driven SYNCHRONOUSLY on the UI thread
  with no JS round-trips → relevant when native-UI surfaces must track gestures or animation.

  TELEPORT 1.2 (verified vs the 1.2.0 blog post): the old Android move used removeView()/addView(),
  which detached the view from the window and disconnected the rendering surface behind a
  SurfaceView/TextureView: a black or white flash while the compositor waited for the next frame,
  worst on older devices. 1.2 reparents an attached view with
  detachViewFromParent()/attachViewToParent(), keeping its rendering resources alive. The fast
  path is used only when both parents share an Android window with no active focus/layout
  transition; otherwise it falls back to the old behavior.

  HISTORY:
  2026-09-21 REOPENED: Android widgets land on both options (expo-widgets SDK 58 beta, Voltra 2.3);
  expo-app-intents alpha; @expo/ui navigation primitives + RNHostView measurement fix. The
  "iOS-leaning" verdict is half-retired: iOS settled, Android days old.
  2026-07-10 REOPENED: Expo UI + worklets synchronous native state.
  2026-06 REOPENED: expo-widgets stable in SDK 56; Voltra 2.0 bare-RN capable.
