migrate:   # installed dep → sequenced upgrade knowledge (assembled by `react-brain migrate`)
  - from: { pkg: "jotai", below: "3.0.0" }
    to: "Jotai 3"
    urgency: upgrade
    effort: S
    why: "Jotai 3 (2026-09-08) is a MODERNIZATION, not a rewrite — the maintainer's own test is: if your app runs on v2 with no deprecation warnings, it should run on v3 as is. What actually moves: (1) requirements rise to React 18, TypeScript 5.5 and Node >=22.12; (2) the package is ESM-ONLY (no CJS/UMD/SystemJS builds) and `exports` is closed to the public entry points, so any deep import into the package breaks; (3) `atomFamily` moved to the `jotai-family` package and the `jotai/babel` plugins to `jotai-babel` — both are one-line import swaps plus an install; (4) `loadable` is gone (rebuild it over `unwrap`, the guide gives the ~15-line version), as are the read function's `setSelf` option (use onMount or jotai-effect) and the `delay` option on useAtom/useAtomValue (write a custom hook). Two smaller things to know: published files read process.env.NODE_ENV directly, so a bundler-less browser setup must define it, and the build targets ES2020. There is ONE behavior change, not just packaging — a subtle useAtomValue mount-timing shift documented in the guide; useAtomValue now uses React.use() where available (React 19) and falls back to the old path on React 18."
    receipts: ["https://github.com/pmndrs/jotai/releases/tag/v3.0.0", "https://raw.githubusercontent.com/pmndrs/jotai/main/docs/guides/migrating-to-v3.mdx", "https://registry.npmjs.org/jotai/latest"]
  - from: { pkg: "mobx", below: "7.0.0" }
    to: "MobX 7"
    urgency: upgrade
    effort: M
    why: "MobX 7 (2026-07-30) drops the ES5/non-proxy fallback entirely — Proxy-backed observables are now the only mode, so `configure({ useProxies })` and `{ proxy: false }` are gone; legacy decorators are no longer supported (Stage-3 `@observer` stays in mobx-react); namespaced properties became named exports (observable.ref → observableRef, comparer.structural → compareStructural); the public `trace` API and mobx-react's Provider/inject were removed, and the React bindings now require React 18+. Pays for itself in bundle: the ESM production build drops 17.02 → 13.96 KiB gzip"
    receipts: ["https://github.com/mobxjs/mobx/releases/tag/mobx%407.0.0", "https://registry.npmjs.org/mobx/latest"]
detect_source:   # source-level signals owned by this entry (regex over repo source)
  - pattern: "\\bcreateContext\\s*\\("
    min_files: 5
    signal: "Context created in 5+ files — check it isn't the app's state manager"
    hint: "Context is DI, not a store: every consumer re-renders on any value change — frequently-changing state belongs in a selector-based store (Zustand/Jotai) or use-context-selector"
