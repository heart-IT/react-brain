  - { pkg: "zustand", label: "Zustand", token: "zustand" }
  - { pkg: "jotai", label: "Jotai", token: "jotai" }
  - { pkg: "@reduxjs/toolkit", label: "Redux Toolkit", token: "rtk" }
  - { pkg: "react-redux", label: "Redux (react-redux)", token: "redux" }
  - { pkg: "redux", label: "Redux (classic)", token: "redux" }
  - { pkg: "@xstate/*", label: "XState", token: "xstate" }
