id: RB-E-STATE
topic: "Client & server state management"
category: state-and-data
group: app-architecture
status: reviewed   # first long-form entry written + source-checked → encyclopedia/RB-E-STATE.md
confidence: high
platforms: [react, react-native]
options:
  - { name: "useState/useReducer + Context", tradeoff: "Zero-dep; right for local state and low-frequency globals. Every Context consumer re-renders on any value change, so re-render scope is hard to control at scale." }
  - { name: "Zustand", tradeoff: "Tiny selector-based store with minimal boilerplate; selectors keep re-renders to the slice read. A State-of-React-2025 favorite (see note)." }
  - { name: "Jotai (3.x)", tradeoff: "Atomic, fine-grained subscriptions for naturally derived state. v3 (2026-09-08, verified vs npm) keeps the hooks API but is ESM-only, React 18+, Node ≥22.12, with atomFamily and the babel plugins split out (see migrate)." }
  - { name: "Redux Toolkit (2.x)", tradeoff: "Structured, devtools, larger surface; earns its weight on large teams with auditable transitions. React-Redux `connect` HOC deprecated → use hooks." }
  - { name: "XState (5.x) / XState Store", tradeoff: "State machines / statecharts for flows where legal transitions are the hard part; Store 4.x is a lighter signal-style store." }
  - { name: "TanStack Store / Signals", tradeoff: "Fine-grained reactive store (alien-signals core) underpinning TanStack Router/Table/Form; usually consumed transitively through those, not picked as the app store." }
  - { name: "Legend State", tradeoff: "Fine-grained observables + built-in sync/persistence; decouples ownership from subscription so re-renders push to leaf nodes; smaller ecosystem than Zustand/Jotai. npm latest 2.1.15 (2024-08-30), v3 on the beta tag (3.0.0-beta.48, 2026-07-12; verified vs npm 2026-09-24)." }
  - { name: "nuqs", tradeoff: "Type-safe view state in the URL query string: like useState, but shareable, bookmarkable and back-button-safe. A third bucket beside client and server state, not a store replacement. 2.10.1 (2026-08-25, verified vs npm); ~10.8k★. See note: URL STATE" }
  - { name: "TanStack Query", tradeoff: "For SERVER state/caching; pairs with a client-state lib, doesn't replace it (RB-E-DATA owns it)." }
recommend:
  default: "TanStack Query for server state + Zustand for client/UI state (React and React Native). They solve different problems and compose, so most apps run both. Deviate when the app needs almost no shared state, when legal transitions are the hard part, when state belongs in the URL, or when an existing store already works (see when)."
  when:
    - "tiny app / a few shared values → useState + Context (no library)"
    - "complex multi-step flows / statecharts → XState"
    - "already on Redux and it's fine → keep RTK (migrate only for a concrete pain)"
    - "already on MobX or Valtio and it works → keep it (store-to-store migrations rarely repay their cost; MobX 7 needs React 18+, see migrate)"
    - "want fine-grained atoms → Jotai (v3; see migrate for the v2-to-v3 move)"
    - "leaf-level re-render hot paths where ownership must be decoupled from subscription → Legend State (see reading 'How to Build the Fastest Apps: Break the Rules'; the principle also works with Jotai atoms or Zustand selectors)"
    - "state that must survive a refresh or a shared link (filters, tabs, pagination, search) → nuqs (in the URL, web; a third bucket, not a Zustand/Query replacement)"
note: >
  Server state (cached, can go stale, needs refetch/dedupe/invalidation) and client state (born and
  dies on the client) are different problems with different tools, so the default is a pair, not one
  library. State of React 2025 (3,760 devs): TanStack Query is the #1 React library; Zustand crossed
  50% usage and tops satisfaction; ~34% use no state library. Local-first (TanStack DB) builds on
  TanStack Query rather than replacing it.

  URL STATE (2026-09-10, verified vs nuqs changelog and adapter docs, GitHub and each app's package.json): the entry's
  'Component Communication Patterns' reading names URL params for view state as a decision axis;
  nuqs is the library for it. Adapters are all web (Next.js, React SPA, Remix, React Router,
  TanStack Router); 2.10 (2026-08-20) lets the React SPA adapter run server-rendered in Astro,
  Fastify or Hono via a serverSearch prop. In production in four census-cohort apps:
  Sentry 2.7.1, Cal.com 2.8.2, Supabase 2.7.1, Documenso ^2.8.9. That is a standing adoption level,
  not a week's movement: census saw them only once this entry gained the nuqs detect row.

  JOTAI 3 (2026-09-08, verified vs the v3 release and migration guide): a modernization, not a
  rewrite; an app on v2 with no deprecation warnings should run on v3 as is. The migrate rule owns
  the checklist.

  RB-E-DATA owns server state and local-first sync; RB-E-FORMS owns why form fields stay out of the
  global store; react-native-best-practices owns selector and re-render wiring rules.

  HISTORY:
    2026-09-10 GAP CLOSED: nuqs named for the URL view-state axis (reconciled from harvest/2026-09-03; the manual pass had judged it against RB-E-NAV instead of this entry); Jotai 3 migrate rule added.
    2026-06-25 CHALLENGED → SURVIVES (high): nothing has overtaken Zustand; local-first (TanStack DB) builds on TanStack Query rather than replacing it.
defer_to_skill: react-native-best-practices  # re-render/perf rules (e.g. RN-RULE-ATOMIC-STATE)
doc: "RB-E-STATE.md"   # long-form Explanation entry in content_dir
updated: 2026-09-24   # Legend State status (npm latest 2.1.15, v3 beta); nuqs 2.10 adapter scope corrected; prior 2026-09-10: nuqs named for the entry's existing URL-view-state axis — reconciled from harvest/2026-09-03 · Jotai 3 migrate rule (firsthand)
reading:
  - title: "Structural sharing, selectAtom, and why your Jotai atoms re-render too much"
    url: "https://www.peterp.me/articles/jotai-structural-sharing-vs-selectatom/"
    by: "Peter Piekarczyk"
    what: "The first Jotai-specific deep-dive here, for the entry's 'fine-grained atoms → Jotai' clause: Object.is propagation mechanics, why selectAtom is a trap (decompose into primitive atoms instead), and write-layer structural sharing à la React Query. The re-render discipline that makes atomic state actually fine-grained."
    claim: "You ship Jotai — selectAtom is a trap; decompose objects into primitive atoms and use write-layer structural sharing so atomic state is actually fine-grained (Object.is propagation decides what re-renders)."
    applies_when: { deps: ["jotai"] }
  - title: "How to Build the Fastest Apps: Break the Rules (App.js Conf 2026)"
    url: "https://www.youtube.com/watch?v=K3flMIHS-cI"
    by: "Jay Meistrich (Software Mansion) — author of Legend State / Legend List"
    what: "The performance case for signal/observable state. React's `render` over-orchestrates: `useState`/`useContext` couple state *ownership* with *subscription*, so lifting state up and over-subscribed context cascade re-renders top-down — measured ~10x CPU vs updating one leaf node. The fix ('render once'): create state without subscribing (observables / Reanimated shared values), own it high in the tree, push subscription down so only leaf nodes re-render themselves; provide stable objects through Context so the provider never re-renders; subscribe to derived values, not raw ids. Vendor talk (his own Legend State), but the ownership-vs-subscription principle is framework-agnostic and transfers to Jotai atoms, TanStack Store/Signals, and use-context-selector."
  - title: "React Query as a State Manager"
    url: "https://tkdodo.eu/blog/react-query-as-a-state-manager"
    by: "Dominik Dorfmeister (TkDodo), TanStack Query maintainer"
    what: "The canonical case for treating server state as its own thing (stale-while-revalidate, staleTime, query-key sharing) so you stop replicating it in a client store. The source of the server-state-vs-client-state split."
    claim: "You ship a client store but no server cache — server state (stale-while-revalidate, invalidation, retries) is a different problem; replicating it in the store is the classic mistake this piece dismantles."
    applies_when: { deps: ["zustand", "jotai", "@reduxjs/toolkit", "react-redux", "redux", "mobx", "valtio"], absent_deps: ["@tanstack/react-query", "swr", "@apollo/client", "urql", "@rocicorp/zero"] }
  - title: "Why React Context is Not a State Management Tool"
    url: "https://blog.isquaredsoftware.com/2021/01/context-redux-differences/"
    by: "Mark Erikson, Redux maintainer"
    what: "Draws the precise line between dependency injection (Context), client-state stores (Redux/Zustand), and async/server state — the vocabulary that justifies splitting the problem instead of forcing one tool to do all three."
    claim: "You ship no client store — Context is dependency injection, not state management; every consumer re-renders on any value change, so frequently-changing shared state belongs in a selector-based store."
    applies_when: { absent_deps: ["zustand", "jotai", "@reduxjs/toolkit", "react-redux", "redux", "mobx", "valtio", "xstate"] }
  - title: "How is Linear so fast? A technical breakdown"
    url: "https://performance.dev/how-is-linear-so-fast-a-technical-breakdown"
    by: "Dennis Brotzky (performance.dev)"
    what: "Breakdown of Linear's local-first architecture — IndexedDB as the primary store, optimistic updates, granular observables, aggressive code-splitting, GPU-only animation. The reference for building instant-feeling client-state apps."
  - title: "Component Communication Patterns in React Applications"
    url: "https://neciudan.dev/component-communication-patterns-in-react"
    by: "Neciu Dan"
    what: "A decision framework for WHERE state should live, keyed by component proximity × data type: props/callbacks for adjacent components, lifted state or composition for siblings, context for slow-changing globals, Zustand for frequently-updated client state, TanStack Query for server data, URL params for view state, events for fire-and-forget. 'Reach for the closest tool that can actually reach the problem, and only move outward when it stops working.' The how-to-choose guide that operationalizes this entry's server-vs-client-vs-view split."
  - title: "Do we need state management libraries anymore?"
    url: "https://neciudan.dev/do-we-need-state-management-libraries"
    by: "Neci Dan (neciudan.dev)"
    what: "The build-vs-buy answer behind this entry's '~34% use no state library' and 'don't add a lib' clauses. Reads Redux, Zustand, Jotai, MobX and Valtio under the hood and shows they all converge on the SAME React primitive — useSyncExternalStore — then builds a working store from scratch with selectors, showing which three problems the primitive solves for free and where the naive version loops infinitely. The point is not that libraries are useless but that you should know what ~50 lines of understood code buys you before adding a dependency: what you pay for is ergonomics, devtools and middleware, not the subscription mechanism."
    claim: "You ship a client store — every popular one converges on useSyncExternalStore; know what the primitive gives you for free (and where a hand-rolled selector store loops) so the dependency is bought for ergonomics/devtools, not for the mechanism."
    applies_when: { deps: ["zustand", "jotai", "@reduxjs/toolkit", "react-redux", "redux", "mobx", "valtio"] }
  - title: "The Absolute State of Management"
    url: "https://infrequently.org/2026/07/state-management/"
    by: "Alex Russell"
    what: "The vocabulary attack on this entry's own subject: Russell argues that Redux, MobX, Zustand — and React itself — don't MANAGE state, they PROPAGATE it, and that real state management is about time and conflicts (the problem CRDTs and sync engines actually solve). Deliberately provocative, and Redux maintainer Mark Erikson pushed back publicly, so read it as a framing argument rather than a verdict. Its durable value here is a third axis next to the client-vs-server split: when your problem is concurrent edits and reconciliation, no propagation library is the answer — that's the local-first/sync-engine row (TanStack DB, Zero — see RB-E-DATA)."
