reading:
  - title: "Migration to React Native in 2026 Starts With a Delivery Question"
    url: "https://www.callstack.com/blog/migration-to-react-native-in-2026-starts-with-a-delivery-question"
    by: "Michał Pierzchala (Callstack)"
    what: "The decision that comes BEFORE this entry's tooling: brownfield or greenfield. The framing is that the trigger for migrating is usually delivery cost (two implementation tracks, two review paths, two QA cycles, two release trains), and that the choice between paths is really a choice of where the risk sits during the transition. Brownfield keeps the native apps as the production host and moves one flow at a time — it preserves installed-app continuity (session state, secure storage, push identity, subscriptions, app extensions) and leaves a native fallback, at the cost of owning a runtime boundary (packaging, host integration, native↔RN navigation, shared state) while maintaining two surfaces at once. Greenfield builds a replacement and ships it under the same bundle ID — less architectural drag and a codebase agents work better in, but continuity becomes the risk: auth, deep links, push tokens, app groups, persisted data and analytics all have to survive the cutover, and mature products fail on accumulated behavior rather than on screens. The third option is the useful one: start greenfield with a fixed checkpoint and a REAL brownfield fallback, where the checkpoint tests product continuity (authenticated flows, analytics, accessibility, performance, at least one meaningful native boundary) and not just how fast screens get rebuilt."
    claim: "You are weighing a native→React Native migration — pick by where the risk can sit: brownfield preserves installed-app continuity but you own a runtime boundary; greenfield is cleaner but must reproduce auth, deep links and push identity before cutover."
    applies_when: { platforms: [react-native], stages: [production, scale] }
  - title: "Rebuilding the Doctolib Homepage from Webview to Native"
    url: "https://medium.com/doctolib/rebuilding-the-doctolib-homepage-from-webview-to-native-27937ea71801"
    by: "Doctolib"
    what: "Production case study migrating a 115M-hits/month homepage from WebView to native RN with a BFF-driven section architecture (~50% TTI improvement, measurable conversion gains). Durable brownfield-integration lessons."
  - title: "Unlocking Expo Updates in an Isolated Brownfield Architecture with SDK 55"
    url: "https://www.callstack.com/blog/unlocking-expo-updates-in-an-isolated-brownfield-architecture-with-sdk-55"
    by: "Callstack"
    what: "The capability-flip walkthrough behind this entry's note: running EAS/Expo Updates inside an isolated brownfield embed (XCFramework packaging via `npx brownfield package:ios`), which had been a hard limitation of embedded-RN architectures. Read when you need OTA on brownfield screens."
  - title: "React Native production lessons from React Universe Meetup x Zalando"
    url: "https://www.callstack.com/blog/react-native-production-lessons-from-react-universe-meetup-x-zalando"
    by: "Callstack"
    what: "Four hard-won production patterns — brownfield-handoff metrics (Meaningful Render), video-feed jank sequencing, native API bridging, on-device LLM hardware variance. Real-world scale-stage RN guidance."
