reading:
  - title: "Uppy 6.0"
    url: "https://uppy.io/blog/uppy-6.0/"
    by: "The Uppy team (Transloadit)"
    what: "Worth reading even if you never install Uppy, because the @uppy/aws-s3 rewrite is a case study in the failure mode that makes direct-to-S3 uploads flaky. The old plugin exposed up to eight callbacks (getUploadParameters, signPart, createMultipartUpload, listParts, abortMultipartUpload, completeMultipartUpload and friends) where WHICH subset you needed depended on whether you were doing multipart, whether Companion was involved, and whether you signed on the client — with nothing telling you up front, so people wired plausible-looking combinations that quietly did not work. The team's own diagnosis is the transferable part: the problem was the SHAPE of the API, not any individual bug in it. The replacement is three mutually exclusive signing modes — sign on the client with SigV4, bring your own signer, or let a server sign — and you pick exactly one. Two consequences beyond Uppy: the plugin now speaks to any S3-compatible service (R2, MinIO, DigitalOcean Spaces) with no provider-specific code, and their proxy is no longer required in the data path. The reliability bugs it closed name the hard parts of resumable upload precisely — retries with backoff, credential expiry, offline detection, and pause/resume races during multipart — which is a good checklist against your own implementation if you hand-rolled one. They also moved from mocks to testing against a real MinIO instance in CI, which is how several of those were found."
    claim: "You upload direct-to-S3/R2/MinIO — pick ONE signing mode (client SigV4, your own signer, or server-side) instead of assembling callbacks, and check yours against the hard parts: retry backoff, credential expiry, offline detection, multipart pause/resume races."
    applies_when: { platforms: [react, react-native] }
