id: RB-E-CALENDARS
topic: "Calendars, date pickers & event grids"
category: calendars
group: ui
status: reviewed   # long-form entry written + source-checked
confidence: low
platforms: [react, react-native]
options:
  - { name: "react-native-calendars (Wix)", tradeoff: "The long-standing de-facto RN calendar/date-marking suite (Agenda, Calendar, CalendarList): huge adoption, older architecture. 1.1314.0 (2026-01-29, verified vs npm)." }
  - { name: "@marceloterreiro/flash-calendar (2.x)", tradeoff: "Performance-first picker: windowed via a @shopify/flash-list >=2 peer dep, 18kb minified / 6kb gzip, theme-prop styling for design systems; picker/marking focus, not an event grid. 2.0.0 (2026-03-04, verified vs npm)." }
  - { name: "@super-calendar/native (2.x)", tradeoff: "Gesture-driven EVENT GRID (new in 2026): month/week/day/3-day/schedule, pinch-zoom time grid, drag-to-create/resize, recurring events, time zones; virtualized + paged; @super-calendar/dom renders the same core on web. 2.11.0 (2026-09-15, verified vs npm); see note: SUPER CALENDAR PEERS." }
  - { name: "react-native-calendar-strip (2.x)", tradeoff: "Horizontal week-strip header pattern; narrow use case. 2.2.6 is also the last publish (2022-05-11, verified vs npm)." }
  - { name: "web: FullCalendar / react-big-calendar", tradeoff: "Established web event-calendar components. react-big-calendar 1.20.0 (2026-06-01) is MIT; FullCalendar 7.1.0 (2026-09-05, both verified vs npm) is MIT for standard features, with timeline/resource views in a paid Premium tier; see note: FULLCALENDAR LICENSING." }
recommend:
  default: "Date picking / marked dates → react-native-calendars (the de-facto), or @marceloterreiro/flash-calendar when list performance and design-system theming matter. Native event grid with drag and pinch (day/week views) → @super-calendar/native — new in 2026, prototype on low-end devices first. Web event calendar → react-big-calendar; FullCalendar when you need its Premium timeline/resource views. Lightly vetted (confidence: low)."
  when:
    - "date picker / marked dates / agenda list → react-native-calendars"
    - "design-system theming + list-perf discipline → @marceloterreiro/flash-calendar (FlashList-windowed; 18kb min)"
    - "event grid with gestures (drag-to-create, resize, pinch-zoom day/week views) → @super-calendar/native (new — verify on-device perf; peers Reanimated 4.x + Gesture Handler + Legend List 3+)"
    - "event grid on web from the same core as native → @super-calendar/dom (same core as @super-calendar/native)"
    - "week-strip header UI → react-native-calendar-strip (unpublished since 2022 — pin and own it)"
    - "web scheduler/event calendar, MIT only → react-big-calendar"
    - "web scheduler needing timeline or resource views → FullCalendar (Premium tier, paid)"
note: >
  The durable split is PICKER/MARKING calendars (react-native-calendars, flash-calendar) vs full
  EVENT GRIDS (Super Calendar; FullCalendar / react-big-calendar on web). Most apps need the first;
  calendar-app UX needs the second. A picker windows date cells and answers taps; an event grid
  windows a time grid and answers drags and pinches, so the grid drags in a gesture + list stack the
  picker does not need. Lightly vetted (confidence: low) — treat each lane as a shortlist and
  prototype gesture perf on low-end devices before committing.

  SUPER CALENDAR PEERS (2026-09-24, verified vs npm @super-calendar/native 2.11.0): peer deps are
  react-native-reanimated >=4.0.0 <5, react-native-worklets >=0.5, react-native-gesture-handler
  >=2.16, @legendapp/list >=3, date-fns >=3, react-native >=0.74 → a Reanimated 3 app cannot adopt it
  without the Reanimated 4 upgrade (RB-E-ANIMATION owns that thread). Views, recurring events, time
  zones and the react-dom renderer verified vs its docs.

  FLASH CALENDAR (2026-09-24, verified vs its docs + npm): peer @shopify/flash-list >=2.0.0, so it
  pulls FlashList v2 into the app (RB-E-LISTS owns FlashList). Bundle 18kb minified / 6kb gzip per
  its docs.

  FULLCALENDAR LICENSING (2026-09-24, verified vs fullcalendar.io/pricing): standard features are
  MIT; Premium (timeline and vertical resource views among them) is a commercial license starting
  at $480 → react-big-calendar is the MIT default; FullCalendar is the pick when those views are
  the requirement.

  CALENDAR STRIP (2026-09-24, verified vs npm): 2.2.6 is from 2022-05-11 with no later publish →
  fine for a week strip you are willing to own; not a dependency to expect fixes from.

  HISTORY:
    2026-09-24 CORRECTED: flash-calendar "born at Shopify" is in neither its docs nor its repo (removed; it depends on Shopify's FlashList); FullCalendar "commercial-tier" made precise (MIT core, paid Premium); Super Calendar peer floors verified.
    2026-07-07 GAP CLOSED: entry created from two independent signals in one week (Super Calendar in TWiR #288, then headlining RN Rewind ~#48).
