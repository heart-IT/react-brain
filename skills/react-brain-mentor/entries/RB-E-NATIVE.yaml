reading:
  - title: "React Native Bridgeless: race conditions with concurrent JS runtimes"
    url: "https://ospfranco.com/concurrent-engines-crash/"
    by: "Oscar Franco (op-sqlite author)"
    what: "A native-module authoring rule extracted from a real op-sqlite crash, and it invalidates an assumption most C++ modules were written under. Under the old bridge a reload was strictly sequential — the outgoing runtime's invalidate() completed before the next generation's install() ran — so process-global module state (a static shared_ptr, a bool flag, a cached CallInvoker) was safe by construction, because only one generation could ever touch it. Bridgeless starts the new RCTInstance BEFORE the old one has finished invalidating and gives the old one only a few seconds to drain, so two runtime generations are genuinely alive at once. The crash: an in-flight SQLite query on a background thread is interrupted by a reload or OTA update and tries to schedule its error back onto the JS thread, by which time the new generation has already overwritten the global invoker — so the callback either runs on the wrong invoker or destroys JS objects off the JS thread. The fix generalizes past SQLite: give each generation its own liveness flag (a shared_ptr<atomic<bool>> that install() allocates and invalidate() flips for THAT generation only), and have every host object COPY the invoker and the liveness pointer into members at construction rather than reading the globals inside the callback — bind generation identity at creation, check it at run time. Fixed every update hook at once with no call-site changes."
    claim: "Your C++/JSI module keeps process-global state (a cached CallInvoker, a static registry) — Bridgeless overlaps two runtime generations on reload/OTA, so capture the invoker and a per-generation liveness flag at construction, never inside a callback."
    applies_when: { platforms: [react-native] }
  - title: "What It Actually Takes to Migrate Discord to React Native's New Architecture"
    url: "https://swmansion.com/blog/what-it-actually-takes-to-migrate-discord-to-react-native-s-new-architecture/"
    by: "Software Mansion (embedded ~1 year with Discord's iOS team)"
    what: "The post-flip half of a New-Architecture migration, which the official docs don't cover, told through one app at Discord's scale (Android first, then iOS). The headline is the ticket breakdown on the way back to parity: rendering/layout/visual 47%, crashes & stability 16%, build/infra/the migration ITSELF 14%, performance 13%, input (keyboard/gesture) 11% — i.e. flipping the switch is about one seventh of the work, and the rest is the app behaving differently under the new renderer. Three broken implicit contracts, each worth knowing before you hit it: (1) MEASUREMENT ORIGIN — old arch measured a view against the window, Fabric measures against its Yoga root, and a modal is its own root, so the same measure() returns different numbers inside a modal; the tell is a constant offset that looks like the height of something else. (2) VIEW IDENTITY — Fabric's view flattening is re-evaluated on every commit, and accessibility props are among those that force a real host view, so toggling accessibilityElementsHidden mid-gesture can swap the gesture's backing view and cancel it silently (onFinalize never runs); collapsable={false} pins it. (3) NATIVE LOOKUP — the legacy-interop layer finds a view manager by appending 'Manager' to the component name; a class named without that suffix misses the fast path, falls back to a main-thread-synchronous module creation while holding a registry write lock, and deadlocks against an in-flight animation's read lock. The advice that generalizes: budget for INVESTIGATION, not fixes (every story above ended in one prop, one helper, or a rename — the cost was finding it); the problems cluster where your app touches native (measurements, refs, gestures, imperative calls, interop-layer components) while pure React code comes through untouched; instrument before optimizing; and fix upstream rather than patch locally, because a local patch is tech debt every future upgrade must re-check."
    claim: "Migrating to the New Architecture: the flip is ~14% of the work and rendering/layout ~47%, so budget for the long tail and check three changed contracts — measure() origin in modals, view flattening cancelling gestures, interop 'Manager' lookups."
    applies_when: { platforms: [react-native] }
  - title: "An early look at Expo Modules 2.0"
    url: "https://expo.dev/blog/an-early-look-at-expo-modules-2-0"
    by: "Tomasz Sapeta (Expo)"
    what: "The first-party walkthrough of the API change behind this entry's Expo Modules 2.0 note: each 1.0 DSL component folded into ordinary Swift (Function/AsyncFunction → a method marked @JS, Property → a var, a record → a struct, an event → one typed callable property), with the migration path (both APIs coexist in one module; the expo-migrate-module agent skill does the Swift side and lists what it couldn't). Also states the mechanism behind the speedup — build-time signatures replace 1.0's per-call reflection — and what is NOT done yet: views, Android, generated TypeScript declarations, and documentation."
    claim: "You author Expo Modules — 2.0 replaces the result-builder DSL with annotated plain Swift/Kotlin (@ExpoModule/@JS/@Record); it is iOS-only and undocumented in SDK 57 (official beta lands in SDK 58), and both APIs coexist so you can migrate a function at a time."
    applies_when: { deps: ["expo-modules-core"], platforms: [react-native] }
  - title: "How to Make Pure JSI Code Faster in React Native (Part 1)"
    url: "https://blog.margelo.com/make-jsi-run-faster"
    by: "Alex Shumihin (Margelo)"
    what: "How JSI bindings actually work at the C++/Hermes boundary — HostFunction vs HostObject, the Object+NativeState pattern Nitro compiles down to, stack vs heap, minimizing JS-to-native crossings — with reproducible Hermes benchmarks. The runtime mechanics under Turbo/Nitro Modules."
    claim: "You ship Nitro Modules — the runtime mechanics it compiles down to: HostFunction vs HostObject, the Object+NativeState pattern, stack vs heap, and minimizing JS-to-native crossings, with reproducible Hermes benchmarks."
    applies_when: { deps: ["react-native-nitro-modules"], platforms: [react-native] }
  - title: "Making JSI Faster with More Efficient Data Structures (Part 2)"
    url: "https://blog.margelo.com/make-jsi-run-faster-2"
    by: "Alex Shumihin (Margelo)"
    what: "How data representation across the JSI boundary (array-of-objects vs flat array vs ArrayBuffer, numeric vs string contracts) can swing performance up to ~30x with no algorithmic change. First-principles guidance for New-Architecture native modules."
    claim: "You ship Nitro Modules — data representation across the JSI boundary (array-of-objects vs flat array vs ArrayBuffer, numeric vs string contracts) can swing performance up to ~30x with no algorithmic change."
    applies_when: { deps: ["react-native-nitro-modules"], platforms: [react-native] }
  - title: "How Margelo Helped Discord Improve React Native's New Architecture Performance"
    url: "https://blog.margelo.com/margelo-discord-react-native-performance"
    by: "Hanno Gödecke (Margelo)"
    what: "Low-level New-Architecture jank postmortem: Reanimated's cloneShadowTreeWithNewProps over-cloning the Fabric shadow tree plus redundant layout passes for non-layout props, with fixes upstreamed. Canonical Fabric / New-Arch internals."
    claim: "You ship Reanimated on the New Architecture — the canonical Fabric jank postmortem: cloneShadowTreeWithNewProps over-cloning the shadow tree plus redundant layout passes for non-layout props, with fixes upstreamed."
    applies_when: { deps: ["react-native-reanimated"], platforms: [react-native] }
  - title: "Four Years of React Native Quick Crypto: From Wallets to Node Parity"
    url: "https://blog.margelo.com/four-years-of-react-native-quick-crypto"
    by: "Brad Anderson (Margelo)"
    what: "A four-year native-library architecture case study: wrapping OpenSSL for Node behavior-parity, a sync-first threading model with async escape hatches, the hand-written-JSI to Nitro codegen migration, and security audit as architecture validation. Generalizable lessons for native-module authors."
  - title: "The Memory Hermes Can't See: Stale Shadow Nodes in React Native"
    url: "https://swmansion.com/blog/the-memory-hermes-cant-see-stale-shadow-nodes-in-react-native/"
    by: "Tomasz J. Żelawski (Software Mansion)"
    what: "The memory-leak sibling of the Discord jank postmortem above: Fabric ShadowNodes are C++ objects retained via JS wrapper objects, so unmounted views' wrappers can pin whole shadow-tree revisions (amplified by Reanimated's per-frame revision cloning) — and none of it appears in Hermes heap snapshots, because the retained memory sits outside the JS heap. The author's two candidate mitigations (periodic forced GC; per-wrapper setExternalMemoryPressure) are both judged not production-ready — this is debugging awareness, not a shipped fix. (2026-08-05)"
    claim: "You debug memory on the New Architecture — Hermes heap snapshots cannot see retained Fabric ShadowNodes (C++ memory pinned by JS wrappers), so a flat JS heap with growing process memory means profile the native side too."
    applies_when: { platforms: [react-native] }
