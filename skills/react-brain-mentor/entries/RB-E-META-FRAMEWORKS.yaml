id: RB-E-META-FRAMEWORKS
topic: "Meta-frameworks (full-stack React)"
category: meta-frameworks
group: app-architecture
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-META-FRAMEWORKS.md
confidence: medium
platforms: [react, react-native]
options:
  - { name: "Next.js (16.x)", tradeoff: "most-used; App Router + RSC + Server Actions; Adapter API STABLE in 16.2 (co-designed w/ OpenNext/Netlify/Cloudflare — verified adapters: Vercel + Bun shipped, others in dev) settles off-Vercel portability; frequent security patches" }
  - { name: "TanStack Start", tradeoff: "Vite-based (Rsbuild 2 also supported since 2026-06); RSC support EXPERIMENTAL (into early v1), SSR, Server Functions; deliberately omits Server Actions for security; less opinionated than Next; hosting is no longer the differentiator it reads as — Vercel became a Gold TanStack partner 2026-09-08 with a first-party Start deployment guide (Git deploys + preview URLs), so Start and Next both run there" }
  - { name: "React Router 7 (framework mode) / Remix", tradeoff: "Remix merged into React Router 7; full-stack loaders/actions; Remix 3 is a separate JSX-component pivot away from RR" }
  - { name: "Expo Router", tradeoff: "the RN/universal meta-framework; SDK 56 decoupled from React Navigation; web SSR (alpha)" }
  - { name: "Astro / Waku / RedwoodSDK", tradeoff: "Astro = content/islands; Waku 1.0-rc (rc.0 2026-08-25, verified vs npm) = minimal RSC — its SLICES (reusable components w/ independent render config; lazy slices ≈ Astro server islands, mixable across static/dynamic pages) are its distinctive feature; RedwoodSDK 1.0 = Vite+RSC+Cloudflare" }
  - { name: "Vinext (Cloudflare)", tradeoff: "Vite-based Next.js rebuild; 1.0.0-beta (2026-07-04, verified vs npm) drops the experimental label — maturing, but AI-generated origins + the security issues Vercel flagged warrant re-verification before any production bet" }
recommend:
  default: "Web: Next.js is the safe default; choose TanStack Start when you want a less-opinionated, Vite-native full-stack alternative (Server Functions stable; RSC opt-in and still experimental; Start itself is v1 RC). RN/universal: Expo Router."
  when:
    - "content/marketing site → Astro (ship less JS)"
    - "Cloudflare-first stack → RedwoodSDK"
    - "want minimal RSC, no lock-in → Waku (RC as of 2026-08-25; 1.0-stable tripwire wired)"
    - "evaluating Vinext → not production-ready; don't bet on it yet"
note: >
  REMIX 3 RC (2026-09-01, verified vs the Remix blog; adopted from harvest/2026-09-03): a release
  candidate for the separate-from-React-Router Remix 3 — one `remix` package bundling database
  management, schema validation, a type-safe router, an unbundled asset server and a new UI runtime.
  The post commits to RELEASING Remix 3 on 2026-10-02 at Remix Jam, and separately discusses what
  remains before they would call it stable (bug cleanup, security audits, early-adopter feedback,
  docs) — so treat 2026-10-02 as the ship date, not a stability guarantee. Not an option row yet:
  no production track record. Revisit after the release.
  Distinct from routing (RB-E-NAV): these own SSR/RSC/data/build. Context-key by hosting target +
  how much RSC you actually need. UPDATE 2026-07-10 (React Weekly, verified): Next.js Adapter API
  went STABLE in 16.2 with a shared public test suite + an Ecosystem Working Group — the durable
  answer to "can I run Next off Vercel"; TanStack Start's RSC support is explicitly EXPERIMENTAL
  into early v1 (don't sell Start as an RSC-parity Next alternative yet); adoption signal —
  Lovable (the largest AI app-builder) defaults new projects to TanStack Start SSR since 2026-05.
  CHALLENGE-PASS CAVEATS (2026-07-10, fetch-verified): Start's npm download surge (~60x since
  Jan 2026) is inflated by Lovable's platform CI — raw downloads ≠ team adoption; Next held flat
  (~160-175M/mo). And Next security releases DON'T BACKPORT: the May-2026 release (13 advisories,
  7 High, incl. upstream RSC CVE-2026-23870) patched only 15.5.18/16.2.6 — choosing Next commits
  you to tracking latest minors. UPDATE (2026-07-20, verified vs the first-party program post):
  security releases are now SCHEDULED — monthly advance notice on the Next.js blog (expected
  date + highest anticipated severity); the first one landed 2026-07-20 (verified vs the release
  post): 4 High + 5 Medium CVEs, patched in v16.2.11 (Active LTS) and v15.5.21 (Maintenance LTS)
  only — the no-backport rule above still holds, the DATE is what became predictable. Ad-hoc
  patches remain for in-the-wild exploits. Predictable upgrade
  windows soften (not remove) the track-latest-minors commitment. The August 2026 release
  (verified vs the release post) showed the program's limits both ways: pre-announced 2026-08-20
  as ONE critical, it shipped 2026-08-25 — a day EARLY, after a second critical was found — with
  TWO unauthenticated RCEs patched in 16.3.3/15.5.24: CVE-2026-75604 (GHSA-p293-qw3h-jr36,
  Windows-hosted servers only, Pages Router + App Router without Cache Components, no workaround)
  and GHSA-2xp9-vwfh-vxw4 (RCE via attacker-controlled AVIF in the Image Optimization API —
  upstream libheif via sharp; the patch DISABLES AVIF optimization until upstream propagates,
  i.e. a fix that removes a feature). Stress-tested 2026-07-10 (WEAKENED → caveats applied; the
  Next-default and the how-much-RSC context-key both SURVIVED the migration-wave attack).
  LANDSCAPE (2026-07-16 back-audit, verified vs the Vercel post): Vercel and Shopify are
  REBUILDING HYDROGEN together — Shopify's React meta-framework consolidating toward the
  Vercel/Next stack rather than remaining an independent Remix-lineage framework; Waku's
  slices fact verified vs Daishi Kato's first-party post.
