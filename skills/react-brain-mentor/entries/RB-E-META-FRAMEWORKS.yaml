id: RB-E-META-FRAMEWORKS
topic: "Meta-frameworks (full-stack React)"
category: meta-frameworks
group: app-architecture
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-META-FRAMEWORKS.md
confidence: medium
platforms: [react, react-native]
options:
  - { name: "Next.js (16.x)", tradeoff: "Most-used; App Router + RSC + Server Actions. Adapter API STABLE in 16.2 (co-designed w/ OpenNext/Netlify/Cloudflare — verified adapters: Vercel + Bun shipped, others in dev) settles off-Vercel portability. Security fixes land only on the latest minors; 16.4.0 (2026-10-06, verified vs npm + the 16.4 post) makes Cache Components the recommended model, and 16.4.5 / 15.5.29 (2026-11-03) are the current SECURITY floor (one high + six medium, four of them `use cache` / Cache Components cross-user disclosure or poisoning, on top of the 2026-10-14 critical RCEs fixed in 16.4.1 / 15.5.28; npm latest 16.4.6). See note: NEXT SECURITY, NEXT 16.4" }
  - { name: "TanStack Start", tradeoff: "Vite-based (Rsbuild 2 also supported since 2026-06); SSR + Server Functions; deliberately omits Server Actions for security; less opinionated than Next. 1.0 STABLE since 2026-10-13 (verified vs the 'TanStack Start 1.0 is Stable' post; npm @tanstack/react-start 1.169.2) — a formal API commitment; RSC stays opt-in and EXPERIMENTAL per its docs. Hosting no longer separates it from Next. See note: TANSTACK START" }
  - { name: "React Router 8 (framework mode) / Remix", tradeoff: "Remix merged into React Router; full-stack loaders/actions. Remix 3 is a separate JSX-component pivot away from RR (see note: REMIX 3). RB-E-NAV owns React Router versions and its security floor." }
  - { name: "Expo Router", tradeoff: "The RN/universal meta-framework; decoupled from React Navigation since SDK 56; SDK 58 (stable 2026-10-15) makes data loaders, SSR and middleware stable with no experimental flags (RB-E-NAV owns the detail)." }
  - { name: "Astro / Waku / RedwoodSDK", tradeoff: "Astro = content/islands; Waku 1.0-rc (rc.2 2026-09-28, verified vs npm) = minimal RSC whose SLICES are its distinctive feature (see note: WAKU); RedwoodSDK 1.x = Vite+RSC+Cloudflare." }
  - { name: "Vinext (Cloudflare)", tradeoff: "Vite-based Next.js rebuild; reached STABLE 1.0 (2026-09-28, verified vs npm + the Cloudflare post) — Pages Router support added (was App Router only), >99% compat on customer-requested features, 'cache warming' moves prerendering from build time to Cloudflare's network, two-command migration (vinext check && vinext init). Cloudflare states production customers on high-traffic apps; still re-verify the AI-generated origins + the security issues Vercel flagged before your own production bet." }
recommend:
  default: "Web: Next.js is the safe default; choose TanStack Start when you want a less-opinionated, Vite-native full-stack alternative (Start 1.0 stable since 2026-10-13; RSC opt-in and still experimental). Picking Next commits you to tracking its latest minors, because security fixes do not backport (current floor 16.4.5 / 15.5.29). RN/universal: Expo Router."
  when:
    - "content/marketing site → Astro (ship less JS; Owner moved 10K+ Next.js sites to Astro islands and cut p75 LCP 5.4s → 0.7s — see reading)"
    - "Cloudflare-first stack → RedwoodSDK"
    - "want minimal RSC, no lock-in → Waku (RC as of 2026-09-18; 1.0-stable tripwire wired)"
    - "full-stack loaders/actions on an existing React Router app → React Router 8 framework mode (RB-E-NAV owns its security floor)"
    - "evaluating Vinext → reached stable 1.0 with claimed production customers; still re-verify independently before your own production bet (AI-generated origins, unresolved security concerns Vercel raised)"
note: >
  A meta-framework owns SSR/RSC, data loading, the server boundary and the build; routing alone is
  RB-E-NAV's. Context-key the pick by hosting target and by how much RSC you actually need. Next.js
  stays the default because it is the most-used and most complete RSC + Server Actions stack, and the
  stable 16.2 Adapter API (with a shared public test suite and an Ecosystem Working Group) is the
  durable answer to "can I run Next off Vercel". Its cost is a security cadence that only patches
  the latest minors. TanStack Start is the considered alternative, but its RSC is experimental, so
  do not sell it as an RSC-parity Next replacement.

  NEXT SECURITY (verified vs the Next.js security-program post, the July/August/September release
  posts and GHSA-vcvr-r3jv-pc5j): fixes do not backport. The May 2026 release (13 advisories, 7 High,
  incl. upstream RSC CVE-2026-23870) patched only 15.5.18/16.2.6. Since 2026-07-20 releases are
  scheduled monthly with advance notice on the Next.js blog (expected date + highest anticipated
  severity); ad-hoc patches remain for in-the-wild exploits. JULY (2026-07-20): 4 High + 5 Medium,
  patched in 16.2.11 (Active LTS) and 15.5.21 (Maintenance LTS) only. AUGUST: pre-announced
  2026-08-20 as one critical, shipped 2026-08-25, a day early, after a second critical was found —
  two unauthenticated RCEs patched in 16.3.3/15.5.24: CVE-2026-75604 (GHSA-p293-qw3h-jr36,
  Windows-hosted servers only, Pages Router + App Router without Cache Components, no workaround)
  and GHSA-2xp9-vwfh-vxw4 (attacker-controlled AVIF in the Image Optimization API, upstream libheif
  via sharp; the patch disables AVIF optimization until upstream propagates, a fix that removes a
  feature). SEPTEMBER: an out-of-band release on 2026-09-22 (16.3.6 Active LTS / 15.5.26
  Maintenance LTS) for CRITICAL GHSA-vcvr-r3jv-pc5j (CVSS 9.5), RCE in the Node next/og
  ImageResponse via improper escaping in Satori's SVG output. Affected: >=16.2.0 <16.3.6, and only
  where attacker-controlled values reach SVG content, attributes or styles (if you cannot upgrade,
  don't pass them); the Edge ImageResponse is not affected, and 15.x is not vulnerable (15.5.26 is
  hardening only). The scheduled September release (16.3.7, 2026-09-29) was a bug-fix-only build with
  no security content; the actual scheduled fixes shipped 2026-09-30 as 16.3.8 / 15.5.27 and covered
  7 of the originally-announced 9 vulnerabilities — 1 High: CVE-2026-94483/GHSA-cjq9-62q9-8jv4 (SSRF
  via an allow-listed remote URL in Image Optimization; unaffected if images.remotePatterns is
  unconfigured); 5 Medium: CVE-2026-94543/GHSA-4jqv-mc3x-m676 (self-hosted Pages Router SSG/ISR
  cache-entry cross-route substitution), CVE-2026-94484/GHSA-mcj8-r9mp-w47p (root catch-all +
  SSG/ISR cache poisoning from one unauthenticated request → cross-user content + persistent DoS),
  CVE-2026-94485/GHSA-f87g-xv8r-7p7x (App Router metadata image routes ignore dynamicParams on
  webpack builds; Turbopack unaffected), GHSA-h694-7cp9-m8p3 (nested 'use cache' functions mis-key on
  a root param, leaking non-attacker-controlled cached content across param values), and
  CVE-2026-94544/GHSA-3w37-wq28-93x7 (pending 'use cache' fills leak Draft Mode content into
  regular/persisted responses when Cache Components + Draft Mode previews overlap); 1 Low:
  CVE-2026-94486/GHSA-39w2-rjm5-chcv (next dev's MCP endpoint lacks origin checks, letting a
  malicious site read disk paths/source snippets/routes/logs off a developer's machine). The
  remaining 2 (1 Critical, 1 High) were POSTPONED for upstream coordination with no committed date.
  OCTOBER (pre-announced 2026-10-08 for 2026-10-14, shipped on that date as 16.4.1 Active LTS /
  15.5.28 Maintenance LTS; verified vs the security-update post, the three GHSAs and npm): three
  upstream-rooted fixes, two of them the September postponements. CRITICAL GHSA-673q-mjm6-r5xr:
  unauthenticated RCE in App Router apps using Cache Components when a `use cache` function returns
  multiple typed arrays; affects >=16.0.0 <=16.4.0, no workaround (upstream React GHSA-xqc2-xf4c-x3h3,
  RB-E-SECURITY). CRITICAL CVE-2026-96889 / GHSA-2464-fhr4-w9xw: RCE through a memory bug in the
  upstream Image Optimization library when SVG is used, on glibc-based Linux; affects >=10.0.0
  <=15.5.27 and >16.0.0 <=16.4.0; workaround: make sure Next's sharp is >=0.35.5. HIGH
  GHSA-p3m5-59mp-jv5r: CPU-exhaustion DoS from crafted requests against App Router apps with at least
  one Server Action (Pages Router and apps without Server Actions are not affected); affects >=13.0.0
  <=15.5.27 and >=16.0.0 <=16.4.0 (upstream React GHSA-h3gv-c5rc-p453). The September backlog is now
  closed.
  NOVEMBER (pre-announced 2026-10-27, shipped 2026-11-03 as 16.4.5 Active LTS / 15.5.29 Maintenance
  LTS; verified vs the security-release post, its GHSAs and npm): a Cache Components release, 1 High +
  6 Medium. HIGH GHSA-mfr8-8qww-v76h: cross-tenant cache disclosure when one public `use cache`
  function that reads a root param is called both directly and inside `unstable_cache`. MEDIUM:
  GHSA-vc7v-qv4w-wrv8 (nested `use cache` stored before its root-param dependencies are recorded),
  GHSA-rhh4-g77r-r9qj (distinct binary `use cache` arguments collide on one cache identity →
  cross-user disclosure / poisoning), a shared-shell cache poisoning on self-hosted `next start`,
  cross-client response injection through stale compressed response framing (self-hosted),
  GHSA-f3mh-rxg3-f5g2 (HttpOnly cookie values exposed through an internal response header in Edge
  routes) and an SVG rejection bypass in Image Optimization. The four cache issues need Cache
  Components (16.x); the others are also fixed in 15.5.29. Floors → 16.4.5 / 15.5.29 (npm latest
  16.4.6, 2026-11-09). Vercel's 2026-11-17 post counts 6 advisories in 2024, 14 in 2025 and 51 in
  2026, attributes the rise to AI-assisted discovery rather than worse code, and adds a `next dev`
  warning when the installed version has a known vulnerability. → The model this entry now
  recommends (Cache Components) is where most 2026 Next advisories land; treat the monthly security
  release as a standing dependency chore, and see RB-E-SECURITY's REACT2STEAL note for what an
  unpatched server costs.
  Consequence: the schedule makes dates predictable but has already slipped early, gone out-of-band,
  split across three releases (16.3.6/.7/.8) inside eight days, and still has a critical outstanding
  — budget for tracking latest minors continuously, not for a monthly slot.

  NEXT 16.3 (2026-08-03, verified vs nextjs.org/blog/next-16-3 and npm): 16.3 is stable. Instant
  navigations (Cache Components + Partial Prefetching) remain opt-in via the cacheComponents and
  partialPrefetching flags, which the team plans to make default in a future major.

  NEXT 16.4 (2026-10-06, verified vs nextjs.org/blog/next-16-4 and npm `latest` 16.4.0): the team now
  recommends Cache Components "as the best choice for every Next.js app", create-next-app enables it
  by default, and it "will become the default in Next.js 17" (the model = cacheComponents +
  partialPrefetching). New: `export const ensureStatic = 'navigation' | 'prefetch' | 'shell'` fails
  the build if dynamic content enters a route or layout; `await navigation()` / `await prefetch()`
  from next/cache defer cached work out of a prefetch or shell. `next upgrade --agent` drives an
  agent upgrade, and experimental.agentUpgrade nudges during dev/build ('security' is the default
  policy: remind on upgrades that fix vulnerabilities in the installed version). Ships React 19.3;
  Turbopack disk cache 20-25% smaller. → New Next apps should start on Cache Components; existing
  apps should plan the migration before 17 rather than at it. The 16.4 post names no security
  fixes; 16.4.1 (2026-10-14) is the security patch that closes the September postponements (see
  NEXT SECURITY, OCTOBER) — and its critical RCE sits in Cache Components' `use cache` path, so a
  16.4.0 app that just adopted the new default needs 16.4.1.

  TANSTACK START (2026-07-10, verified vs React Weekly; 2026-09-08 vs the TanStack–Vercel
  partnership post; 1.0 status 2026-10-15 vs the 1.0 post and the Server Components docs): 1.0 IS
  STABLE (post dated 2026-10-13, "officially call it ready for production"; npm versions were
  already 1.x, so the stability is a declared API commitment, not a version-number change — npm
  1.169.0 published 2026-10-12, latest 1.169.2). RSC is still marked "experimental! The API may see
  refinements" in the docs and is not enabled by default; the post adds that tanstack.com itself
  stopped using RSC after finding it hard to reason about what ships where, so RSC stays a
  per-feature opt-in rather than Start's model. A critical reflected-XSS CVE (CVE-2026-102989,
  2026-09-30) was patched at @tanstack/react-start ≥1.168.60 — floor and detail owned by RB-E-SECURITY.
  Lovable, the largest AI app-builder, defaults
  new projects to Start SSR since 2026-05, and that inflates Start's npm surge (~60x since Jan 2026)
  through platform CI, so raw downloads are not team adoption; Next held flat (~160-175M/mo). Vercel
  became a Gold TanStack partner on 2026-09-08 with a first-party Start deployment guide (Git deploys
  + preview URLs), so Start and Next both run there and hosting is no longer a differentiator.

  REMIX 3 (2026-09-01, verified vs the Remix blog; npm 2026-09-24): a release candidate for the
  separate-from-React-Router Remix 3 — one `remix` package bundling database management, schema
  validation, a type-safe router, an unbundled asset server and a new UI runtime (3.0.0-rc.3 on
  npm's next tag, 2026-09-18). The post commits to releasing on 2026-10-02 at Remix Jam and
  separately lists what remains before they would call it stable (bug cleanup, security audits,
  early-adopter feedback, docs): 2026-10-02 is a ship date, not a stability guarantee. SHIPPED
  (2026-10-15, verified vs the remix@3.0.0 GitHub release and npm): remix 3.0.0, "First stable
  release of Remix 3", published 2026-10-01 and now npm `latest`. It is not a React framework — its
  own component runtime and JSX (`jsxImportSource: "remix/component"`; the RC's `remix/ui` entry
  points were renamed to `remix/component` at 3.0.0), and its UI primitives and animation helpers
  moved out to `@remix-run/ui`, which stays unstable 0.x. → A React app does not upgrade into Remix
  3; React Remix lives on as React Router (RB-E-NAV). Still not an option row: no production track
  record, and it leaves this entry's React scope. First hands-on (Marmelab, 2026-11-12, see
  reading): the same app built in Remix v3 and TanStack Start performed at parity; what Remix v3
  lacked was ecosystem (no Vite plugins, no Vitest, no React libraries).

  WAKU (verified vs Daishi Kato's post and npm): slices are reusable components with independent
  render config; lazy slices resemble Astro server islands and mix across static and dynamic pages.
  1.0.0-rc.2 (2026-09-28, verified vs npm; no notable changes surfaced over rc.1).

  LANDSCAPE (2026-07-16, verified vs the Vercel post): Vercel and Shopify are rebuilding Hydrogen
  together, moving Shopify's React meta-framework toward the Vercel/Next stack rather than an
  independent Remix-lineage framework. DONE (2026-10-14, verified 2026-11-25 vs the Shopify changelog
  and npm): Hydrogen 2026-10 is GA as a framework-agnostic LIBRARY, no longer a framework built on
  React Router — @shopify/hydrogen 2026.10.x ("Framework-agnostic Shopify storefront SDK and agent
  skills"; latest 2026.10.3) makes react, vue and vite OPTIONAL peers, where 2026.4.x pinned
  react-router. Cart, variants, Markets pricing, consent-aware analytics, Shop Pay and customer
  accounts go inside YOUR framework (React Router and Next.js starters; host anywhere). → Shopify
  commerce no longer picks your meta-framework.
  NO META-FRAMEWORK AT SCALE (2026-11-04, X; content verified via Wayback snapshot 2026-11-15, see
  reading): x.com's rebuilt web app assembles streaming React SSR from Vite + Fastify + Relay rather
  than adopting a meta-framework — a documented third path beside Next and Start for a team that
  owns its server. RB-E-CROSSPLATFORM owns its React-Native-for-Web half.

  RB-E-NAV owns routing and the React Router security floor; RB-E-SECURITY owns the Server-Function
  attack surface; RB-E-REACT-CORE owns the RSC primitive.

  HISTORY:
  2026-11-25 REOPENED: Next.js November security release 16.4.5 / 15.5.29 (1 high + 6 medium, Cache Components-heavy; 51 advisories in 2026); Hydrogen 2026-10 GA as a framework-agnostic library; Expo Router SDK 58 stable. READINGS: Owner Next.js → Astro (p75 LCP 5.4s → 0.7s), Nolan Lawson agent cost-to-build across 12 frameworks, e18e Framework Performance project, Marmelab Remix v3 vs TanStack Start, X's streaming SSR without a meta-framework.
  2026-10-15 REOPENED: Remix 3.0.0 stable (2026-10-01, npm latest) — REMIX 3 note updated: not React (remix/component JSX runtime), @remix-run/ui unstable 0.x; still no option row.
  2026-10-15 REOPENED: Next.js October security release 16.4.1 / 15.5.28 (GHSA-673q-mjm6-r5xr critical `use cache` typed-array RCE, CVE-2026-96889 critical Image Optimization SVG RCE, GHSA-p3m5-59mp-jv5r high Server Actions DoS) — the September postponements are closed; TanStack Start 1.0 declared stable (2026-10-13), RSC still experimental.
  2026-10-08 REOPENED: Next.js 16.4 — Cache Components recommended for every app, default in create-next-app, default in Next 17; ensureStatic; next upgrade --agent.
    2026-10-01 REOPENED: Vinext reached stable 1.0 (Pages Router support, >99% compat, cache-warming, Cloudflare claims production customers) — the option row's "not production-ready" stance softened, caveats kept.
  2026-10-01 ⚡TRIP FIRED (next ≥16.3.7): the scheduled September security release shipped 2026-09-30 as 16.3.8/15.5.27 (16.3.7 itself, 2026-09-29, carried no security content) — 7 of 9 announced vulnerabilities patched (1 High, 5 Medium, 1 Low; CVEs/GHSAs now in the SEPTEMBER note), 2 (1 Critical, 1 High) postponed for upstream coordination; also added the TanStack Start critical-XSS pointer (RB-E-SECURITY owns CVE-2026-102989).
    2026-09-24 CORRECTED: Next.js 16.3 shipped stable 2026-08-03 (the 16.3 reading still called it a preview); Waku is at rc.1; Expo Router SSR is no longer alpha in SDK 58.
    2026-07-10 CHALLENGED → WEAKENED: caveats applied (Start RSC experimental, download surge inflated by Lovable CI, no backports); the Next default and the how-much-RSC context-key SURVIVED the migration-wave attack.
