reading:
  - title: "How we migrated lovable.dev away from Next.js and turned it into another Lovable app"
    url: "https://lovable.dev/blog/how-we-migrated-lovable-dev-away-from-nextjs"
    by: "Lovable (2026-08-18)"
    what: "The detailed writeup behind this entry's held Lovable fact, and the largest public Next→Start migration on record: lovable.dev (42M+ monthly uniques, ~400 routes, 910K+ lines of non-generated code) moved off Next.js/Vercel onto TanStack Start, with the mechanical code-move AI-assisted. The comparison section is the durable part, and it cuts both ways: Vite dev server at 10s start / 1.5GB RAM vs 70s / 8GB for Next 16.2+Turbopack on the same codebase (they note 16.3 claims up to 90% dev-server memory reduction); fewer server/client abstractions to hold in your head; agents make fewer framework mistakes on Start (their read: a small consistent training corpus beats a large self-contradictory one, because Next 12/14/16 answers pollute each other); BUT production bundling needed 'quite a bit of low-level configuration' where Next.js is efficient out of the box."
    claim: "You're weighing Next.js vs TanStack Start — Lovable's 910K-LOC migration reports lighter dev loops, fewer abstractions, fewer agent mistakes on Start; the cost is hand-tuned production bundling Next gives you out of the box."
    applies_when: { deps: ["next", "@tanstack/react-start"], platforms: [react] }
  - title: "Who Owns the Tree? RSC as a Protocol, Not an Architecture"
    url: "https://tanstack.com/blog/who-owns-the-tree"
    by: "TanStack"
    what: "Argues RSC is a serialization protocol that enables both server-owned and client-owned trees, contrasting TanStack Start's inversion-of-control with Next.js's server-owned model. The durable mental model for reasoning about RSC across frameworks."
  - title: "React Server Components in TanStack"
    url: "https://frontendmasters.com/blog/react-server-components-in-tanstack/"
    by: "Adam Rackis (Frontend Masters)"
    what: "First-principles RSC tutorial grounded in TanStack Start's explicit API (createServerFn, renderServerComponent), contrasted with Next.js's implicit model, with honest use-case scoping and bundle-size results."
    claim: "You ship TanStack Start — its RSC model is explicit (createServerFn, renderServerComponent) and still EXPERIMENTAL into early v1; this grounds what Start's RSC actually buys (use-case scoping, bundle-size results) before you lean on it."
    applies_when: { deps: ["@tanstack/react-start"] }
  - title: "Moving Railway's frontend off Next.js"
    url: "https://blog.railway.com/p/moving-railways-frontend-off-nextjs"
    by: "Victor Ramirez (Railway)"
    what: "Migration postmortem — 200+ routes off Next.js onto Vite + TanStack Start (10min→<2min builds), with the reasoning for when a client-centric app outgrows a server-first meta-framework. A concrete decision case study."
    claim: "You ship Next.js — Railway's 200+-route migration to Vite + TanStack Start (10min→<2min builds) is the concrete decision case for when a client-centric app outgrows a server-first meta-framework."
    applies_when: { deps: ["next"] }
  - title: "use client in Next.js"
    url: "https://punits.dev/blog/use-client-in-nextjs/"
    by: "Punit Sethi"
    what: "The mental model for the use-client boundary — it does NOT disable SSR — plus its three real costs (bundle, hydration, fetch waterfalls), with measured comparisons and the server-component-as-prop technique. Durable RSC fundamentals."
    claim: "You ship Next.js — 'use client' does NOT disable SSR; its real costs are bundle, hydration, and fetch waterfalls, and the server-component-as-prop technique keeps subtrees on the server."
    applies_when: { deps: ["next"] }
  - title: "Next.js 16.3: Instant Navigations (16.3 Preview)"
    url: "https://nextjs.org/blog/next-16-3-instant-navigations"
    by: "Andrew Clark & Josh Story (Next.js team)"
    what: "How Next.js closes RSC's biggest UX gap — slow navigations — with Cache Components + a per-route Stream/Cache/Block choice and Partial Prefetching (one reusable per-route shell instead of a prefetch per link). The durable mental model for server-driven-but-instant navigation; covers a facet the other RSC readings don't. Gated behind cacheComponents/partialPrefetching flags (16.3 Preview, not yet stable — verify before quoting as GA)."
  - title: "We Stopped Using RSC on TanStack.com"
    url: "https://tanstack.com/blog/we-stopped-using-rsc-on-tanstack-com"
    by: "Tanner Linsley (TanStack)"
    what: "The reversal of the adoption post this entry already cites in sources — read them as a pair. RSC did work: moving markdown + Shiki highlighting to the server cut client JS by ~153KB gzipped on blog/docs pages, took /blog/react-server-components from Lighthouse 52→74 and TBT 1,200ms→260ms. The reversal argument is that the win came from KEEPING A HUGE DEPENDENCY OUT OF THE BROWSER, not from the architecture: once they replaced the 358KiB markdown/highlighting stack with small purpose-built packages (~27KiB transferred, only ~18–19KiB more than the RSC version), plain SSR + server functions held the performance and the RSC machinery — bundler config, serialization boundaries, special files, runtime-boundary rules — was left with nothing to pay for. The honest context-key for 'how much RSC do you actually need': measure whether your case is a dependency problem before you make it an architecture problem."
    claim: "You ship RSC — its clearest concrete benefit is keeping heavy server-only dependencies out of the browser; TanStack's reversal shows that when the dependency itself gets small, plain SSR keeps the performance win without the architecture cost."
    applies_when: { deps: ["next", "@tanstack/react-start", "waku"], platforms: [react] }
  - title: "Different Hydration and Rendering Strategies"
    url: "https://neciudan.dev/hydration-and-rendering-strategies"
    by: "Neci Dan (neciudan.dev)"
    what: "A systematic map of the whole rendering spectrum — CSR, SSG, ISR, SSR, streaming SSR + Suspense, RSC, islands, signal-based fine-grained reactivity, Qwik resumability, and Next 16.3 instant navigations — organized around ONE durable question: the gap between when a page LOOKS ready (HTML painted) and when it WORKS (JS hydrated/executing). Each strategy is a different trade on that window — ship less JS (islands/RSC), execute it faster (signals), or skip execution (resumability). The mental model that turns 'which meta-framework / rendering mode' into a reasoned choice instead of a checklist; the framing behind this entry's context-keys."
