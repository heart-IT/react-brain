id: RB-E-NAV
topic: "Navigation & routing"
category: navigation
group: app-architecture
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-NAV.md
confidence: medium
platforms: [react, react-native]
options:
  - { name: "React Navigation", tradeoff: "The bare-RN default: mature, imperative + declarative, deeply customizable. 7.4.1 is latest; 8.0 is still alpha (8.0.0-alpha.48 on the next tag, 2026-09-22, verified vs npm). See note: REACT NAVIGATION 8" }
  - { name: "Expo Router", tradeoff: "File-based, convention over config; the pick on Expo. Since v56 (SDK 56) its own native-first core, decoupled from React Navigation: direct @react-navigation/* imports no longer work alongside it. SDK 58 (beta) graduates data loaders, SSR, middleware and native tabs out of experimental. See note: EXPO ROUTER" }
  - { name: "React Router (8.x)", tradeoff: "Web routing; absorbed Remix. v8 is ESM-only, drops react-router-dom and turns future flags (incl. middleware) on by default; 8.4.0 (2026-09-15, verified vs npm). SECURITY FLOOR: 8.3.0 on v8, 7.18.2 on v7. See note: REACT ROUTER SECURITY" }
  - { name: "TanStack Router / Start", tradeoff: "Type-safe web routing on a signal-based core; Start is its RSC/SSR meta-framework (see RB-E-META-FRAMEWORKS)." }
  - { name: "Next.js App Router", tradeoff: "Web, full-framework routing + RSC (see RB-E-META-FRAMEWORKS)." }
recommend:
  default: "React Native → Expo Router if you're on Expo, else React Navigation. Web → use the meta-framework's router (see RB-E-META-FRAMEWORKS), or TanStack Router for a type-safe SPA."
  when:
    - "Expo app → Expo Router (file-based)"
    - "bare RN → React Navigation"
    - "type-safe web SPA without a meta-framework → TanStack Router"
    - "web SPA already on React Router, or ecosystem/familiarity over route type-safety → React Router 8 (at ≥8.3.0; a v7 app needs ≥7.18.2; its typegen is framework-mode-only, which is why TanStack Router keeps the type-safe-SPA slot)"
    - "adopting React Navigation 8 native tabs → pin the exact 8.0 alpha (still alpha as of 8.0.0-alpha.48, 2026-09-22; verify against the RN8 release notes)"
    - "links must survive a store install (invites, referrals, shared products) → deferred deep linking (an attribution SDK or Detour; plain Universal/App Links lose the intent at the store boundary, see reading 'Detour: deferred deep linking done right in Expo Router')"
note: >
  Navigation is two problems. On React Native it is native UI: a navigation state tree, platform
  transitions and gestures, no URL. On the web it is the URL, and once a meta-framework is involved,
  where data loads and where the server boundary sits. On RN the choice is "are you on Expo?", and
  since SDK 56 that choice separates two distinct stacks (Expo Router's own core vs React
  Navigation), not a wrapper over one library, so switching lanes later costs more; decide it at
  project setup. Expo Router's measured cold-start premium on one low-end Android device (see
  reading 'React Native Navigation Benchmarks') buys deep linking, lazy screens, file-based routing
  and web support. On the web the meta-framework owns routing; the standalone slot goes to TanStack
  Router because only it gives route type-safety to a plain SPA.

  EXPO ROUTER (2026-09-15, verified vs the Expo SDK 58 beta and SDK 56 changelogs; npm 2026-09-24):
  v56 made expo-router independent of react-navigation (codemod: npx expo-codemod
  sdk-56-expo-router-react-navigation-replace), and expo-router 57.x ships zero @react-navigation/*
  deps. SDK 58 (beta; expo 58.0.0-preview.6 on npm's next tag) makes data loaders, SSR and
  middleware stable with no experimental flags, and native tabs, toolbars and the standard-navigation
  integration stable too; a loader can call setResponseHeaders({'Cache-Control': 'private,
  max-age=60'}) from expo-server to let clients cache its response. The navigation core was reworked
  so state is deterministic, and it no longer carries most of the forked React Navigation API: most
  apps won't notice, but a custom navigator or any import from expo-router/react-navigation must
  follow the migration guide. JS Tabs, TopTabs and Drawer now run through the same
  standard-navigation integration as NativeTabs. Before upgrading: web async routes are on by default
  (asyncRoutes: { web: false } opts out); navigation uses React transitions to keep the current
  screen visible while the next loads (activityEnabled / NavigationAwareActivity hide inactive
  content while preserving state); per-screen error boundaries (unstable_settings.screenErrorBoundary
  or <Stack unstable_screenErrorBoundary={...} />) keep the navigator mounted when one screen throws;
  on Android, expo-symbols (NativeTabs.Trigger.Icon with md) and @expo/ui (Stack.Toolbar) are
  optional peers. @expo/ui also gained iOS navigation primitives (NavigationStack, NavigationLink,
  NavigationDestination, Toolbar, navigationTitle, two/three-column NavigationSplitView): not a
  router, but a SwiftUI-native navigation surface for iPad/split-view layouts (RB-E-NATIVE-UI owns
  it).

  REACT NAVIGATION 8 (verified vs the React Navigation blog 2025-12-19 and 2026-07-08; npm
  2026-09-24): still alpha, 8.0.0-alpha.48 on the next tag while latest is 7.4.1. It makes native
  bottom tabs the default (via react-native-screens, including iOS 26 liquid glass), adds native icon
  components (SFSymbol / MaterialSymbol), reworks TypeScript inference with full parent-navigator
  inference (drops CompositeNavigationProp), adds screen-history APIs (pushParams, persistor,
  inactiveBehavior via React.Activity), Suspense-enabled navigation, data loaders for TanStack
  Query/Apollo prefetch (UNSTABLE_loader), and a cross-library standard navigation API so custom
  navigators work in both React Navigation and Expo Router. Requires react-native-screens 4.25+,
  gesture-handler 3.0+, TS 6+. Underneath, react-native-screens 4.26 (2026-07-16, verified vs the
  release) marked its Tabs API stable (RN 0.84+; FormSheet and Stack-v5 toolbar menus are not yet).

  REACT ROUTER 8 (verified vs remix.run/blog/react-router-v8 and npm): 8.0.0 shipped 2026-06-17;
  8.4.0 (2026-09-15) is current. ESM-only with ES2022 targets; minimums Node 22.22.0+, React 19.2.7+,
  Vite 7+; react-router-dom removed; the v8_* future flags (including middleware, now first-class via
  RouterContextProvider) are the default. From a flags-current v7 the upgrade is generally
  non-breaking.

  ROUTE TYPE-SAFETY (2026-08-18, verified vs reactrouter.com/explanation/type-safety): React Router's
  type generation executes the route config (app/routes.ts) and emits per-route-module +types, so it
  is tied to framework mode; a declarative or data-mode SPA does not get it. Downloads favor React
  Router (44.2M/wk vs 19.7M/wk for @tanstack/react-router, 2.2x, 2026-08-18) but the axis that decides
  the SPA slot is type-safety, and it has not moved.

  REACT ROUTER SECURITY (2026-09-24, verified vs the GitHub advisories): six advisories published
  2026-07-22. Fixed in 7.18.0: unauthenticated __manifest DoS (CVE-2026-55685, High, CVSS 7.6,
  >=7.0.0 <7.18.0), RSCErrorHandler protocol-validation XSS (CVE-2026-53667), SSR-hydration
  constructor injection (CVE-2026-53666, from 6.4.0) and an external redirect via untrusted paths
  that bypasses CVE-2025-68470 (CVE-2026-53669, from 6.0.0). Fixed in 7.18.2 / 8.3.0: the RSC-mode
  CSRF bypass that executes the action before the 400 response (GHSA-qwww-vcr4-c8h2, >=7.12.0
  <7.18.2 and >=8.0.0 <8.3.0). Fixed in 7.13.0 / react-router-dom 6.30.6: an open redirect leading
  to XSS (CVE-2026-53668). The floor is therefore 8.3.0 on v8 and 7.18.2 on v7; v6 has no patched
  release for the injection and redirect-bypass advisories, so v6 apps must move to v7 or v8. Half of
  these live in the RSC/SSR surface, so exposure scales with how much of React Router's server side
  you use.

  RB-E-META-FRAMEWORKS owns framework-level routing (SSR/RSC); RB-E-CROSSPLATFORM owns sharing
  navigation web↔native; RB-E-NATIVE-UI owns @expo/ui.

  HISTORY:
    2026-09-24 CORRECTED: the React Router v7 security floor is 7.18.2, not 7.18.0 (the RSC-mode CSRF fix landed in 7.18.2).
    2026-08-18 CHALLENGED → SURVIVES: same downloads attack with a 2.2x gap; typegen still framework-mode-only, so the TanStack type-safe-SPA slot held.
    2026-07-10 CHALLENGED → WEAKENED: React Router when-clause added; the TanStack type-safe-SPA slot survived the 2.3x-downloads attack.
defer_to_skill: null
doc: "RB-E-NAV.md"   # long-form Explanation entry in content_dir
updated: 2026-09-24   # RR v7 security floor corrected to 7.18.2; RR 8.4 + v8 minimums; RN8 still alpha.48; prior 2026-09-21: Expo Router SDK 58: data loaders + SSR + middleware + native tabs graduate from experimental, nav core drops most of the forked React Navigation API, web async routes on by default
reading:
  - title: "React Native Navigation Benchmarks (State of RN Navigation)"
    url: "https://andrei-calazans.com/posts/2026-06-05-state-of-rn-navigation/"
    by: "Andrei Calazans"
    what: "The measured evidence this entry's RN recommendation never had: the same app built four times over four navigation libraries and profiled on one Android device (Expo SDK 56, RN 0.85, Hermes, New Architecture, Samsung Galaxy A16, release/profileable builds; cold start = the OS Displayed metric, median of 3; FPS/CPU/RAM via Flashlight driving Maestro; breakdowns from Perfetto Systrace + source-mapped Hermes CPU profiles, all data and scripts published). Cold start: react-native-navigation 316 ms · React Navigation v7 358 ms · navigation (Graham Mendick) 398 ms · Expo Router 917 ms. Peak RAM: 195 / 214 / 241 / 308 MB. All four hold ~60 FPS, so the difference is startup and memory, not smoothness. The WHY matters more than the ranking: (1) Expo Router's ~3x cold start is NOT Reanimated — a controlled experiment put Reanimated at only ~62 ms — it is a 2x bigger bundle plus router-on-top-of-React-Navigation layering that evaluates 106 JS modules at boot against 36–43 for the others; (2) Reanimated IS the RAM story — adding it alone to the leanest app reproduced Expo Router's entire ~125 MB premium, almost all anonymous heap from the second Hermes runtime Worklets spins up; (3) react-native-navigation wins because its tabs and stack are Kotlin views, so its JS bundle evaluates in 55 ms against React Navigation's 168 ms of real component tree — but the author's own caveat is that the same design chokes on large screens and drops frames. Read the caveats before quoting the table: rn-navigation is a BARE RN app (some of its lead is 'no expo-modules-core', not the navigation library), it is one device and one trivial UI, and Expo Router buys deep linking, lazy screen loading, file-based routing and web support that this benchmark does not price."
    claim: "Choosing an RN navigation library on startup or memory: one Android device gave cold starts of 316/358/398/917 ms and peak RAM 195/214/241/308 MB for react-native-navigation / React Navigation v7 / navigation / Expo Router."
    applies_when: { platforms: [react-native] }
  - title: "Detour: deferred deep linking done right in Expo Router"
    url: "https://expo.dev/blog/deferred-deep-linking-the-right-way"
    by: "Bartek Krasoń (Software Mansion), guest post on the Expo blog"
    what: "Names a hole every referral/invite flow eventually falls into: standard deep links (Universal Links / App Links) only work when the app is ALREADY installed — iOS and Android preserve nothing across the store boundary, so a new user who taps an invite link launches the app blind to what they clicked. That is the Installation Gap, and closing it needs a server that remembers the click, which is why this has historically meant adopting an attribution SDK (deep linking as its side feature) and hand-writing glue between its callback and your router. The router-side argument is the durable part: because Expo Router exposes `+native-intent.tsx` as pre-routing middleware (redirectSystemPath), the deferred link can be resolved BEFORE the first screen mounts, which removes the post-mount useEffect race, duplicate navigation events and the ordering problem with auth gates; the remaining case — link resolves, user isn't signed in yet, guard redirects to /login and swallows it — is handled by holding the intent in a provider until the app says the user is ready. Vendor content (SWM's own SDK, @swmansion/react-native-detour 2.3.1, and it needs a Detour account for app credentials), but the failure mode and the +native-intent hook are general."
    claim: "You ship invite or referral links into Expo Router — a plain deep link does NOT survive the store install, so first-launch intent needs deferred deep linking with a server behind it; resolve it in +native-intent.tsx and hold it across your auth gate."
    applies_when: { deps: ["expo-router"], platforms: [react-native] }
  - title: "Reverse Engineering ChatGPT Web: How OpenAI Built for a Billion Users"
    url: "https://performance.dev/chatgpt"
    by: "Dennis Brotzky (performance.dev)"
    what: "Production evidence for React Router 7 framework mode at billion-user scale: ChatGPT migrated Next.js Pages Router → Remix (2024) → RR7 with streaming SSR, TanStack Query seeded from server render, Tailwind 4 tokens, ProseMirror composer — 84KB HTML document, 50-65ms TTFB. The concrete counterweight to 'serious apps need Next.js', and the highest-profile data point behind this entry's React Router when-clause. (4 independent newsletter signals in one week.)"
    claim: "You ship React Router — it runs ChatGPT's web app at billion-user scale (framework mode + streaming SSR), so the stack choice is production-proven; the teardown shows what a tuned RR7 deployment looks like."
    applies_when: { deps: ["react-router", "react-router-dom"], platforms: [react] }
  - title: "TanStack Router's New Reactive Core: A Signal Graph"
    url: "https://tanstack.com/blog/tanstack-router-signal-graph"
    by: "Florian Pellet (TanStack)"
    what: "The primary source behind this entry's 'signal-based core' claim: the monolithic router.state was decomposed into a graph of independent stores so route changes update only affected subscribers (React navigation 7ms→4.5ms in their measurements). The architecture under TanStack Router's fine-grained reactivity."
  - title: "Exploring Inlined Requires: does Expo Router give you screen-level lazy loading?"
    url: "https://andrei-calazans.com/posts/2026-06-04-expo-router-screen-level-lazy-loading/"
    by: "Andrei Calazans"
    what: "Instrumented proof that Expo Router defers screen loading by construction via require.context() getters wrapped in getComponent thunks — with the precise caveats (layouts/initial route load eagerly; sync require, not bundle-splitting). The canonical explanation of Expo Router's lazy-loading mechanism."
    claim: "You ship Expo Router — screens are lazy-loaded by construction, but layouts and the initial route load eagerly and it's sync require, not bundle-splitting; know the mechanism before optimizing startup."
    applies_when: { deps: ["expo-router"], platforms: [react-native] }
  - title: "React Router loaders and actions as integration points"
    url: "https://sergiodxa.com/articles/react-router-loaders-and-actions-as-integration-points"
    by: "Sergio Xalambrí (React Router / Remix)"
    what: "Frames loaders/actions as the HTTP-to-domain seam — keep business logic in testable services, reserve loaders/actions for the integration layer (E2E). A durable testing/architecture philosophy for React Router."
    claim: "You ship React Router — treat loaders/actions as the HTTP-to-domain seam: keep business logic in testable services and reserve loaders/actions for the integration layer, tested E2E."
    applies_when: { deps: ["react-router", "react-router-dom"], platforms: [react] }
  - title: "Deep Links With Authentication in React Navigation"
    url: "https://www.callstack.com/blog/deep-links-with-authentication-in-react-navigation"
    by: "Satyajit Sahoo (Callstack; React Navigation maintainer)"
    what: "The redirect-after-login problem: a deep link that lands on the login screen should still deliver the user to the intended screen afterwards. Walks the manual approaches in older React Navigation and the new API that handles it (routeNamesChangeBehavior 'lastUnhandled' re-dispatching the unhandled link when auth state flips). From the library's own maintainer."
    claim: "You ship React Navigation — if deep links can land behind auth, the maintainer's routeNamesChangeBehavior 'lastUnhandled' pattern replaces hand-rolled redirect-after-login plumbing."
    applies_when: { deps: ["@react-navigation/*"], platforms: [react-native] }
  - title: "Migrating to native stack navigation, with a surprise from iOS 26"
    url: "https://thoughtbot.com/blog/migrating-to-native-stack-navigation-with-a-surprise-from-ios-26"
    by: "Jose Blanco (thoughtbot)"
    what: "The JS-stack-vs-native-stack behavioral difference no other reading here covers, learned in a real 0.77→New-Arch migration: moving to native-stack means the REAL platform components apply — the app suddenly inherited iOS 26 Liquid Glass styling (opt out with UIDesignRequiresCompatibility in Info.plist while unready), and a 55pt header logo got clipped because the native bar is a hard 44pt. The durable frame: JS-stack headers merely TOLERATED overflow the platform never allowed; native-stack enforces what iOS actually permits, so audit header content heights when migrating. (Live URL is bot-walled — content verified via Wayback snapshot 2026-07-15.)"
    claim: "You ship React Navigation — native-stack applies platform constraints JS-stack merely tolerated: iOS 26 Liquid Glass is inherited (UIDesignRequiresCompatibility opts out) and the 44pt native bar clips taller header content."
    applies_when: { deps: ["@react-navigation/*"], platforms: [react-native] }
  - title: "Untangling Dialogs in React Router"
    url: "https://programmingarehard.com/2026/05/06/react-router-dialogs.html/"
    by: "Dave Adams"
    what: "Models modal dialogs as nested routes in React Router 7 instead of local useState/useEffect — covering revalidation, view transitions, flash sessions, and exit animations. A durable routing pattern that generalizes beyond the example."
    claim: "You ship React Router — model modal dialogs as nested routes instead of local useState/useEffect; revalidation, view transitions, flash sessions, and exit animations then ride the router."
    applies_when: { deps: ["react-router", "react-router-dom"], platforms: [react] }
