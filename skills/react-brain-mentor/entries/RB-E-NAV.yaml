detect_source:   # source-level signals owned by this entry (regex over repo source)
  - pattern: "window\\.location\\.(?:href\\s*=|assign\\()"
    min_files: 2
    signal: "hard navigation via window.location in 2+ files"
    hint: "full-page reloads drop client state and defeat route-level code-splitting — use the router's navigate()/Link for in-app moves; reserve window.location for external URLs"
detect:   # package.json dep → this entry (pkg: exact | @scope/* | name*; token matched against recommend text)
  - { pkg: "@react-navigation/*", label: "React Navigation", token: "react navigation" }
  - { pkg: "expo-router", label: "Expo Router", token: "expo router" }
  - { pkg: "react-router-dom", label: "React Router", token: "react router" }
  - { pkg: "react-router", label: "React Router", token: "react router" }
  - { pkg: "@tanstack/react-router", label: "TanStack Router", token: "tanstack router" }
migrate:   # installed dep → sequenced upgrade knowledge (assembled by `react-brain migrate`)
  - from: { pkg: "react-router-dom" }
    to: "react-router v8 (single package — v8 drops react-router-dom)"
    urgency: superseded
    effort: M
    why: "v8 (8.x, released 2026) is ESM-only and drops both CJS and the react-router-dom package; v7→v8 is generally non-breaking if you're caught up on v7 future flags"
    receipts: ["https://reactrouter.com/"]
  - from: { pkg: "react-router", below: "8.3.0" }
    to: "react-router 8.3.0 (or 7.18.0 if you must stay on v7)"
    urgency: upgrade
    effort: S
    why: "SECURITY: six advisories published 2026-07-22 — unauthenticated __manifest DoS (High, CVSS 7.6), RSC-mode CSRF bypass, RSCErrorHandler XSS, SSR-hydration constructor injection, two open redirects — fixed in 8.3.0 and backported to 7.18.0. Moving all the way to v8 also gets ESM-only + future flags on by default, generally non-breaking from a flags-current v7"
    receipts: ["https://github.com/remix-run/react-router/security/advisories", "https://github.com/remix-run/react-router/security/advisories/GHSA-chx6-hx7r-mcp5", "https://registry.npmjs.org/react-router/latest"]
