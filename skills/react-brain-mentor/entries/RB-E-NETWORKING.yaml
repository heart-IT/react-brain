reading:
  - title: "react-native-nitro-fetch — architecture & benchmarks"
    url: "https://github.com/margelo/react-native-nitro-fetch"
    by: "Margelo"
    what: "The README doubles as the layer's best explainer: what actually backs fetch on each platform (Cronet vs URLSession), what HTTP/3+QUIC/Brotli/disk-cache buy you, prefetch-before-navigation, and worklet-side parsing — with their benchmark methodology. Read it to understand the layer even if you keep built-in fetch."
    claim: "You ship react-native-nitro-fetch — it swaps the fetch engine (Cronet/URLSession: HTTP/3+QUIC, Brotli, disk cache, prefetch, worklet parsing) behind the same API; benchmarks are vendor-run (~23% on their harness), so measure your own hot path."
    applies_when: { deps: ["react-native-nitro-fetch"], platforms: [react-native] }
  - title: "Speeding up Expensify's networking with NitroFetch"
    url: "https://margelo.com/blog/speeding-up-expensifys-networking-with-nitro-fetch"
    by: "Margelo (with Expensify)"
    what: "The first at-scale production receipt for the fetch-engine swap (vendor-written — Margelo builds nitro-fetch — but the numbers are Expensify's app): global replacement of fetch/Headers/Request/Response gave 15-30% faster requests; prefetching the single critical startup request (with token refresh BEFORE the JS runtime loads, account-scoped prefetch keys to prevent cross-account reuse) cut P50 startup 1,676→1,409ms on iOS and 3,223→2,573ms on Android. Also documents the sharp edge: Cronet needed a custom certificate-pinning implementation. Grounds this entry's 'reach for nitro-fetch when measured' clause with what MEASURED wins look like."
    claim: "You use react-native-nitro-fetch — Expensify's rollout is the calibration point: 15-30% faster requests, with the startup win coming from prefetch-before-JS (account-scoped keys, pre-runtime token refresh); on Android Cronet you own cert pinning."
    applies_when: { deps: ["react-native-nitro-fetch"], platforms: [react-native] }
