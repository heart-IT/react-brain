id: RB-E-TYPESCRIPT
topic: "TypeScript rigor & public API typing"
category: typescript
group: react-foundations
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-TYPESCRIPT.md
confidence: medium
platforms: [react, react-native]
options:
  - { name: "strict mode tiers", tradeoff: "strict vs gradual adoption; TS 6.0 makes strict:true the default" }
  - { name: "exported type surface", tradeoff: "what a library/package should export" }
  - { name: "TypeScript 7 (native/Go)", tradeoff: "Go rewrite of tsc — 7.0 STABLE (7.0.2, 2026-07-08, verified vs npm): ~10x faster, up to 16x type-checking with parallelization, removes long-deprecated flags; TS 6.0 is the JS-based 'bridge' release to migrate through" }
  - { name: "Flow (2026)", tradeoff: "Meta's type checker; syntax converged with TS, compiler ported to Rust; mostly Meta-internal now" }
recommend:
  default: "Run strict TypeScript (strict:true, the TS 6 default) and export a small, deliberate public type surface from libraries."
  when:
    - "library/package author → minimize + version the exported types; avoid leaking internals"
    - "large repo with slow tsc → TS 7 (Go) is STABLE (~10x); migrate via the TS 6 bridge, following the VS Code pattern in reading"
    - "Next.js repo moving to TS 7 → `next build` loads TypeScript's JS compiler API, which TS 7 does not yet expose; set experimental.useTypeScriptCli so the build shells out to the project-local tsc instead (experimental, 16.3 Preview)"
    - "not at Meta → use TypeScript, not Flow; budget a Flow exit as a package-by-package program with type integrity preserved throughout (see the Yelp case in reading)"
    - "React Native app on 0.87+ → the Strict TypeScript API is the default and deep imports into react-native/Libraries/* are type errors; see RB-E-RN-VERSIONS"
note: >
  TypeScript 7.0 (the Go/native rewrite of tsc) is STABLE — npm latest = 7.0.2, published
  2026-07-08 (verified vs the npm registry; RC was 2026-06-18, stable landed on schedule).
  ~10x vs TS 6.0, up to 16x type-checking with parallelization. Migrate incrementally through
  TS 6 (the bridge release) per the VS Code case study in reading.
  TOOLING GAP (2026-07-28, verified vs the Next.js docs): TS 7 ships the compiler, not yet its
  JavaScript API — so tools that EMBED tsc lag the release. Next.js is the load-bearing example:
  `next build` loads the TS compiler API, so TS 7 needs `experimental.useTypeScriptCli`, which
  makes the build run the project-local `tsc` CLI instead ("enables TypeScript 7 support while
  its JavaScript API is unavailable"; experimental, not recommended for production, 16.3 Preview).
  Expect the same shape from other API-embedding tools — check yours before pinning typescript@7.
defer_to_skill: engineering-principles
doc: "RB-E-TYPESCRIPT.md"   # long-form Explanation entry in content_dir
updated: 2026-08-18   # Yelp Flow→TS case (1.4M SLoC, 3y7m) + RN 0.87 Strict-API default cross-ref
reading:
  - title: "Migrating a Large Flow Monorepo to TypeScript"
    url: "https://engineeringblog.yelp.com/2026/08/migrating-a-large-flow-monorepo-to-typescript.html"
    by: "Shawn Walton (Yelp Engineering)"
    what: "The receipt under this entry's 'not at Meta → use TypeScript, not Flow' line, and the shape of a type-checker migration you cannot do in one cut: 1.4M SLoC across 570 packages, three years and seven months, ending February 2026. The load-bearing decision was refusing to suspend type-checking anywhere — 'code that loses coverage from its type checker, tests, or linter almost never regains it' — which ruled out a big-bang rewrite and forced Flow and TypeScript to coexist in production. The mechanism: convert one package at a time (flowts first, later Stripe's flow-to-typescript-codemod, which cut the manual tail), then run flowgen to turn the emitted .d.ts back into Flow headers so still-Flow consumers keep type-checking. Because no tool generates .d.ts FROM Flow, the order is forced — deepest internal dependencies first, up the tree. What actually moved the needle was not tooling: a year of dogfooding on ~90 foundational packages before launch, documentation and outreach, a dependency-graph score that ranked which package unblocks the most others, auto-filed Jira tickets when a package became convertible, and finally hard quarterly deadlines — voluntary migration plateaued once the enthusiasts were done. LLM-driven conversion was tried in 2023 and abandoned as unreliable. Outcome: type coverage 83.15% (Flow) → 96.44% (TS), ~6,000 @ts-expect-error (2,000 of them mass-added when the team auto-suppressed the last few dozen orphaned packages to finish), 82% of surveyed engineers reporting a productivity gain."
    claim: "You still run Flow — exiting it is a package-by-package program, not a codemod: keep type integrity throughout (flowgen turns emitted .d.ts back into Flow headers), convert deepest dependencies first, and expect uptake to stall until deadlines land."
    applies_when: { deps: ["flow-bin"] }
  - title: "Why does tsgo use so much memory?"
    url: "https://zackoverflow.dev/writing/why-does-tsgo-use-so-much-memory"
    by: "Zackary Radisic"
    what: "A heap-level investigation of the Go TypeScript compiler — per-thread Checker duplication, never-freed types, symbol duplication, AST at 45% of heap, plus a fix. A durable deep-dive on TS7/tsgo internals and its concurrency model's cost."
  - title: "TypeScript Performance in TanStack Table V9"
    url: "https://tanstack.com/blog/tanstack-table-v9-typescript-performance"
    by: "Kevin Van Cott (TanStack)"
    what: "Concrete techniques to cut type-instantiation cost 62-86% (feature maps, materialized interfaces, in/out variance annotations, explicit type args), with measurements. The reference for heavy-generics library authors."
  - title: "Iterating Faster with TypeScript 7"
    url: "https://code.visualstudio.com/blogs/2026/06/26/iterating-faster-with-ts-7"
    by: "VS Code team (Microsoft)"
    what: "The production adoption case the tsgo-internals piece lacks: VS Code's ~50-extension codebase cut type-checking 36s→5s (~7x) and editor project-load 60s→10s by migrating INCREMENTALLY — TS 6.0 as a low-churn bridge, then TS 6-and-7 side-by-side in CI (TS 6 still emitting), then esbuild + TS 7 as the default. The surprising blocker wasn't type errors but formatter differences failing pre-commit checks. Evidence that TS 7 (Go-native tsc) is trustworthy for daily use on a large real codebase — if you bridge through TS 6 first."
    claim: "You ship TypeScript — TS 7 (Go-native tsc, ~10x) is stable; migrate incrementally through the TS 6 bridge, then run 6 and 7 side-by-side in CI (VS Code cut type-checking 36s→5s; the blocker was formatter diffs, not type errors)."
    applies_when: { deps: ["typescript"] }
sources:
  - "https://devblogs.microsoft.com/typescript/announcing-typescript-7-0-rc/"
  - "https://registry.npmjs.org/typescript/latest"
  - "https://nextjs.org/docs/app/api-reference/config/next-config-js/useTypeScriptCli"
  - "https://engineeringblog.yelp.com/2026/08/migrating-a-large-flow-monorepo-to-typescript.html"
detect:   # package.json dep → this entry (pkg: exact | @scope/* | name*; token matched against recommend text)
  - { pkg: "typescript", label: "TypeScript", token: "typescript" }
detect_source:   # source-level signals owned by this entry (regex over repo source)
  - pattern: ":\\s*any\\b"
    min_files: 10
    signal: "explicit 'any' in 10+ files"
    hint: "any turns the checker off exactly where bugs concentrate — prefer unknown + narrowing at boundaries; strict:true is the TS 6 default"
migrate:   # installed dep → sequenced upgrade knowledge (assembled by `react-brain migrate`)
  - from: { pkg: "typescript", below: "7.0.0" }
    to: "TypeScript 7 (Go-native tsc) via the TS 6 bridge"
    urgency: upgrade
    effort: M
    why: "TS 7.0 is STABLE (~10x, up to 16x type-checking with parallelization); migrate incrementally — TS 6 as the low-churn bridge, TS 6 and 7 side-by-side in CI, then TS 7 as default (the VS Code ~50-extension migration pattern; their blocker was formatter diffs, not type errors). Check tools that EMBED the TS compiler API first — TS 7 doesn't expose it yet, e.g. `next build` needs experimental.useTypeScriptCli to shell out to the tsc CLI instead"
    receipts: ["https://registry.npmjs.org/typescript/latest", "https://code.visualstudio.com/blogs/2026/06/26/iterating-faster-with-ts-7", "https://nextjs.org/docs/app/api-reference/config/next-config-js/useTypeScriptCli"]
