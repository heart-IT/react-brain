migrate:   # installed dep → sequenced upgrade knowledge (assembled by `react-brain migrate`)
  - from: { pkg: "react-native", below: "0.87.0" }
    to: "React Native 0.87 (current stable)"
    urgency: upgrade
    effort: L
    why: "the ladder crosses hard lines: New Architecture is the ONLY runtime ≥0.82 (Legacy frozen at 0.80, stripped at 0.84), Hermes V1 + precompiled iOS binaries default at 0.84 (Node 22.11+ min), the Jest preset moves to @react-native/jest-preset at 0.85, Android edge-to-edge lands in core at 0.86, and 0.87 makes the Strict TypeScript API the default (deep imports into react-native/Libraries/* become type errors) while raising the floor to Node 22.13 / Kotlin 2.0 / compileSdk 37 and dropping InteractionManager. Every New-Arch-gated upgrade below unblocks at 0.82+; budget the 0.87 step as type-codemod work."
    receipts: ["https://reactnative.dev/blog/2026/02/11/react-native-0.84", "https://reactnative.dev/blog/2026/06/11/react-native-0.86", "https://reactnative.dev/blog/2026/08/11/react-native-0.87"]
  - from: { pkg: "react-native-edge-to-edge" }
    to: "remove the package — Android-15+ edge-to-edge is in RN core since 0.86"
    urgency: conditional
    effort: S
    requires: { pkg: "react-native", atleast: "0.86.0" }
    why: "RN 0.86 handles edge-to-edge in core; once there, the polyfill package is redundant"
    receipts: ["https://reactnative.dev/blog/2026/06/11/react-native-0.86"]
