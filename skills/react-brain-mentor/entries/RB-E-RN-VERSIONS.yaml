id: RB-E-RN-VERSIONS
topic: "React Native release timeline — what each version changed"
category: rn-versions
group: react-foundations
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-RN-VERSIONS.md
confidence: high
platforms: [react-native]
options:
  - { name: "RN 0.76 (2024-10)", tradeoff: "New Arch ON by default; React Native DevTools; boxShadow + filter; iOS 15.1 / Android API 24 min; `react-native init` deprecated → Expo recommended" }
  - { name: "RN 0.77", tradeoff: "CSS-ish styling (display:contents, box-sizing, mixBlendMode, outline); Android 15 16KB pages + edge-to-edge" }
  - { name: "RN 0.78 (2025-02)", tradeoff: "React 19 (Actions, useActionState, useOptimistic, use, React Compiler); ref-as-prop (forwardRef deprecated)" }
  - { name: "RN 0.79", tradeoff: "Metro ~3x faster cold start (deferred hashing); remote-JS Chrome debugging removed" }
  - { name: "RN 0.80 (2025-06)", tradeoff: "opt-in Strict TypeScript API (types from source); Legacy Architecture FROZEN (2025-06-02)" }
  - { name: "RN 0.81", tradeoff: "Android 16 (API 36) + mandatory edge-to-edge; SafeAreaView deprecated → safe-area-context; JavaScriptCore removed (Hermes-only); precompiled iOS opt-in; React Compiler in default template (RC)" }
  - { name: "RN 0.82", tradeoff: "New Architecture MANDATORY (opt-out ignored); Hermes V1 experimental; debugOptimized Android variant; DOM Node APIs" }
  - { name: "RN 0.83", tradeoff: "React 19.2 (<Activity>, useEffectEvent); Intersection Observer; DevTools network inspector; prebuilt artefacts" }
  - { name: "RN 0.84 (2026-02-11) ✓", tradeoff: "Hermes V1 DEFAULT; precompiled iOS binaries default; Node 22.11+ min; Legacy-Arch stripped; bi-monthly cadence" }
  - { name: "RN 0.85 (2026-04-07) ✓", tradeoff: "shared C++ animation backend; Jest preset → @react-native/jest-preset; layout-prop native driver (0.85.1)" }
  - { name: "RN 0.86 (2026-06-11) ✓", tradeoff: "Android-15+ edge-to-edge in core (drop react-native-edge-to-edge); DevTools light/dark; 2nd zero-breaking-change release" }
  - { name: "RN 0.87 (2026-08-11) ✓", tradeoff: "Strict TypeScript API becomes the DEFAULT (types generated from source; deep imports into react-native/Libraries/* are now a type error; opt out through 0.88 with the \"react-native-legacy-deep-imports\" tsconfig customCondition, then the legacy types go); Metro 0.84→0.87 (source maps 2x faster, half the source-map memory, stable TS/ESM config files, .es6 + YAML configs dropped); EXPERIMENTAL Swift Package Manager for iOS (`npx react-native spm`, CocoaPods still the default and the supported path — the docs say not for production yet); AGP 9 support (opt out of built-in Kotlin + new DSL via android.builtInKotlin=false / android.newDsl=false); toolchain floor rises to Node ≥22.13, Kotlin 2.0+, minCompileSdk 34, compileSdk/buildTools 37. Removals: InteractionManager (→ requestIdleCallback), Modal `animated`, StatusBar backgroundColor/translucent, boolean keyboardShouldPersistTaps, the useTurboModules flag, *Properties type aliases. backgroundImage loses its experimental_ prefix. 0.84.x moves to UNSUPPORTED"}
recommend:
  default: "Target the latest stable RN (0.87); the New Architecture is non-optional from 0.82, so plan any migration around that line."
  when:
    - "on RN < 0.82 → budget a New-Arch migration; Legacy was frozen at 0.80 (no fixes)"
    - "on RN ≥ 0.86 → drop react-native-edge-to-edge (now in core)"
    - "moving to 0.87 → the Strict TypeScript API is the default: fix deep imports into react-native/Libraries/* (the /migrate-to-strict-api skill + the ESLint fixers do most of it), or set the react-native-legacy-deep-imports customCondition as a bridge — that escape hatch exists only through 0.88"
    - "still importing InteractionManager / core SafeAreaView / deep paths → 0.87 removed them; migrate now"
    - "on iOS and tempted by SwiftPM → it is experimental and additive in 0.87; CocoaPods stays the default and the supported path — but trunk goes read-only 2026-12-02 (no NEW podspec versions after that; existing ones keep resolving), so audit which iOS deps still depend on it"
    - "quoting a pre-0.84 row as authoritative → verify against that version's RN blog first"
note: >
  Use this to tell a project what it gains/loses by moving RN versions. Rows marked ✓ (0.84–0.87)
  are verified vs official RN blogs; 0.76–0.83 are from release history + RN Rewind — verify a
  specific row against the RN blog before quoting it as authoritative. Expo SDK mapping: SDK 55 =
  RN 0.83 + React 19.2; SDK 56 = RN 0.85 + Expo UI stable; SDK 57 = RN 0.86 + React 19.2 (2026-06,
  verified vs the SDK 57 changelog — skipped the beta phase, since RN 0.86 was breaking-change-free;
  Expo is testing near-immediate optional upgrades as RN moves to 6 releases/yr).
  APPLE PLATFORM FLOOR (2026-07-10, verified vs the Expo post's body): since 2026-04-28, App
  Store Connect uploads MUST be built with Xcode 26 / iOS-26-family SDKs — Expo SDK 54/55 EAS
  images already run Xcode 26, SDK ≤53 needs an explicit image opt-in; practically, stay ≥SDK 54.
  0.87 IS THE STRICT-API LINE (2026-08-11, verified vs the release blog + the v0.87.0 CHANGELOG):
  the 0.80 opt-in preview became the default, so a 0.87 bump is a TYPE migration first and a
  runtime migration second — plan it as codemod work (the /migrate-to-strict-api skill and the
  ESLint fixers), and treat the react-native-legacy-deep-imports customCondition as a bridge that
  expires after 0.88. It also raises the toolchain floor (Node ≥22.13, Kotlin 2.0+, compileSdk 37),
  so CI images move with it. Expo: 0.87 ships in expo@canary first, not in SDK 57 (= RN 0.86).
  Hermes: 0.87 pins hermes-compiler 250829098.0.16 (verified vs the tag's package.json), past the
  .15 backport that fixes the worklet debug-metadata memory regression — see RB-E-ANIMATION.
  WHY SWIFTPM NOW, AND WHAT IS ACTUALLY HAPPENING TO COCOAPODS (verified vs the CocoaPods blog,
  because the newsletter framing of this is overstated): CocoaPods has been in declared MAINTENANCE
  MODE since 2024-08-13, and on 2026-12-02 trunk goes READ-ONLY — the server will permanently
  refuse NEW Podspecs and the Specs repo gets archived (a test run runs 2026-11-01→07). That is
  not a shutdown: the Specs repo and CDN keep serving, so existing builds and existing pod versions
  keep working, and private specs repos are unaffected. The real consequence is that from December
  no library can publish a NEW version through trunk. So 0.87's experimental SwiftPM path is the
  ecosystem's answer to a dated deadline, not a preference — but it is still experimental, so the
  planning move today is to know which of your iOS dependencies still resolve only through trunk.
defer_to_skill: react-native-jsi
doc: "RB-E-RN-VERSIONS.md"   # long-form Explanation entry in content_dir
updated: 2026-08-18   # RN 0.87 STABLE — Strict TS API default, Metro 0.87, experimental SwiftPM, AGP 9
reading:
  - title: "React Native Architecture: From Bridge to Fabric"
    url: "https://blog.codeminer42.com/react-native-architecture-from-bridge-to-fabric/"
    by: "Felipe Ramalho (Codeminer42)"
    what: "Traces RN's architecture from the old async JSON bridge to the New Architecture (JSI, Fabric's immutable C++ shadow tree, Turbo Modules, Codegen), explaining why each piece exists. The 'why it changed' narrative behind the 0.76→0.82 version arc — not a release note."
sources:
