migrate:   # installed dep → sequenced upgrade knowledge (assembled by `react-brain migrate`)
  - from: { pkg: "react-native", below: "0.87.0" }
    to: "React Native 0.88 (current stable)"
    urgency: upgrade
    effort: L
    why: "the ladder crosses hard lines: New Architecture is the ONLY runtime ≥0.82 (Legacy frozen at 0.80, stripped at 0.84), Hermes V1 + precompiled iOS binaries default at 0.84 (Node 22.11+ min), the Jest preset moves to @react-native/jest-preset at 0.85, Android edge-to-edge lands in core at 0.86, and 0.87 makes the Strict TypeScript API the default (deep imports into react-native/Libraries/* become type errors) while raising the floor to Node 22.13 / Kotlin 2.0 / compileSdk 37 and dropping InteractionManager. Every New-Arch-gated upgrade below unblocks at 0.82+; 0.87→0.88 adds no user-facing breaking changes (React 19.3, EventTarget dispatch, iOS SceneDelegate for the iOS 27 SDK), so budget the 0.87 step as type-codemod work."
    receipts: ["https://reactnative.dev/blog/2026/02/11/react-native-0.84", "https://reactnative.dev/blog/2026/06/11/react-native-0.86", "https://reactnative.dev/blog/2026/08/11/react-native-0.87", "https://reactnative.dev/blog/2026/10/19/react-native-0.88"]
  - from: { pkg: "react-native-edge-to-edge" }
    to: "remove the package — Android-15+ edge-to-edge is in RN core since 0.86"
    urgency: conditional
    effort: S
    requires: { pkg: "react-native", atleast: "0.86.0" }
    why: "RN 0.86 handles edge-to-edge in core; once there, the polyfill package is redundant — and the package is now deprecated on npm (flag set on 1.8.2), whose message says to set edgeToEdgeEnabled=true in android/gradle.properties instead"
    receipts: ["https://reactnative.dev/blog/2026/06/11/react-native-0.86", "https://registry.npmjs.org/react-native-edge-to-edge/latest"]
tripwires:   # standing caveats as executable conditions — evaluated by `harvest firsthand`; fired ⇒ do the then:, update prose, remove the row
  - when: { pkg: "react-native", atleast: "0.89.0" }
    then: "RN 0.89 reached npm `latest` — add the 0.89 row from its release blog, move the default + migrate target, and re-check two dated claims: (1) the blog said 0.89 targets Swift Package Manager as the DEFAULT with a CocoaPods opt-out — if it shipped, rewrite the 'on iOS and tempted by SwiftPM → CocoaPods' when-clause and the COCOAPODS TRUNK note; (2) Expo dated the react-native-legacy-deep-imports opt-out to removal AFTER 0.89 — restate it as 'gone in the next release' and wire a tripwire at that version"
    added: 2026-11-25
