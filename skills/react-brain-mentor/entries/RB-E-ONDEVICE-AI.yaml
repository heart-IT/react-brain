id: RB-E-ONDEVICE-AI
topic: "On-device AI / ML"
category: ai-ml
group: ai
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-ONDEVICE-AI.md
confidence: low
platforms: [react-native]
options:
  - { name: "react-native-executorch", tradeoff: "cross-platform on-device models (Meta ExecuTorch) with per-silicon delegates and worklet-callable JSI; tool-calling/embeddings since 0.4, OCR since 0.3. 0.11.1 (2026-11-19, verified vs npm + the GitHub releases 2026-11-25); 0.10 was a GROUND-UP REWRITE, 0.11 (2026-10-27) adds TypeScript LLM runners with a llama.cpp-derived sampler, 16k contexts, an in-memory vector store, depth/inpainting models and (0.11.1) Reverb voice-cloning TTS + opt-in Qualcomm QNN. Worklets peer widened to <0.14 (Reanimated 4.7 OK, 4.8 not yet); RN floor 0.83 — see note: EXECUTORCH 0.11." }
  - { name: "@react-native-ai/apple", tradeoff: "Apple on-device LLM + SpeechAnalyzer (iOS 26); zero cloud, no model to ship; RN 0.80+ (preview). 0.12.0 (2026-01-28, verified vs npm 2026-09-24): eight months without a release, so the preview label is doing real work." }
  - { name: "@react-native-ai/android", tradeoff: "Google Gemini Nano on ANDROID via ML Kit GenAI behind one Vercel-AI-SDK provider; same react-native-ai family as the Apple provider. 0.13.0 (2026-11-11, verified vs npm). Replaces @react-native-ai/adk (deprecated on npm 'Replaced by @react-native-ai/android', last 0.12.1)." }
  - { name: "react-native-nitro-mlx", tradeoff: "Apple MLX on-device LLM + TTS/STT via Nitro Modules, with tool calling (ChatSession API); iOS 26+ ONLY; v0.7 (2026-08-22, verified vs npm 2026-09-24), ~100★ — niche/early." }
  - { name: "react-native-rag", tradeoff: "on-device RAG over ExecuTorchLLM with a local vector store. Tracks executorch minors in lockstep: 0.10.0 (2026-10-05) for executorch ^0.10.4; @react-native-rag/executorch 0.11.0 (2026-11-02, verified vs npm 2026-11-25) peers react-native-executorch ^0.11.0 and react-native-rag ^0.11.0; 0.9.0 remains the line for executorch 0.9. See note: RAG VERSION PINCER." }
  - { name: "@react-native-ai/llama", tradeoff: "llama.cpp behind the Vercel AI SDK provider interface: runs GGUF chat AND embedding models on one engine, which makes a hand-rolled local RAG pipeline practical; pair with react-native-nitro-sqlite + sqlite-vec (see reading: Fitting RAG in Your Pocket). 0.12.0 (2026-01-28, verified vs npm 2026-09-24)." }
  - { name: "offline speech (expo-speech-recognition / whisper.rn)", tradeoff: "speech-to-text without network; whisper.rn (0.7.2, ~800★, verified vs npm + repo 2026-07-28) is the concrete binding — whisper.cpp under the hood, and it also carries NVIDIA Parakeet ASR alongside Whisper." }
recommend:
  default: "Cross-platform on-device models → react-native-executorch (0.11+); Apple-only → @react-native-ai/apple (Apple's own models, nothing to ship); local RAG → react-native-rag on the matching executorch minor (0.11 ↔ 0.11, packaged), or hand-roll it with @react-native-ai/llama + nitro-sqlite/sqlite-vec. Fast-moving (confidence: low): validate on-device perf before committing."
  when:
    - "offline speech-to-text → expo-speech-recognition (managed path), else whisper.rn for whisper.cpp/Parakeet models"
    - "private/offline LLM over local docs → @react-native-ai/llama + nitro-sqlite/sqlite-vec (budget RAM for generator + embedder TOGETHER; see reading)"
    - "packaged RAG → the react-native-rag minor matching your executorch minor (executorch 0.11 → @react-native-rag/executorch 0.11, 0.10.4+ → 0.10, 0.9 → 0.9.0); bump them together"
    - "app on Reanimated 4.8 / Worklets 0.14 → not yet with executorch: 0.11.1 peers react-native-worklets <0.14.0, so hold Reanimated at 4.7 (Worklets 0.13.x)"
    - "Android with on-device Gemini Nano → @react-native-ai/android (replaces the deprecated @react-native-ai/adk)"
    - "iOS 26+ only and want MLX with TTS/STT in one Nitro module → react-native-nitro-mlx (early; pin)"
note: >
  Choose a runtime, not a model: the runtime (loading, tensors, hardware backend, JS bindings)
  changes slowly, while the model leaderboard churns monthly, so this entry selects runtimes and
  leaves model choice to your own on-device benchmarks. react-native-executorch holds the
  cross-platform lane because it is the only option that treats both platforms and multiple
  accelerators as first-class, and since 0.10 its orchestration is TypeScript you can edit.
  Apple's own stack wins the Apple-only lane by shipping no model at all. Local RAG has a packaged
  path again since react-native-rag 0.10 followed the executorch rewrite (2026-10-05), with one
  engine plus a vector store as the hand-rolled alternative. The area outpaces any settled recommendation (confidence: low) → validate on real devices.

  EXECUTORCH 0.10 REWRITE (2026-09-08, verified vs the GitHub release + the 0.10.1 patch; npm latest
  0.10.2, 2026-09-11): the library was rebuilt on a TWO-LAYER architecture — native now exposes only
  the ExecuTorch runtime, tensors and fast ops, while task orchestration moved into transparent
  TypeScript pipelines you can read, edit, chain, or replace with a custom model, where 0.9 shipped
  opaque C++ task modules with rigid interfaces. (1) HARDWARE ACCELERATION: 0.9 was mostly CPU; 0.10
  wires per-silicon delegates across 130+ pre-exported model variants (Core ML / Apple Neural Engine,
  70+ variants · MLX over Metal for LLM generation, ~40 exports · Vulkan on Android, 25+ exports), with
  the multi-threaded XNNPACK CPU path as the fallback; the vendor frames the win as inference speed,
  thermal throttling and battery, not just latency. (2) WORKLETS: every native JSI function carries
  "worklet"; by default, so model calls run off the main JS thread or inside UI worklets, which is
  what makes live-camera inference with VisionCamera straightforward. (3) BINARY SIZE: backend
  binaries are fetched on demand at install (zero-config by default), and a `react-native-executorch`
  block in package.json narrows the download to the backends/tasks you use. Migration: 100%
  functional parity is claimed and a `react-native-executorch/legacy` entry point preserves the
  pre-0.10 API for screen-by-screen migration, but it is marked DEPRECATED and slated for removal →
  a stepping stone, not a resting place. Take 0.10.1 (2026-09-09) or later, not 0.10.0: 0.10.1 fixes
  iOS `use_frameworks!` duplicate-header build failures and silent setup failures, and pins
  react-native-worklets >=0.10.0 <0.13.0 (unchanged in 0.10.2 and in 0.10.5, 2026-10-06, verified vs
  npm 2026-10-08). Reanimated 4.7 requires Worklets 0.13.x (RB-E-ANIMATION), so an app on executorch
  0.10.x stays on Reanimated 4.6 (Worklets 0.12.x, RN 0.83–0.87); 0.11 widens that range (see EXECUTORCH 0.11). The repo also publishes
  vX.Y.Z-libs GitHub tags (native library builds, v0.10.5-libs on 2026-09-22); those are not npm
  versions of the package.

  EXECUTORCH 0.11 (0.11.0 2026-10-27, 0.11.1 2026-11-19; verified vs the GitHub releases + npm
  2026-11-25): the worklets peer is now >=0.10.0 <0.14.0, so Reanimated 4.7 (Worklets 0.13.x) works
  with it — the "stays on Reanimated 4.6" caveat is retired — but Reanimated 4.8.0 (2026-11-19) peers
  Worklets 0.14.x, one past the range, so an executorch app holds Reanimated at 4.7. 0.11.1 also
  declares the RN 0.83 floor as a peer. What 0.11 adds: LLM generation on modular TypeScript runners
  (text, multimodal, Gemma) with a llama.cpp-derived sampler and constrained decoding, re-exported LLMs
  with up to 16k-token contexts, createVectorStore (in-memory top-k with metadata filters) and ColBERT
  late-interaction embeddings, depth estimation and inpainting models, Vulkan as the Android default
  for more vision models; 0.11.1 adds Reverb on-device voice-cloning TTS and an opt-in Qualcomm QNN
  backend on Snapdragon 8 Gen 1+ (apps need useLegacyPackaging = true). BREAKING: the @experimental LLM
  runner API changed (chat/generation APIs did not), 15 unquantized XNNPACK LLM variants were removed
  and 66 more are deprecated for removal in v1.0.0. The v0.11.2-libs native build notes that MLX models
  exported for v0.11.x will need re-exporting — not device-tested yet, so watch the next npm minor.

  RAG VERSION PINCER (2026-09-24, verified vs npm + the GitHub repo): react-native-rag is still 0.9.0
  (last publish 2026-05-26) and built against executorch's pre-0.10 API, while executorch's legacy
  entry point for that API is deprecated. A migration is now in flight: PR #23 "feat(executorch)!:
  migrate to react-native-executorch 0.10" has been open since 2026-09-17 with commits through
  2026-09-22 — breaking, unmerged and unreleased. So the risk moved from "may not follow" to "is
  following, not shipped" → roll the pipeline yourself on executorch 0.10 today, and re-check the
  package when a release carrying PR #23 appears. RESOLVED 2026-10-08 (verified vs npm):
  react-native-rag 0.10.0 published 2026-10-05 with @react-native-rag/executorch 0.10.0 (peers
  react-native-executorch ^0.10.4, react-native-worklets >=0.10.0 <0.13.0) and
  @react-native-rag/op-sqlite 0.10.0 → the packaged path is back on the current executorch; the
  hand-rolled llama path stays the option when you want one engine for embedder and generator.

  RB-E-AI-UI owns cloud-LLM app UI; RB-E-MEDIA owns camera pipelines; RB-E-ANIMATION owns the
  worklets runtime; RB-E-NATIVE owns JSI memory and threading; RB-E-STORAGE owns the vector store.

  HISTORY:
  2026-11-25 REOPENED: @react-native-ai/adk deprecated on npm → @react-native-ai/android (on-device Gemini Nano via ML Kit GenAI); option row, when-clause, detect row, migrate rule.
  2026-11-25 REOPENED (tripwire fired): executorch 0.11 widened its Worklets peer to <0.14 (Reanimated 4.7 OK, 4.8 not); 0.11 features + breaking list; react-native-rag 0.11 tracks it; tripwire executorch ≥0.12.0 wired.
  2026-10-08 REOPENED: react-native-rag 0.10.0 shipped the executorch 0.10 migration — packaged RAG is back on the current executorch; default lists both paths.
  2026-10-08 CORRECTED: executorch npm latest is 0.10.5 (2026-10-06); 0.10.4 (2026-09-28) became a real npm release after the 09-24 correction. Its Worklets <0.13 pin keeps executorch apps on Reanimated 4.6.
  2026-09-24 CORRECTED: executorch npm latest is 0.10.2 — the "0.10.4" cited 2026-09-21 is a v0.10.4-libs GitHub tag; @react-native-ai/apple 0.12.0 was published 2026-01-28 (2026-02-11 is the registry's metadata-modified date).
  2026-09-24 REOPENED: react-native-rag PR #23 migrates to executorch 0.10 (open, breaking, unreleased); the default local-RAG pick moved to the @react-native-ai/llama path, matching the existing when-clause.
  2026-09-21 CHALLENGED → WEAKENED: re-check — rag still 0.9.0 against executorch 0.10.x.
  2026-09-10 CHALLENGED → WEAKENED: react-native-rag predates the executorch rewrite; @react-native-ai/apple months quiet.
  2026-09-10 GAP CLOSED: executorch v0.10 ground-up rewrite (TS pipelines, Core ML/MLX/Vulkan delegates, worklets, on-demand binaries).
  2026-08-24 GAP CLOSED: nitro-mlx pin v0.5 → v0.7.
  2026-08-18 GAP CLOSED: local-RAG build reading (llama.cpp + sqlite-vec) + @react-native-ai/llama row.
  2026-08-04 GAP CLOSED: Margelo on-device face-recognition reading.
  2026-07-28 GAP CLOSED: whisper.rn named as the offline-ASR binding (+ Parakeet).
