id: RB-E-STORAGE
topic: "On-device storage & persistence"
category: storage
group: platform-native
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-STORAGE.md
confidence: medium
platforms: [react-native]   # narrowed 2026-07-13: all options are RN; no web storage guidance held yet
options:
  - { name: "@react-native-async-storage/async-storage", tradeoff: "simple async key-value; v3.x is instance-based (createAsyncStorage), getMany/setMany/removeMany, requires RN 0.76+; v2 default export kept for back-compat" }
  - { name: "react-native-mmkv (v4)", tradeoff: "fast synchronous key-value; v4 is a full Nitro Modules rewrite (restores Old-Arch compat); common AsyncStorage replacement" }
  - { name: "op-sqlite / expo-sqlite", tradeoff: "relational SQLite; op-sqlite is high-perf JSI" }
  - { name: "react-native-keychain / expo-secure-store", tradeoff: "secure storage for tokens/secrets (Keychain/Keystore)" }
recommend:
  default: "Small key-value → react-native-mmkv (fast, synchronous). Relational/large → op-sqlite or expo-sqlite. Secrets/tokens → Keychain / secure-store, never AsyncStorage."
  when:
    - "simple persisted prefs, no perf concern → AsyncStorage is fine"
    - "frequent synchronous reads → MMKV"
    - "structured/queryable data → SQLite (op-sqlite for perf)"
    - "P2P / local-first app → primary persistence is the Hypercore/Autobase/Hyperbee log, not KV/SQLite (KV like AsyncStorage is just for local prefs) — see RB-E-P2P"
note: "AsyncStorage v3.x moved to instance-based storage (createAsyncStorage) and requires React Native 0.76+ (NOT New-Arch-only — that earlier claim was wrong; verified vs the v3 migration docs). react-native-mmkv v4 is a full Nitro rewrite (Oct 2025) that restored Old-Arch compat. Latest: async-storage 3.1.x, mmkv 4.3.x, op-sqlite 18.1.1 (2026-08-17). OP-SQLITE 18 IS BREAKING (2026-08-14, verified vs the GitHub releases): 18.0.0 REMOVES crsqlite — if you were using op-sqlite as the local half of a CRDT-synced store, that extension is gone and the migration is yours; it also rebinds hooks/reactive flush to their runtime generation and drops an internal mutex in favour of self-cleaning databases. 18.1 adds initial Swift Package Manager support and RN 0.87 compatibility, so on 0.87 this is the line to be on."
defer_to_skill: null
doc: "RB-E-STORAGE.md"   # long-form Explanation entry in content_dir
updated: 2026-08-18   # op-sqlite 18 — crsqlite removed (breaking), SPM + RN 0.87 compat in 18.1
sources:
  - "https://github.com/OP-Engineering/op-sqlite/releases"
  - "https://react-native-async-storage.github.io/3.1/migration-to-3/"
  - "https://github.com/mrousavy/react-native-mmkv/releases"
reading:
  - title: "SQLite for React Native, but 5x faster and 5x less memory"
    url: "https://ospfranco.com/post/2023/11/09/sqlite-for-react-native,-but-5x-faster-and-5x-less-memory/"
    by: "Oscar Franco (op-sqlite author)"
    what: "The library author walks the JSI/C++ internals that make op-sqlite fast and memory-light — lazy HostObject conversion, std::variant over a custom struct, key-sharing across result rows — with benchmarks. The mechanics of high-performance JSI SQLite, not API usage."
  - title: "An Interactive Guide to TanStack DB"
    url: "https://frontendatscale.com/blog/tanstack-db/"
    by: "Maxi Ferreira (Frontend at Scale)"
    what: "Builds the local-first reactive-persistence mental model from first principles — Collections, live queries via differential dataflow, optimistic transactional mutations — contrasting it with request/response fetching. The shift to sync-engine thinking."
  - title: "Why We Did Not Move MMKV Writes to a Worklet: The Serialization Cost"
    url: "https://andrei-calazans.com/posts/2026-07-28-mmkv-writes-worklet-serialization-cost/"
    by: "Andrei Calazans"
    what: "A measured NEGATIVE result, which is why it is worth holding: MMKV writes are synchronous and block the JS thread, so moving them into a worklet looks like free relief. It isn't. Moving just the write left the ~29.56ms cost intact — it simply moved from the write into createSerializableString, because copying the string into the worklet costs what the write did. Sending the raw store object instead was worse (~132ms, cloning every property one at a time via cloneObjectProperties/clonePlainJSObject), and Bundle Mode changed nothing (~136ms), confirming the cost tracks data-structure size rather than compilation. The durable rule: a worklet is not a free way to move work off the JS thread — you pay serialization at the boundary, so measure that cost first and send the smallest payload you can."
    claim: "You ship MMKV with worklets — moving writes into a worklet does not offload them: serialization at the boundary cost the same ~29.56ms as the write, and passing a whole store object cost ~132ms. Measure the boundary cost before moving work off the JS thread."
    applies_when: { deps: ["react-native-mmkv", "react-native-worklets", "react-native-reanimated"], platforms: [react-native] }
detect:   # package.json dep → this entry (pkg: exact | @scope/* | name*; token matched against recommend text)
