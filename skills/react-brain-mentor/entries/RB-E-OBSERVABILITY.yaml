id: RB-E-OBSERVABILITY
topic: "Crash reporting, monitoring & observability"
category: observability
group: tooling-ops
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-OBSERVABILITY.md
confidence: medium
platforms: [react, react-native]
options:
  - { name: "Sentry (v8)", tradeoff: "Crash + performance monitoring on both platforms; v8 of @sentry/react-native captures crashes before RN bootstraps via sentry.options.json (the 'instant death on TestFlight' class). @sentry/react-native 8.28.0 (2026-09-24, verified vs npm); web uses @sentry/react 11.0.0 (2026-09-23, verified vs npm)." }
  - { name: "EAS Observe (Expo)", tradeoff: "Production performance monitoring for Expo apps: real-session startup/TTI/bundle-load/update-apply metrics with every build and OTA update as a marker, plus per-route TTI. Not a crash reporter — no native crashes, keep Sentry alongside. GA 2026-08-25 (verified vs the GA post); expo-observe 57.0.24 (2026-09-24, verified vs npm). See note: EAS OBSERVE." }
  - { name: "Firebase Crashlytics / Bugsnag", tradeoff: "Established crash reporting; neither gives Observe-style build/update attribution. @react-native-firebase/crashlytics 26.4.0 (2026-09-05), @bugsnag/react-native 9.0.0 (2026-09-22, new major; both verified vs npm)." }
  - { name: "Rozenite (Callstack incubator)", tradeoff: "Plug-and-play panels inside React Native DevTools (network/storage/performance, custom type-safe panels), no extra window or server; plugins are auto-disabled in production builds. rozenite 2.4.0 (2026-09-03, verified vs npm). See note: ROZENITE." }
  - { name: "React DevTools 8.0", tradeoff: "8.0.0 (2026-09-08, verified vs CHANGELOG) removes the Timeline profiler tab — React profiling moves to the browser Performance panel's React tracks — and turns the Suspense tab on by default. A runbook that says 'open the Timeline tab' is out of date. See note: REACT DEVTOOLS 8.0." }
  - { name: "@callstack/inspector", tradeoff: "React-level component profiling in RELEASE builds via React DevTools, zero native changes — the honest lens, since dev-mode profiling misrepresents production. 0.1.1 (2026-05-22, verified vs npm): very young." }
recommend:
  default: "Sentry for crash + performance monitoring on React and React Native (v8 of the RN SDK catches pre-bootstrap crashes); add app/route-level error boundaries and wire them to it at the production stage."
  when:
    - "on Expo (SDK 55+) and want build/OTA regression tracing or per-route time-to-interactive → EAS Observe (add alongside Sentry; expo-observe + markInteractive(); needs a new binary; does not capture native crashes)"
    - "already on Firebase → Firebase Crashlytics (for crashes; add Sentry or EAS Observe for performance)"
    - "already on Bugsnag → Bugsnag (keep it for crashes; 9.0.0 is a new major, read its changelog before upgrading)"
    - "need component-level profiling of a RELEASE build → @callstack/inspector (0.1.x; dev-mode profiles misrepresent production)"
    - "profiling React on the web or following an older runbook → React DevTools 8.0 (browser Performance panel React tracks; the Timeline tab is gone)"
    - "day-to-day React Native inspection (network, storage, performance) → Rozenite (inside React Native DevTools; Expo SDK 52+ / RN 0.76+ / Re.Pack 5.2+)"
note: >
  Observability is three questions, not one tool: did it crash, is it slow, and which release did it.
  Sentry holds the default because one SDK covers the first two on both platforms, and v8 of the RN
  SDK closed the classic blind spot of crashes before the JS bundle loads. Error boundaries are the
  collection points that turn an uncaught render error from a blank tree into a report, which is why
  the source scan flags production repos with none. It is a production-stage concern: a prototype
  does not need dashboards; a production app without them cannot see what users hit.

  EAS OBSERVE (2026-08-25 GA, verified vs the Expo GA post; open beta May→Aug): install expo-observe,
  wrap the root in <ObserveRoot> and call markInteractive(); it reports startup (cold/warm),
  time-to-interactive/time-to-render, bundle load and EAS Update download/apply times from real
  sessions, P50/P90/P99 across devices, plus JS errors and device context. Two things Sentry-style
  tools do not give: every build AND OTA update lands as a marker, so a regression traces to the
  release that caused it, and the Expo Router / React Navigation integration breaks time-to-interactive
  down per route. Metrics are queryable from the EAS CLI as JSON (there is an eas-observe Expo Skill
  for agent handoff). Pricing is per event, not per MAU: 100K events/mo free; Starter $19/mo and
  Production $199/mo each include 500K; $5 per million beyond; 90-day minimum retention. Floors: SDK
  55+ for startup metrics, 56+ for per-route metrics, 57+ for JS error reporting (in preview); enabling
  it needs a new binary, not just config. It does not capture native crashes, and Expo's own guidance
  is to keep Sentry alongside.

  EXPO-OBSERVE SDK 58 SURFACE (2026-09-21, verified vs the Expo SDK 58 beta changelog): the error side
  grows — ObserveErrorBoundary and reportError, an errorHandlingEnabled option,
  Observe.registerIntegration, an expo-image integration, and Observe.clientId (the EAS client id
  stamped on every event) — and the `AppMetrics` export is DEPRECATED in favour of `Observe`. Beta-era
  tutorials use the old name, so a copied example now warns; the fix is a rename. Three smaller
  deprecations in the same release touch code observability setups tend to own: expo-file-system
  File.md5 → File.digest(), expo-modules-core NativeArrayBuffer → ArrayBuffer, and @expo/ui iOS
  backgroundOverlay → background.

  REACT DEVTOOLS 8.0 (2026-09-08, verified vs the React DevTools CHANGELOG): the Timeline profiler tab
  is removed and React profiling moves to the browser's Performance panel, which carries React tracks;
  the Suspense tab is on by default (see what caused a component to suspend); the browser Elements
  panel gains a React Element pane mapping the inspected DOM node to its component; <Activity>
  subtrees are shown and dimmed when hidden.

  ROZENITE (2026-09-10, verified vs the GitHub repo and v2.3.0 release notes; version re-checked
  2026-09-24 vs npm): fills the gap between "React DevTools shows me the component tree" and "I need a
  whole APM". Works on Expo and bare RN across Metro and Re.Pack; Rozenite >=2.0 needs Expo SDK 52+ /
  RN 0.76+ / Re.Pack 5.2+. Reaches Lynx via rspeedy and RN Web via a browser extension (both
  experimental). About 656 stars, active since 2025-07 — young but past the prototype stage. Agent
  angle: `rozenite agent tap` streams plugin/runtime state to stdout, the same job the Reactotron MCP
  row in RB-E-AI-DEVTOOLS does, so on an RN project it serves both the human debugging surface and the
  agent one.

  CROSS-REFERENCES: RB-E-OTA owns staged rollout and rollback (the action side of Observe's
  attribution); RB-E-AI-DEVTOOLS owns agent-facing runtime inspection (Reactotron MCP);
  RB-E-META-FRAMEWORKS owns rendering strategy behind the web metrics.

  HISTORY:
  2026-09-24 REOPENED: version receipts re-checked vs npm; Bugsnag 9.0.0 (2026-09-22) and the web
  Sentry SDK major (@sentry/react 11) recorded.
  2026-09-21 REOPENED: expo-observe AppMetrics deprecated → Observe; SDK 58 error-reporting surface.
  2026-07-10 GAP CLOSED: @callstack/inspector added (release-build profiling, verified vs npm).
