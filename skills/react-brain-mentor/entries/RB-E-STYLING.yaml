updated: 2026-09-24   # NativeWind v5 at RC, Uniwind TW4 peer floor, StyleX 0.19, styled-components v7 prerelease date (npm); prior 2026-09-21: Tailwind Labs joined Shopify — OSS stays MIT under the same team, Tailwind Plus/ui.sh closed to new sign-ups (React Status #490)
reading:
  - title: "Styling Linear for the future with StyleX"
    url: "https://linear.app/now/styling-linear-for-the-future-stylex"
    by: "Kenneth Skovhus (Linear)"
    what: "The first detailed non-Meta production migration TO StyleX, and the most useful part is the selection criteria, not the endorsement. Linear's non-negotiables: generate styles at BUILD time, make styling-at-a-distance deliberately hard (not just discouraged by convention) while still letting components expose explicit styling contracts, predictable cross-file merge without specificity games, and — stated as a first-class criterion — agent ergonomics. vanilla-extract was the runner-up (static extraction, strong types) and lost on API fragmentation and the component/style file split; StyleX won on colocation, a small API, and deterministic resolution. The honest tradeoff is stated too: parent-dependent selectors, global selectors and restyling-through-wrappers all get harder, which is the point but is also the migration cost. What pushed them off styled-components was a performance regression after the React 18 concurrent-rendering upgrade plus styled-components entering maintenance mode. Measured payoff, isolated as best they could: removing runtime style injection cut main-thread CPU for style work ~20–35% on view-heavy pages (~30% faster on a mid-tier machine), and a navigation went from injecting hundreds of CSS rules to zero. Two process lessons that generalize past StyleX: a deterministic CODEMOD carried the bulk (styled-components is Turing-complete, so agents produced plausible-but-wrong output early on — model capability only made agents the better tool partway through the project), and the end state is held in place by tooling — Oxlint rules for the fast local checks plus a custom TYPE-AWARE repository checker that traces sx through wrappers and polymorphic components to catch conditional styles silently dropped across boundaries. They kept CSS Modules as an explicit escape hatch for genuinely CSS-shaped problems (global selectors, third-party DOM) and extended StyleX for runtime-generated theming rather than fighting it."
    claim: "Weighing a move off runtime CSS-in-JS: Linear's StyleX migration gives the criteria (build-time generation, hard-to-style-at-a-distance, predictable merge) and the payoff — ~20–35% less main-thread style CPU on view-heavy pages."
    applies_when: { deps: ["styled-components", "@emotion/react", "@emotion/styled", "@stylexjs/stylex"], platforms: [react] }
  - title: "Why We're Breaking Up with CSS-in-JS"
    url: "https://www.spotvirtual.com/blog/why-were-breaking-up-with-css-in-js"
    by: "Sam Magura (Emotion maintainer)"
    what: "The canonical runtime-cost argument against runtime CSS-in-JS, from an Emotion maintainer: per-render style serialization is slow (a benchmark shows ~48% faster renders after dropping Emotion). Motivates the move to compile-time / zero-runtime styling."
    claim: "You ship runtime CSS-in-JS — per-render style serialization has a measured cost (~48% faster renders after dropping Emotion in this benchmark); compile-time styling (Tailwind/StyleX) moves that cost to build."
    applies_when: { deps: ["styled-components", "@emotion/*"] }
  - title: "StyleX: A Styling Library for CSS at Scale"
    url: "https://engineering.fb.com/2025/11/11/web/stylex-a-styling-library-for-css-at-scale/"
    by: "Meta Engineering"
    what: "Architecture explainer for the leading zero-runtime approach: a Babel compiler extracts styles into deterministic atomic CSS at build time (no runtime injection), resolving specificity/shorthands at compile time so CSS size stays flat at scale."
    claim: "You ship StyleX — its Babel compiler extracts deterministic atomic CSS at build time (no runtime injection), resolving specificity/shorthands at compile time so CSS size stays flat at scale."
    applies_when: { deps: ["@stylexjs/stylex"] }
  - title: "Moving Linear from styled-components to StyleX"
    url: "https://www.skovhus.dev/blog/moving-linear-from-styled-components-to-stylex"
    by: "Kenneth Skovhus (Linear)"
    what: "First-hand account of a large production CSS-in-JS to StyleX migration: build-time vs runtime styling, ~30% nav improvement, and agent-driven codemods at 100k-line scale. The migration companion to the runtime-cost argument above."
    claim: "You ship styled-components — Linear's production migration to StyleX is the playbook: build-time vs runtime styling, ~30% nav improvement, agent-driven codemods at 100k-line scale."
    applies_when: { deps: ["styled-components"] }
  - title: "I've Maintained Linaria for Six Years: Here's Why I Built Something New"
    url: "https://dx-styles.dev/blog/why-dx-styles/"
    by: "Anton Evzhakov (Linaria maintainer)"
    what: "The Linaria maintainer's own verdict on the category: runtime CSS-in-JS is winding down, and two foundational Linaria issues can't be fixed without breaking its core design — so Linaria stays maintained but frozen (NOT deprecated), and his successor dx-styles (zero-runtime on wyw-in-js, RSC-compatible, typed recipe variants, token contracts) ships with a Linaria migration guide. Supersession-in-progress: watch dx-styles, no migrate rule yet."
    claim: "You ship Linaria — its maintainer says its foundational issues are unfixable by design; the library stays maintained but frozen, and his zero-runtime successor dx-styles (RSC-compatible) publishes a Linaria migration guide."
    applies_when: { deps: ["linaria", "@linaria/*"] }
  - title: "The State of Zero-Runtime CSS-in-JS, Mid-2026"
    url: "https://dx-styles.dev/blog/state-of-zero-runtime-css-in-js/"
    by: "Anton Evzhakov (maintains Linaria + wyw-in-js; built dx-styles — conflicts disclosed in the post)"
    what: "The comparative map this entry's options list lacks: where every live zero-runtime option actually sits — Linaria (maintained, frozen), next-yak (Rust compiler over styled-syntax, RSC-compatible), vanilla-extract (the TypeScript answer to CSS Modules, typed themes), Panda CSS (config-first, atomic output), StyleX (Meta's, strict constraints + deterministic merging), Griffel (Microsoft/Fluent UI, limited ecosystem interop), and dx-styles itself. Routes by situation rather than ranking: big styled-components codebase → next-yak or Linaria; typed styles with little setup → vanilla-extract or Panda; design system → dx-styles or vanilla-extract; hundreds of teams → StyleX; pragmatic → Tailwind or CSS Modules. The category has CONVERGED on plain class-name output, so the live differences are atomicity, authoring style and design-system features — not runtime cost, which the readings above already settle. KEPT ON THE 2026-08-04 ADVOCATE PASS after three cap-skips: recurring in three sources at once, and it is the only piece here covering the field rather than one library."
    claim: "You ship zero-runtime CSS-in-JS — the field converged on plain class-name output, so pick on atomicity and design-system features: next-yak/Linaria for a styled-components codebase, vanilla-extract or Panda for typed styles, StyleX at hundreds-of-teams scale."
    applies_when: { deps: ["linaria", "@linaria/*", "@vanilla-extract/*", "@pandacss/*", "next-yak", "@griffel/*", "@stylexjs/stylex"], platforms: [react] }
