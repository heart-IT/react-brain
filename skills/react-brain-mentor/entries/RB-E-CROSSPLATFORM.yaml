id: RB-E-CROSSPLATFORM
topic: "Sharing code across React (web) & React Native"
category: cross-platform
group: app-architecture
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-CROSSPLATFORM.md
confidence: high
platforms: [react, react-native]
options:
  - { name: "shared logic/hooks package", tradeoff: "platform-agnostic core (business logic, state, data) in a workspace package; serves the web app and the native app alike — the highest-leverage, lowest-risk share" }
  - { name: "platform-extension files (.web.tsx/.native.tsx)", tradeoff: "one API, per-platform implementation; keeps each file single-platform instead of Platform.OS branching" }
  - { name: "React Strict DOM (Meta)", tradeoff: "write strict HTML/CSS rendering web + native; Babel flattens to real DOM + static CSS on web; involved setup. Pre-1.0 and QUIET: 0.0.55 (2026-01-09) is still the latest npm release and the repo's last commit is 2026-08-31 (both verified 2026-10-15); see note: REACT-NATIVE-WEB" }
  - { name: "react-native-web", tradeoff: "MAINTAINED AGAIN since 2026-10-07 — maps RN primitives to HTML; Expo-backed maintainers took it over with its creator and it is moving to the React Foundation org. A breaking 0.22 modernization is planned (React 19-only, ESM, newer browser floor). 0.21.4 (2026-10-08, verified vs npm); see note: REACT-NATIVE-WEB" }
  - { name: "Tamagui", tradeoff: "cross-platform UI + optimizing compiler; 3.0 (2026-10-10, verified vs the v3.0.0 release) adds React Strict DOM elements and a Tailwind authoring mode on the same compiler and is a breaking major for v2 apps — RB-E-STYLING owns the detail (see note: TAMAGUI 3 there)" }
  - { name: "Expo Universal Components / @expo/ui", tradeoff: "single API → SwiftUI (iOS) / Jetpack Compose (Android) / react-dom or react-native-web (web); native APIs stable since SDK 56, web APIs still experimental (verified vs the SDK 56 changelog); see note: EXPO UI" }
  - { name: "Solito", tradeoff: "shared routing across Expo + Next.js; v5 dropped the RN-Web core dep" }
  - { name: "Expo DOM Components (`use dom`)", tradeoff: "render real web components inside RN via a webview wrapper (since Expo SDK 52); good for incremental web reuse" }
recommend:
  default: "Shared logic/hooks package (a platform-agnostic workspace package used by both the React web app and the React Native app) first — the highest-leverage, lowest-risk win. For shared UI on NEW projects the pick is Expo Universal Components in an Expo app, otherwise react-native-web (maintained again since 2026-10 under Expo + the React Foundation) for RN-primitive authoring; React Strict DOM stays an option for strict HTML/CSS authoring but has shipped nothing to npm since 2026-01. The pick changes only for an organisation that can staff and gate agent-maintained duplicate native implementations (see when)."
  when:
    - "duplicated business logic across web + native → shared logic/hooks package (extract a workspace package now)"
    - "UI that must differ per platform behind one API → platform-extension files (.web.tsx/.native.tsx)"
    - "new universal UI in an Expo app → Expo Universal Components (@expo/ui; native lanes stable, web lane experimental)"
    - "new universal UI authored with RN primitives, web as a real target → react-native-web (maintained again since 2026-10; expect the breaking 0.22: React 19-only, ESM, newer browsers)"
    - "new universal UI authored as strict HTML/CSS, web-first → React Strict DOM (pre-1.0, involved setup, no npm release since 2026-01-09 — pin and watch)"
    - "existing react-native-web app → react-native-web (keep it; maintained again — move to React 19 before the 0.22 line)"
    - "existing Tamagui design system → Tamagui (keep it; cross-platform UI with an optimizing compiler)"
    - "Expo + Next.js shared routing → Solito"
    - "incremental web reuse inside an RN app → Expo DOM Components (`use dom`)"
    - "native-only mobile org that can staff and gate agent-maintained duplicate Swift/Kotlin implementations → share the spec, not the code (Shopify's route; see note: SHOPIFY)"
note: >
  Share by layer. Logic, state and data are platform-agnostic, so a shared workspace package is
  the highest-leverage, lowest-risk win — and in a React web + React Native codebase it also
  serves the web app. When logic or components are duplicated across a web app and a native app,
  that duplication is the prime target. UI that diverges per platform is split by
  platform-extension files so each file stays single-platform; widespread inline Platform.OS
  branching means sharing happens at the wrong layer. Universal UI is picked only on a maintained
  lane.


  REACT-NATIVE-WEB (2026-10-15, verified vs necolas/react-native-web discussion #2872 and npm):
  earlier in 2026 react-native-web sat in MAINTENANCE-ONLY mode — creator Nicolas Gallagher and
  Zalando had pivoted to React Strict DOM. That reversed on 2026-10-07: Mathieu (@zoontek), with
  Gallagher, Expo and the community, picked up active maintenance and development, and the repo is
  moving to the React Foundation GitHub org next to React and React Native. Gallagher called it "the
  ideal outcome for RNW". The direction is conservative — track React Native as closely as
  practical; native/web convergence questions belong to React Native and React Strict DOM. Releases
  resumed (0.21.3 2026-09-25, 0.21.4 2026-10-08). The modernization lands on a 0.22-dev branch and
  is BREAKING: react/react-dom peers ^19.0.0 (React 18 dropped), browser floor Chrome/Edge 95+,
  Firefox 93+, Safari/iOS Safari 15.1+, an ESM ("type": "module") package, Flow → TypeScript,
  removal of modules React Native core no longer has (CheckBox, Picker, ProgressBar, YellowBox,
  InteractionManager, the old Touchable mixin), missing RN APIs added (PlatformColor,
  useAnimatedValue, usePressability and more), and babel-plugin-react-native-web deprecated in
  favour of a bundler alias plus tree shaking. Meanwhile React Strict DOM has gone quiet: 0.0.55
  (2026-01-09) is still its latest npm release and the repo's last commit is 2026-08-31; in the
  same thread contributors described its activity as "mostly stalled since spring", and Gallagher
  suggested Expo might help there "at some point". → react-native-web is a maintained lane again
  and no longer a bet to avoid; React Strict DOM is still an option but pin it and watch for a
  release. Existing RN-Web apps should get onto React 19 before 0.22.


  EXPO UI (2026-09-24, verified vs the SDK 56 changelog): SDK 56 made the Expo UI native APIs
  stable and added universal components across Android, iOS and web, backed by
  @expo/ui/jetpack-compose, @expo/ui/swift-ui and react-dom or react-native-web; the web APIs are
  still experimental and likely to change. → Expo apps get a universal-UI lane without splitting
  files; treat its web half as unstable.


  SHOPIFY (2026-09-21, verified vs shopify.engineering/back-to-native): Shopify is moving its
  mobile apps off React Native to Swift and Kotlin. It adopted RN in 2020 to stop building
  features twice, let developers work across the stack and stop chasing parity; all three
  delivered. Its reason to leave: coding models made "building the same feature in Swift and
  Kotlin" no longer carry "the cost it used to", so sharing an implementation lost value while
  platform closeness and first-party tooling did not. It does not claim RN is slow ("React Native
  apps can be fast. Ours are") or was wrong ("React Native was the right choice for Shopify in
  2020"). Its replacement is the new option in this design space: duplicate the implementation
  per platform and hold parity through shared specifications, tests and review checkpoints that
  agents execute, with an agent implementing a feature on Android using the iOS version as a
  reference — "share the spec, not the code". The default still holds on this entry's terms: (1)
  the default's claim is about LOGIC, and two agent-maintained copies are cheaper than before but
  not free ("that cost has not disappeared"); (2) the migration is not a swap a normal team can
  copy — greenfield rebuilds, a bespoke checkpoint-gated system (Helix), and business logic
  re-architected to run headless for agents; (3) this entry's scope includes the web app, which a
  shared logic package also serves and which Shopify's decision does not weigh. → A team with
  that machinery has a real alternative to sharing code; a team without it still pays full price
  for duplicated logic. The revisit trigger is a second organisation of that size publishing the
  same conclusion.


  COINBASE (2026-10-15, verified vs a 2026-09-30 LinkedIn post by the Coinbase engineer whose team
  runs the migration — a hiring post, not an engineering write-up): Coinbase is taking its consumer
  trading app fully native, off React Native to Swift and Kotlin, with the same core reason as
  Shopify — "AI coding agents have collapsed the cost of building a feature twice" — plus claimed
  faster startup, fewer crashes and day-one access to new platform capabilities. That meets the
  revisit trigger above in weak form. Re-checked, the default holds on the same three terms: the
  default is about LOGIC; this is a staffed native rewrite (the post is hiring native-mobile and
  mobile-QA engineers, Senior to Senior Staff), not a swap a normal team copies; and no web app is
  weighed. → Two consumer-scale apps now make agent-maintained duplication a trend rather than one
  outlier; the next revisit trigger is a published technical account (costs, parity machinery) from
  Coinbase or a third organisation.


  CROSS-REFERENCES: RB-E-AI-DEVTOOLS owns the agent-workflow half of the Shopify thread (Helix,
  headless agent-drivable business logic). The engineering-principles skill owns boundaries and
  dependency direction for the shared package.


  HISTORY:

  2026-10-15 REOPENED: react-native-web is maintained again (Expo-backed maintainers + React
  Foundation org, 2026-10-07) — option row, default, when-clauses and note rewritten; React Strict
  DOM flagged quiet (no npm release since 2026-01-09). Coinbase datapoint added to the Shopify thread.

  2026-10-15 REOPENED: Tamagui row notes 3.0 (React Strict DOM + Tailwind mode; breaking for v2), pointer to RB-E-STYLING.

  2026-09-24 CORRECTED: the Expo UI row said "SDK 56 beta"; SDK 56 made the native APIs stable
  and left only the web APIs experimental.

  2026-09-21 CHALLENGED → SURVIVES: Shopify's move off RN attacked the share-an-implementation
  premise with "share the spec, not the code" (agent-maintained duplicates); default holds,
  competitor named as a when-clause.
