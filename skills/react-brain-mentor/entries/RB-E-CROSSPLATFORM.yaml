id: RB-E-CROSSPLATFORM
topic: "Sharing code across React (web) & React Native"
category: cross-platform
group: app-architecture
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-CROSSPLATFORM.md
confidence: high
platforms: [react, react-native]
options:
  - { name: "shared logic/hooks package", tradeoff: "platform-agnostic core in a workspace package" }
  - { name: "platform-extension files (.web.tsx/.native.tsx)", tradeoff: "one API, per-platform impl" }
  - { name: "React Strict DOM (Meta)", tradeoff: "write strict HTML/CSS rendering web + native; Babel flattens to real DOM + static CSS on web; emerging RN-Web successor; involved setup" }
  - { name: "react-native-web", tradeoff: "MAINTENANCE MODE (2026) — maps RN primitives to HTML; still works, no major features coming" }
  - { name: "Tamagui", tradeoff: "cross-platform UI + optimizing compiler" }
  - { name: "Expo Universal Components / @expo/ui", tradeoff: "single API → SwiftUI (iOS) / Jetpack Compose (Android) / react-dom (web); SDK 56 beta" }
  - { name: "Solito", tradeoff: "shared routing across Expo + Next.js; v5 dropped the RN-Web core dep" }
  - { name: "Expo DOM Components (`use dom`)", tradeoff: "render real web components inside RN via a webview wrapper (since Expo SDK 52); good for incremental web reuse" }
recommend:
  default: "Share a platform-agnostic logic/hooks package first (the highest-leverage, lowest-risk win). For shared UI on NEW projects, evaluate React Strict DOM or Expo Universal Components — not a fresh react-native-web bet."
  when:
    - "duplicated business logic across web + native → extract a shared workspace package now"
    - "new universal UI → React Strict DOM or Expo Universal Components"
    - "existing react-native-web app → keep it (still works); just don't expand the bet"
    - "Expo + Next.js shared routing → Solito; incremental web reuse inside RN → Expo DOM Components"
note: >
  CHALLENGED 2026-09-21 — SURVIVES, WITH A NAMED COMPETITOR (this entry was the oldest reviewed
  entry in the corpus at updated: 2026-06-17, and the challenge arrived on its own: Shopify
  announced it is moving its mobile apps off React Native back to Swift and Kotlin). Take the
  argument seriously, because it attacks this entry's PREMISE rather than its picks. Shopify's
  stated reasoning, verified against the post: they adopted RN in 2020 to stop building features
  twice, let developers work across the stack, and stop chasing parity; all three delivered; but
  coding models got good enough that "building the same feature in Swift and Kotlin no longer
  carries the cost it used to", so the VALUE of sharing an implementation fell while the value of
  being close to platform capabilities and first-party tooling did not. Note what they explicitly do
  NOT claim — not that RN is slow ("React Native apps can be fast. Ours are"), and not that it was
  the wrong call ("React Native was the right choice for Shopify in 2020"). What they replace
  sharing WITH is the genuinely new option in this entry's design space: duplicate the
  implementation per platform, and hold parity through SHARED SPECIFICATIONS, TESTS AND REVIEW
  CHECKPOINTS that agents execute — agents implementing an Android feature using the iOS version as
  the reference. Call it "share the spec, not the code".
  WHY THE DEFAULT ABOVE STILL STANDS ANYWAY, on this entry's own terms: (1) the default's
  highest-leverage claim is about LOGIC, and Shopify's answer to logic parity is still a machine
  maintaining two copies — cheaper than it was, but not free, and they say so plainly ("Native still
  means building and maintaining software on two platforms, that cost has not disappeared"); (2)
  their migration is not a stack swap a normal team can copy — they chose greenfield rebuilds, built
  a bespoke checkpoint-gated system (Helix) to stop agent slop, and re-architected for headless
  agent-drivable business logic (RB-E-AI-DEVTOOLS carries that as a reading, and it is the most
  reusable part of the post); (3) this entry's scope is React web + React Native, where a shared
  logic package also serves the WEB app — a dimension absent from Shopify's decision entirely. So
  the honest calibration: if your organisation can staff and gate agent-maintained duplicate
  implementations, "share the spec" is now a real alternative to "share the code", and at
  Shopify's scale it won. For a team without that machinery, duplicating logic across platforms
  still costs what it always did, and the shared logic/hooks package remains the lowest-risk win.
  Recorded as a counter-datapoint, not a reversal — and revisit it if a second organisation of that
  size publishes the same conclusion.
  When logic or components are duplicated across a web app and a native app, that
  duplication is the prime target — extract a shared package. VERIFIED SHIFT (2026):
  react-native-web has entered MAINTENANCE-ONLY mode — creator Nicolas Gallagher and
  Zalando pivoted to React Strict DOM, and Software Mansion sees "no major features on
  the horizon". For NEW universal web+native work, evaluate React Strict DOM or Expo
  Universal Components rather than a fresh react-native-web bet; existing RN-Web apps
  keep working. Verified vs official RN sources, Callstack, and Gallagher's notes.
