reading:
  - title: "How Does KMP with SwiftUI Scale on iOS?"
    url: "https://andrei-calazans.com/posts/2026-09-14-how-kmp-with-swiftui-scales-on-ios/"
    by: "Andrei Calazans"
    what: "The best-measured statement of the ALTERNATIVE this entry's axis implies — share the logic layer, keep the UI native — taken to production scale on Kotlin Multiplatform: ~750 Kotlin and ~700 Swift files, all figures measured wall-clock on an M4 Pro with Xcode 26.5 / Kotlin 2.4.0 / Gradle 9.6.1 rather than estimated. Two structural facts are the transferable part. (1) iOS consumes the shared layer as ONE linked framework no matter how many Gradle modules it is split into, because every linked KMP framework embeds its own copy of the Kotlin/Native runtime, memory manager and GC — ship two and you get two uncoordinated collectors in one process, with Kotlin objects crossing a boundary neither manages, so the single umbrella framework is the SAFE shape and its link step is the price of that safety, not a tooling accident. 'Just split the framework' is therefore not a free lever. (2) The decision he rates highest is that Swift feature packages compile against Swift CONTRACTS (closure-struct protocols), not against the Kotlin framework — only a thin SharedBridge imports it — which is the same insulation principle this entry applies to platform-extension files. Useful whether or not you would pick KMP: it prices the seam that any share-the-logic architecture has to own."
  - title: "use dom — incrementally migrating web UI to native with React"
    url: "https://evanbacon.dev/blog/use-dom"
    by: "Evan Bacon (Expo)"
    what: "Deep-dive on Expo DOM Components and the `use dom` directive — run real web UI inside a native app and migrate to native views component-by-component; covers the Metro bundling, offline support, and honest WebView trade-offs. The primary source for the incremental-reuse path."
    claim: "You ship react-native-web — for the opposite direction, reusing web UI inside a native app, Expo DOM Components (`use dom`) are the incremental migration path, component by component."
    applies_when: { deps: ["react-native-web"] }
  - title: "AI-Assisted React Native Migration for TV: Lessons From Zattoo"
    url: "https://www.callstack.com/blog/ai-assisted-react-native-migration-for-tv-lessons-from-zattoo"
    by: "Callstack (Zattoo case study)"
    what: "TV/cross-platform RN case study: share until a platform gives a reason to split, telemetry-driven perf, team reorg, and a deflated, realistic account of AI's role. A concrete companion to this entry's share-by-layer thesis."
