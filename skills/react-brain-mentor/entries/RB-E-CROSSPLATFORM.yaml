detect_source:   # source-level signals owned by this entry (regex over repo source)
  - pattern: "Platform\\.OS\\s*===?"
    min_files: 10
    signal: "Platform.OS branching in 10+ files"
    hint: "widespread inline platform forking suggests sharing at the wrong layer — share logic/state/data, split divergent UI by platform-extension files (.ios/.android/.web) so each file stays single-platform (see RB-E-CROSSPLATFORM doc)"
tripwires:   # standing caveats as executable conditions — evaluated by `harvest firsthand`; fired ⇒ do the then:, update prose, remove the row
  - when: { pkg: "react-native-web", atleast: "0.22.0" }
    then: "react-native-web 0.22 shipped — the breaking modernization line: read its release notes and add a migrate note (React 19-only peers, ESM package, browser floor Chrome/Edge 95+ / Firefox 93+ / Safari 15.1+, removed CheckBox/Picker/ProgressBar/YellowBox/InteractionManager/Touchable mixin, babel-plugin-react-native-web deprecated); refresh the option row pin and the 'expect the breaking 0.22' when-clauses"
    added: 2026-10-15
  - when: { pkg: "react-strict-dom", atleast: "0.0.56" }
    then: "React Strict DOM published again after the 2026-01-09 → 2026-10 gap — read the release, note who is shipping it (Meta or Expo), and drop or soften the 'quiet / no npm release since 2026-01' caveat in the option row, default, when-clause and REACT-NATIVE-WEB note"
    added: 2026-10-15
