id: RB-E-OTA
topic: "Over-the-air (OTA) JS updates & release channels (React Native)"
category: ota-updates
group: tooling-ops
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-OTA.md
confidence: medium
platforms: [react-native]
options:
  - { name: "EAS Update (expo-updates client)", tradeoff: "The hosted default: channels, phased rollouts, republish-to-rollback. SDK 55 added bsdiff bytecode/bundle diffing (est. ~75% smaller update downloads; default in SDK 56). expo-updates 57.0.23 (2026-09-18; 58.0.8 on next for SDK 58 beta; verified vs npm)." }
  - { name: "expo-updates + custom server", tradeoff: "The Expo Updates protocol is open: self-host the server and keep the battle-tested client; more ops work than EAS. XPREM (next row) is the ready-made server." }
  - { name: "XPREM (ex expo-open-ota)", tradeoff: "Go implementation of the Expo Updates protocol: multi-app, progressive rollouts + instant rollback, A/B branch splitting, S3/GCS/Azure/R2 backends, no Expo account or token; open core, RBAC/SSO commercial. Renamed from expo-open-ota at v3. v3.2.4 (2026-09-23, verified vs GitHub releases). See note: XPREM." }
  - { name: "hot-updater", tradeoff: "Self-hosted open-source OTA (gronxb) positioned as the CodePush successor; younger than expo-updates. v1 STABLE: 1.0.0 (2026-10-11, verified vs the v1.0.0 release + npm; latest 1.0.7) — needs separate v1 infrastructure and a new native build; v0 continues as 0.36.x on the `v0` tag. See note: HOT-UPDATER V1." }
  - { name: "Codemagic Patch (@codemagic/react-native-patch)", tradeoff: "Self-hosted OTA from the CodePush lineage with a dashboard, CLI, Expo config plugin and a CI vendor behind it — its edge is operability, not protocol. Still early: SDK 0.5.0 and server v0.5.0 (2026-09-23, verified vs npm + GitHub releases); evaluate, do not standardize. See note: CODEMAGIC PATCH." }
  - { name: "code-push-server (standalone)", tradeoff: "Microsoft's open-sourced server, compatible with the legacy react-native-code-push client — a self-host stopgap for existing CodePush apps, not a bet for new ones." }
  - { name: "Delta (Zepto, OSS)", tradeoff: "Self-hosted BINARY DELTA patching at quick-commerce scale (bsdiff patches to your S3, Lambda + CloudFront picks the patch per device). Zepto's own receipts: 80% adoption in 24h, 15M update requests/day, P90 patch download 305ms. @zepto-labs/react-native-delta 1.0.0 (2026-07-01, verified vs npm). See note: DELTA." }
  - { name: "react-native-code-push (RETIRED service)", tradeoff: "App Center and the hosted CodePush service shut down 2025-03-31; the client npm is dormant at 9.0.1 (2024-12-19) and now DEPRECATED on npm — every version (117 of 117) carries 'Package no longer supported', first seen by the 2026-10-15 poll (registry modified 2026-10-12; verified vs npm). Not recommended: migrate." }
recommend:
  default: "On Expo/EAS → EAS Update via the expo-updates client (channels + phased rollouts + rollback; diffing makes updates dramatically smaller since SDK 55/56). Hard self-host requirement → hot-updater, or the open expo-updates protocol with your own server. Anything still pointed at the retired CodePush service is silently broken — migrate."
  when:
    - "Expo app → EAS Update (first-party; channels/rollouts/rollback built in)"
    - "self-hosted / no-vendor requirement → hot-updater, else XPREM when you want to keep the expo-updates client (its protocol behind your own bucket, with rollouts/rollback/A-B)"
    - "self-hosted AND you want a dashboard + CI integration rather than a protocol to operate → Codemagic Patch (0.x — evaluate with its local Docker Compose stack first)"
    - "huge fleet where full-bundle pushes cost real money (a 20MB Hermes bundle × 1M installs ≈ $1,700/push at CloudFront list) → EAS Update bsdiff diffing on Expo, else Delta (Zepto, self-hosted)"
    - "legacy CodePush app → code-push-server (standalone; keeps it alive while you migrate — the hosted service is gone)"
    - "the change touches native code → n/a: OTA cannot ship it; that's a store release (see RB-E-RN-VERSIONS)"
    - "RN embedded in a native app (brownfield) → EAS Update (Expo Updates works in isolated brownfield since SDK 55; see RB-E-BROWNFIELD)"
note: >
  OTA is the rollback story, not a convenience: republishing a known-good update is the fastest
  production mitigation React Native has, so run updates like releases — channels, staged percentage
  rollouts, a monitored bake period, abort vs republish-rollback as distinct mitigations. EAS Update
  is the default because those pieces are built in and its client now diffs bytecode. The hard
  boundary: store policy allows updating interpreted JS/assets within guidelines; native changes
  always require a store release.

  CODEPUSH IS GONE (verified vs the microsoft/react-native-code-push repo): Microsoft retired App
  Center AND the hosted CodePush service on 2025-03-31, archived the repo and open-sourced the
  standalone code-push-server as the escape hatch → anything still pointed at the service stops
  updating without crashing, i.e. it is silently broken. The npm package is now deprecated too
  (2026-10-15 poll, verified vs the registry): all 117 versions carry npm's "Package no longer
  supported. Contact Support at npmjs.com/support for more info." (the registry's
  `modified` stamp is 2026-10-12), so every install prints a deprecation warning and dependency
  scanners will flag it — the client is no longer merely dormant.

  EAS UPDATE DIFFING (verified vs the SDK 55 changelog): binary bsdiff patches for Hermes bytecode —
  the client applies diffs against previously installed bytecode instead of re-downloading whole
  bundles, an estimated ~75% download reduction; opt-in in SDK 55, default in SDK 56.

  HOT-UPDATER V1 (2026-09-24, verified vs the gronxb/hot-updater v1.0.0-rc.0 release): v1 moves to
  hybrid delivery — the server serves shared, cacheable Release Catalogs and the client decides which
  update to apply; in the project's own Cloudflare test, p95 update-check latency fell from 283.2 ms
  (v0) to 70.0 ms and cache hit rate rose from 0% to 96.9%. 1.0.0 SHIPPED 2026-10-11 (verified vs
  the v1.0.0 release and npm; 1.0.7 on 2026-10-15): the release reports a median check time of 301 ms
  (v0) → 50 ms on Cloudflare, and adds Insights (downloads, launches, crash recoveries, failed
  updates, release health with rollback suggestions), Remote Config, a plugin system (Insights,
  Remote Config and client API keys are plugins), a self-hostable Console, and agent-driven setup
  (`hot-updater doctor --fix`). 1.0.6 adds RN's Swift Package Manager mode and an artifact protocol
  v2 that signs only the files a device downloads. MIGRATION IS NOT A BUMP: v1 needs separate v1
  infrastructure and a new native build; keep the v0 endpoint running for binaries already in the
  field (v0 continues on the `v0` branch / npm tag, 0.36.19) and follow BREAKING_CHANGES.md → new
  self-hosted projects start on v1; existing v0 apps migrate on their next store release.

  XPREM (verified vs the mercuretechnologies/xprem repo and the expo-open-ota v3 post): the concrete
  server for the expo-updates + custom server row. Stateless (bucket-only) or PostgreSQL
  control-plane mode. Renamed from expo-open-ota at v3 — the old name is still all over the
  ecosystem, so search both.

  CODEMAGIC PATCH (2026-09-24, verified vs the codemagic-patch GitHub releases and npm): Codemagic
  ran a CodePush fork for ~18 months after Microsoft retired the service, then rebuilt it as a
  self-hosted OTA service — server + release worker, RN client SDK with an Expo config plugin, a
  `cmpatch` CLI, a web dashboard, and a one-command Docker Compose stack (Postgres + MinIO +
  dashboard) for local evaluation; positioned on CDN-first delivery, binary diffs and native
  fingerprinting. Server v0.3.0 (2026-09-07) added a CLI that installs, upgrades, backs up and
  restores a self-hosted server with guided Cloudflare/CloudFront/no-CDN setup, CloudFront as a
  delivery option, and structured failure detail on metric failures; breaking: an existing
  Cloudflare install with the old two-hour edge TTL rule must drop it to get the new cache policy.
  v0.4.0 (2026-09-14) extended the install wizard to external storage and DNS (R2, S3, GCS, CDN
  delivery verification) and added a localhost-only HTTP mode. v0.5.0 (2026-09-23) added GitLab
  sign-in and adoption charts and renamed SDK lifecycle events (`Ready`, `Applied`; SDK 0.4.x events
  are stored under the new names) → the upgrade runs a migration that rebuilds a `metric_event` index
  under an exclusive lock, so expect a longer upgrade on servers with a large metrics history. The
  SDK went 0.1.6 (first published 2026-07-29) → 0.5.0 in eight weeks: still an evaluation, not a
  standard.

  DELTA (2026-07-17, RN Rewind #49; repo verified; npm package verified 2026-09-24): Zepto
  open-sourced Delta as the self-hosted binary-delta answer to full-bundle economics — their
  motivation math: a one-character fix × 1M installs = ~20TB ≈ $1,700 at CloudFront. delta-cli
  computes bsdiff patches between releases to your S3; delta-server (Lambdas behind CloudFront)
  picks the patch per device from an appId/jsVersion/bundleVersion manifest; the device applies
  bspatch and swaps on next launch. Adoption numbers are Zepto's own production telemetry. The SDK
  is published as @zepto-labs/react-native-delta (1.0.0, 2026-07-01), which this entry's detect
  rows do not yet cover.

  CROSS-REFERENCES: RB-E-RN-VERSIONS owns store releases and the native-change boundary;
  RB-E-BROWNFIELD owns embedding constraints; RB-E-OBSERVABILITY owns the monitoring a bake period
  depends on (EAS Observe marks every OTA update).

  HISTORY:
  2026-10-15 REOPENED: hot-updater 1.0 stable (2026-10-11; separate v1 infra + new native build, v0 stays on 0.36.x); react-native-code-push now npm-DEPRECATED (all versions); TeamReach reading (rollback vs persistent state, delivery vs publish, launch-crash recovery window).
  2026-09-24 CORRECTED: Delta was described as "GitHub-install, not yet on npm" — it has been on npm
  as @zepto-labs/react-native-delta since 2026-07-01; hot-updater 0.35 → 0.36 and v1 RC recorded;
  Codemagic Patch 0.1.6 → 0.5.0.
  2026-09-10 REOPENED: Codemagic Patch server 0.3.0 (firsthand); SWSH E2E-gate-every-OTA-push reading.
  2026-07-17 GAP CLOSED: Delta lane (Zepto binary-delta patching).
  2026-07-09 GAP CLOSED: entry created — OTA delivery was a corpus gap surfaced by Native Weekly's
  2026 run (bundle diffing, runtime channel switching, iteration speed, issues 12–14).
