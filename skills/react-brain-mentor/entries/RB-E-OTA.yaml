watching:
  - title: "The OTA Illusion: What No One Tells You About Instant Updates At Scale (RUC 2025)"
    url: "https://www.youtube.com/watch?v=hBoAD6sYDYo"
    by: "Adam Mruk (Callstack) — React Universe Conf 2025"
    what: "The scale half of this entry's delta-patching lane: why 'instant' OTA is an illusion at fleet size — full-bundle economics, adoption curves, and delivery latency — the problem statement Zepto's Delta and EAS bsdiff diffing both answer. (Verified via YouTube oEmbed: title + author.)"
reading:
  - title: "Inside SWSH's automated mobile release pipeline with Expo"
    url: "https://expo.dev/blog/inside-swsh-automated-mobile-release-pipeline-with-expo"
    by: "Expo / SWSH"
    what: "Fills the gap this entry's staged-rollout guidance leaves open — how to validate the update ITSELF before it ships. SWSH gates every EAS Update behind Meridian, an in-house end-to-end framework built on Appium and WebDriverIO and driven by Vitest, running critical flows against the updated bundle on iOS/App Clip/Android simulators in CI. The reasoning generalizes even though Meridian does not: an OTA update drops new JS onto a native binary already on users' devices, and ordinary pre-merge CI never exercises that pairing, so nothing confirms compatibility before real users do. Context for the scale claim: one React Native codebase covering iOS, an iOS App Clip, Android and web, ~300 builds a month on the team's own hardware, native releases about weekly."
    claim: "You ship OTA updates — gate each push behind an E2E run against the UPDATED bundle on the native build it is landing on, not just pre-merge CI; new JS onto an already-shipped binary is a pairing nothing else tests."
    applies_when: { deps: ["expo-updates", "hot-updater"], platforms: [react-native], stages: [production, scale] }
  - title: "The production playbook for OTA updates"
    url: "https://expo.dev/blog/the-production-playbook-for-ota-updates"
    by: "Expo"
    what: "The operational canon for this entry: staged percentage rollouts as exposure control, what to monitor while an update bakes, and aborts vs republish-rollbacks as distinct mitigations — 'sometimes it helps to go a little slower.' Vendor-authored but the staged-rollout discipline is platform-agnostic. (Body verified via the page's embedded content JSON — the blog is a JS shell.)"
    claim: "You ship OTA updates — run them like releases: staged percentage rollouts, a monitored bake period, and know abort vs republish-rollback as distinct mitigations before you need one."
    applies_when: { deps: ["expo-updates", "hot-updater", "@hot-updater/*"], platforms: [react-native] }
  - title: "Relaunching TeamReach: how OTA updates saved a 5,000,000-user cutover"
    url: "https://expo.dev/blog/teamreach-ota-updates-relaunch"
    by: "Gene Cornfield (TeamReach), guest post on the Expo blog"
    what: "A production cutover where OTA was the plan, not the safety net: a 3-month Expo rewrite of two native apps cut over every user overnight, then shipped twelve OTA updates in three days (about $4,000 on MAU billing, where repeated updates to the same audience cost little more than one). Most breakage came from a decade of untyped legacy data (fields that were tinyint, then JSON, then HTML), fixed in the client. Three caveats this entry's rollback framing lacked: they FIXED FORWARD because rolling back is not safe once a bad update has written persistent state the older code cannot read; publishing is not delivering (expo-updates applies a fix on the launch that downloads it in time, otherwise on the next one, so a fix took ~24h to reach the fleet); and expo-updates' automatic recovery only catches a fatal JS error early in launch, before first render, falling back to the last working update. Vendor-hosted and business-authored, with the technical detail relayed from the lead developer."
    claim: "You rely on OTA rollback — it is unsafe once a bad update wrote persistent state older code cannot read, a fix reaches users only as they relaunch (~24h here), and expo-updates recovers only pre-first-render crashes; plan to fix forward."
    applies_when: { deps: ["expo-updates", "hot-updater", "@hot-updater/*"], platforms: [react-native], stages: [production, scale] }
  - title: "EAS Update introduction (docs)"
    url: "https://docs.expo.dev/eas-update/introduction/"
    by: "Expo"
    what: "The reference for the hosted-default choice: how updates map to channels, phased rollouts to a percentage of users, and rollback-by-republish ('much like a new commit'). Read before designing a release-channel scheme."
