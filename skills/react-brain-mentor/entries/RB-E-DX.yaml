id: RB-E-DX
topic: "Developer experience — CI, lint/format, hooks, monorepo, onboarding"
category: dx
group: tooling-ops
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-DX.md
confidence: high
platforms: [react, react-native]
options:
  - { name: "CI (GitHub Actions / similar)", tradeoff: "Gate tests + typecheck + lint + build on every PR — the single highest-leverage DX baseline, because an invariant that is not gated silently rots." }
  - { name: "lint/format — Biome or ESLint (flat) + Prettier", tradeoff: "Biome is one fast Rust tool for lint + format; ESLint flat + Prettier has the bigger plugin ecosystem and the only react-hooks rules. @biomejs/biome 2.5.14 (2026-09-16), eslint 10.11.0 (2026-09-18), prettier 3.9.9 (2026-09-23; all verified vs npm)." }
  - { name: "Oxlint + oxlint-tsgolint (type-aware)", tradeoff: "The third lint lane: type-aware linting is stable (59 of typescript-eslint's 61 type-aware rules) and 22 React Compiler-powered rules are native; it can also host ESLint plugins via jsPlugins. oxlint 1.85.0 (2026-09-21), oxlint-tsgolint 7.0.2002 (2026-09-18; both verified vs npm). See note: OXLINT." }
  - { name: "git hooks — husky + lint-staged / lefthook", tradeoff: "Run lint/format/tests pre-commit or pre-push so issues are caught before CI. husky 9.1.7 (2024-11-18), lint-staged 17.5.1 (2026-09-10), lefthook 2.1.14 (2026-09-14; all verified vs npm)." }
  - { name: "monorepo task runner — Turborepo / Nx + pnpm workspaces", tradeoff: "Cached, parallel task graph across packages; pnpm 11.11+ also versions and releases the workspace. turbo 2.11.3 (2026-09-22), nx 23.2.1 (2026-09-09), pnpm 12.6.0 (2026-09-22; all verified vs npm). See note: PNPM RELEASE MANAGEMENT; bundler/pnpm 12 depth in RB-E-BUILD." }
  - { name: "dependency hygiene — renovate/dependabot + audit", tradeoff: "Automated updates + npm/pnpm audit + install-script blocking; RB-E-SECURITY owns the supply-chain thread." }
  - { name: "react-doctor (Million)", tradeoff: "npx react-doctor: one-shot scan for React footguns (state/effects/perf/a11y/security), CI mode, installable as an agent skill; the lint layer for agent-written React (see RB-E-AI-DEVTOOLS). 0.9.14 (2026-09-12, verified vs npm); ~14.9k stars (2026-09-24, verified vs GitHub)." }
recommend:
  default: "Gate tests + typecheck + lint on every PR in CI, and enforce the same locally with a pre-commit hook. For lint/format, default to Biome (one fast tool) unless you need ESLint's react-hooks rules, in which case ESLint flat config + Prettier."
  when:
    - "has tests but no CI → CI (GitHub Actions or similar; add it FIRST — ungated invariants silently rot, a real finding in audited production apps)"
    - "needs ESLint react-hooks rules → ESLint flat config + Prettier (react-hooks is the remaining ESLint-only surface; React Compiler rules are native in Oxlint 1.79+ and in Biome 2.5.8+ nursery)"
    - "kept typescript-eslint ONLY for type-aware rules → Oxlint + oxlint-tsgolint (`oxlint --type-aware`, stable, 59/61 rules; ESLint plugins can run through Oxlint's jsPlugins)"
    - "no git hook yet → husky + lint-staged (run lint/format on staged files; lefthook covers the same job if already installed)"
    - "multi-package repo → pnpm workspaces + Turborepo (cached task graph; Nx if the repo already runs it; pnpm 11.11+ versions and releases the workspace, so no separate changesets tool)"
    - "normative styleguide but no linter config → lint config (encode the styleguide rules so they are enforced mechanically, not by review)"
    - "lots of agent-written React landing in the repo → react-doctor (a CI or agent-skill pass on top of lint)"
note: >
  DX is the feedback loop that keeps the other entries honest: CI gates, lint, hooks and onboarding
  turn review-time opinions into mechanical checks. The default holds because CI on every PR is the
  cheapest control that catches everything else, and a local hook moves the same check to before the
  push. The lint choice is decided by one question — do you need ESLint's react-hooks rules? — since
  type-aware rules and React Compiler rules are no longer ESLint-exclusive.

  OXLINT (2026-07-28 and 2026-08-18, verified vs the Oxc release posts; version re-checked 2026-09-24
  vs npm): tsgolint v7 made type-aware linting stable, tracking TypeScript 7.0.2 with 59 of
  typescript-eslint's 61 type-aware rules behind `oxlint --type-aware`, so type-aware rules alone are
  no longer a reason to keep typescript-eslint. Oxlint 1.79 (2026-08-18) ships 22 React
  Compiler-powered rules that use the compiler's own validation passes, with the recommended-preset
  rules mapped into Oxlint's correctness category (replacing the old nursery react/react-compiler
  rule); react-hooks proper remains ESLint-only. Oxlint 1.83 (2026-09-14, verified vs the Oxc
  release) updates its lint rules for React 19.3, the React line RB-E-REACT-CORE recommends. The same
  2026-08-18 announcement: `oxc-transform-react` applies React Compiler's automatic memoization ~10×
  faster than the Babel plugin in Oxc's preliminary benchmark, wired into @vitejs/plugin-react 6.1.0
  (RB-E-REACT-CORE owns the compiler default).

  BIOME useReactCompiler (2026-08-13, verified vs the Biome rule docs): 2.5.8 adds `useReactCompiler`,
  which runs React Compiler in lint mode and surfaces its actionable diagnostics (e.g. a hook called
  inside a conditional). It only runs when the nearest package.json declares React ≥19, and it sits in
  the nursery group at `information` severity — off by default, opt in per rule. It narrows the
  React-rules gap without closing it: read it as Biome's direction, not parity.

  COHORT SIGNAL: SENTRY RUNS OXLINT, NOT ESLINT (2026-09-10 and 2026-09-24, `react-brain census`
  deltas, verified vs getsentry/sentry package.json + oxlint.config.ts): getsentry/sentry's lint:js
  is just `oxlint` (Oxlint 1.83.0), with no typescript-eslint and no ESLint config file at the repo
  root — the first cohort app on record to stop running ESLint rather than run both. The eslint
  package (10.8.0) is back in its devDependencies because oxlint.config.ts loads a dozen-plus ESLint
  plugins (unicorn, import, react, @tanstack/query, boundaries, jest-dom, regexp,
  react-you-might-not-need-an-effect, e18e) through Oxlint's jsPlugins. Consequence: leaving ESLint
  the LINTER does not mean leaving the ESLint PLUGIN ecosystem — check whether the plugins you depend
  on run under Oxlint's JS-plugin host before treating a missing native rule as a blocker. It does not
  overturn the react-hooks condition (a repo can accept not having those rules), but it is the
  strongest datapoint that the type-aware + compiler-rule surface suffices for a large TypeScript
  codebase.

  PNPM RELEASE MANAGEMENT (2026-07-28, verified vs the pnpm 11.11-11.14 post; pnpm 12 keeps pnpm 11's
  commands and settings per the 12.0 post, RB-E-BUILD owns pnpm 12): `pnpm change` records
  changesets-compatible `.changeset/*.md` intents; a bare `pnpm version -r` consumes them across the
  workspace with dependent propagation through `workspace:` ranges and a committed
  `.changeset/ledger.yaml` that keeps cherry-picks and merge-backs safe; `pnpm lane` runs per-package
  prerelease lanes. Config lives under a `versioning` key in pnpm-workspace.yaml; changelogs default to
  REGISTRY storage (composed at publish time, no committed CHANGELOG.md) unless you set
  `versioning.changelog.storage: repository`. The same releases add `pnpm doctor` (installation and
  environment diagnosis with non-zero exit, --json, --offline) and fix a path-traversal vulnerability.
  For a pnpm monorepo this removes a dependency (changesets) rather than adding one.

  CROSS-REFERENCES: engineering-principles owns architecture/boundaries depth; RB-E-BUILD owns bundler
  choice and pnpm 12; RB-E-SECURITY owns supply chain; RB-E-AI-DEVTOOLS owns the agent-written-code
  review layer.

  HISTORY:
  2026-09-24 CORRECTED: "Sentry has NO eslint" read as "no ESLint run" — eslint is back as a
  devDependency to host plugins under Oxlint's jsPlugins; Oxlint pin moved 1.83 → 1.85.0.
  2026-09-21 REOPENED: Oxlint 1.83 updates its rules for React 19.3.
  2026-09-10 REOPENED: census delta — Sentry moved its lint lane to Oxlint.
  2026-08-18 WEAKENED: react-compiler linting no longer ESLint-exclusive (Oxlint 1.79).
  2026-08-13 REOPENED: Biome 2.5.8 useReactCompiler (nursery).
  2026-07-28 WEAKENED: type-aware rules no longer a reason to keep typescript-eslint (tsgolint v7).
  2026-07-28 GAP CLOSED: pnpm 11.11+ workspace versioning fires the twir-290 reopen signal.
