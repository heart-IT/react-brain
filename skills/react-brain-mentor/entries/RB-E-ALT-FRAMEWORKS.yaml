id: RB-E-ALT-FRAMEWORKS
topic: "Alternatives to React Native (cross-platform frameworks)"
category: alt-frameworks
group: platform-native
status: reviewed   # long-form entry written + source-checked
confidence: low
platforms: [react, react-native]
options:
  - { name: "Lynx (ByteDance)", tradeoff: "web-tech (HTML/CSS) + native render; dual-thread UI/logic; young ecosystem (open-sourced 2025) but moving fast — 4.0.0 released 2026-07-20 (verified vs the GitHub release); scaffold via create-rspeedy" }
  - { name: "Valdi (Snap)", tradeoff: "declarative TypeScript compiling to native views on iOS/Android/macOS; beta (beta-0.1.0), open-sourced by Snap Nov 2025 after ~8 yrs internal use" }
  - { name: "Flutter", tradeoff: "Dart; own render engine; large ecosystem; not React/JS" }
  - { name: "Kotlin Multiplatform", tradeoff: "share business logic across platforms; native UI per platform; SWM's same-app benchmark: KMP ~8x smaller + 2-4x faster startup on ANDROID, but iOS converges (RN uses 3-4x LESS memory there — UIKit rendering vs KMP's resident Skia)" }
recommend:
  default: "Stay on React Native unless a specific driver pushes you off it — its decade of libraries is a major advantage; Lynx and Valdi are early."
  when:
    - "share only business logic, keep native UI → Kotlin Multiplatform"
    - "team already invested in Dart / wants one render engine → Flutter (leaves React entirely)"
note: "Context for teams weighing leaving the React/RN ecosystem. Newer entrants (Lynx, Valdi) are early — not endorsements. The KMP-vs-RN numbers come from Software Mansion's controlled same-app benchmark (see reading) — notable because an RN shop published results that favor KMP on Android."
defer_to_skill: null
doc: "RB-E-ALT-FRAMEWORKS.md"   # long-form Explanation entry in content_dir
updated: 2026-07-28   # Shopify React→Preact under a 64KB budget; Lynx 4.0.0
sources:
  - "https://github.com/lynx-family/lynx"
  - "https://github.com/Snapchat/Valdi"
reading:
  - title: "We Built the Same App in KMP and React Native — Here's What We Found"
    url: "https://swmansion.com/blog/we-built-the-same-app-in-kmp-and-react-native-here-s-what-we-found"
    by: "Artur Gęsiarz, Karol Kąkol, Weronika Grzybowska (Software Mansion)"
    what: "The controlled comparison this entry needed: identical unoptimized apps on 6 devices measuring size/startup/RAM/CPU/frames. KMP wins Android decisively (8x smaller, 2-4x startup, ~50% less RAM — no JS runtime); iOS converges, with RN using 3-4x LESS memory (UIKit rendering vs KMP's resident Skia). Credible precisely because an RN consultancy published the unflattering Android numbers; ends on the right frame — performance is one input, DX and ecosystem are others."
  - title: "Under the hood of MDN's new frontend"
    url: "https://developer.mozilla.org/en-US/blog/mdn-front-end-deep-dive/"
    by: "Leo McArdle (Mozilla / MDN)"
    what: "Architecture case study replacing a React SPA with server-side templating + Lit web components (per-component CSS, Declarative Shadow DOM, Rspack). An authoritative counter-perspective on when NOT to ship a React SPA."
  - title: "From React to native web with nanotags: a migration that saved 100 KB"
    url: "https://evilmartians.com/chronicles/from-react-to-native-web-with-nanotags-a-migration-that-saved-100kb"
    by: "Evil Martians"
    what: "When a marketing/content site doesn't need React — migrating to Web Components (Custom Elements + Astro + nanostores, ~3KB vs ~63KB), with the boilerplate/accessibility trade-offs nanotags addresses. Durable do-you-even-need-React reasoning."
  - title: "Upgrading Checkout Blocks app to Polaris web components"
    url: "https://shopify.engineering/upgrading-checkout-blocks-app-to-polaris-web-components"
    by: "Engineering at Shopify"
    what: "The PREACT data point the other do-you-need-React readings lack, and the rare case where a hard number forces the decision: Shopify's Checkout Blocks extensions (rendered on a third of all customized checkouts) had to fit a 64KB gzip per-bundle limit enforced by the 2026-01 remote-dom CLI, and were at 300–356KB raw / ~100–112KB gzipped. Dropping react-reconciler by moving React→Preact was the single biggest win at ~89KB and got them most of the way to budget; replacing liquidjs (~73KB) with an in-house parser and dayjs with a scoped date utility closed the rest, while markdown-to-jsx was kept by aliasing onto @preact/compat. Transferred bundle sizes fell 40–85% across the five extensions. Also a credible AI-assisted-migration pattern: an in-house agent skill did the mechanical React→Preact and component swaps against a parity test suite built from thousands of real merchant configurations, with engineers on the judgment calls."
    claim: "You ship React inside a byte-budgeted embed (checkout widget, third-party extension) — react-reconciler alone is ~89KB, so swapping to Preact via @preact/compat is usually the largest single cut available."
    applies_when: { platforms: [react] }
  - title: "How We Rewrote 130K Lines from React to Svelte in Two Weeks"
    url: "https://strawberrybrowser.com/blog/react-to-svelte"
    by: "Strawberry Browser (Dendrite Systems)"
    what: "A migration case study contrasting React's virtual-DOM overhead with Svelte's compiled reactivity for an AI-driven browser UI, including the LLM-migration ruleset that kept the Svelte idiomatic. A concrete framework-tradeoff data point for teams weighing leaving React."
