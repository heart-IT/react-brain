id: RB-E-ALT-FRAMEWORKS
topic: "Alternatives to React Native (cross-platform frameworks)"
category: alt-frameworks
group: platform-native
status: reviewed   # long-form entry written + source-checked
confidence: low
platforms: [react, react-native]
options:
  - { name: "Lynx (ByteDance)", tradeoff: "Web tech (HTML/CSS) + native render with dual-thread UI/logic; young ecosystem (open-sourced 2025) but moving fast; scaffold via create-rspeedy. Not a pick while its React layer is 0.x: engine 4.0.3 (2026-09-11) but the React layer is @lynx-js/react 0.126.x and rspeedy 0.18.0 (2026-09-24, verified vs npm); see note: LYNX VERSION LINES, LYNX 4.0." }
  - { name: "Valdi (Snap)", tradeoff: "Declarative TypeScript compiling to native views on iOS/Android/macOS, open-sourced by Snap Nov 2025 after ~8 yrs internal use. Not a pick while in beta: beta-0.2.0 (2026-09-22, 'pre-release for testing', notes not yet published; verified vs the releases page)." }
  - { name: "Flutter", tradeoff: "Dart; own render engine; large ecosystem; not React/JS." }
  - { name: "Kotlin Multiplatform", tradeoff: "Share business logic across platforms, native UI per platform. SWM's same-app benchmark: KMP ~8x smaller + 2-4x faster startup on ANDROID, but iOS converges (RN uses 3-4x LESS memory there — UIKit rendering vs KMP's resident Skia). See note: KMP BENCHMARK." }
recommend:
  default: "Stay on React Native (mobile) and React (web) unless a specific driver pushes you off: RN's decade of libraries is the advantage no alternative matches yet. Lynx and Valdi are early, landscape rather than picks. The driver that changes the pick is what you need to share: only business logic → KMP; one render engine outside JS → Flutter."
  when:
    - "share only business logic, keep native UI → Kotlin Multiplatform (Android size/startup wins, iOS converges)"
    - "team already invested in Dart / wants one render engine → Flutter (leaves React entirely)"
    - "byte-budgeted React embed on the web (checkout widget, third-party extension) → Preact (@preact/compat; react-reconciler alone is ~89KB — see the Shopify reading)"
note: >
  THE PICTURE: this is context for teams weighing a move off the React/RN ecosystem. RN's library
  depth is the argument for staying; each alternative wins on one axis (KMP on Android size and
  startup, Flutter on a single render engine, Lynx on web-tech authoring) and none yet matches the
  ecosystem. Newer entrants (Lynx, Valdi) are early, not endorsements.

  LYNX VERSION LINES (2026-09-24, verified vs npm and the GitHub releases): the ENGINE is 4.x
  (4.0.0 released 2026-07-20, 4.0.3 on 2026-09-11) while ReactLynx, the React binding you write
  against, is @lynx-js/react 0.126.x and @lynx-js/rspeedy / create-rspeedy 0.18.0 (2026-09-24) →
  "Lynx 4" does not mean the React layer is 1.0; that 0.x layer is why Lynx is a landscape row.

  LYNX 4.0 (2026-09-11 post, verified 2026-09-21 vs lynxjs.org/blog/lynx-4-0): the 4.0 tag landed
  seven weeks before the post describing it → read the blog, not the tags, for capabilities. 4.0
  bets on AI two ways. (1) Agents WRITING Lynx: coding agents fall back on Web conventions Lynx
  does not support, so Lynx publishes a project-local API reference (@lynx-js/lynx-api-docs) as a
  `lynx-api-docs` agent skill consulted before writing; RB-E-AI-DEVTOOLS records the same
  diagnosis for React Native. (2) Agents GENERATING UI at runtime: Lynx A2UI has the model emit
  structured protocol messages constrained by the app's own component catalog, rendered as native
  UI and updated progressively as messages stream; RB-E-AI-UI owns the React-side generative-UI
  contrast. Beyond AI: foldable support (the host passes window size changes so pages adapt with
  Flex and relative units), expanded desktop CSS/Element capabilities, <webview> and <blur-view>
  open-sourced, global memory queries, and production error/UI-node traces mapped back to source.
  None of it changes the default.

  KMP BENCHMARK: the KMP-vs-RN numbers come from Software Mansion's controlled same-app benchmark
  (see reading), notable because an RN shop published results that favor KMP on Android.

  DACTYL (2026-09-10, verified: dactyl.dev reachable): an AI app-builder (from Deno) that
  generates genuine native SwiftUI from a prompt and previews it live through a
  SwiftUI-in-WebAssembly renderer in the browser, with no Mac, Xcode or React Native in the loop.
  No versioned SDK and no npm package → not adoptable into an existing codebase and not an option
  row; it competes at the "skip React Native entirely" layer. Promote it only if a
  developer-facing SDK appears.

  HISTORY:
  2026-09-24 REOPENED: Valdi tag refreshed to beta-0.2.0 (notes pending); rspeedy 0.17.2 → 0.18.0.
  2026-09-21 REOPENED: the 2026-09-10 skip of Lynx 4.0.2 (empty GitHub release body) converted by
  the Lynx 4.0 announcement post (AI-first release, foldables; engine 4.x vs ReactLynx 0.126.x
  split recorded).
  2026-09-10 GAP CLOSED: Dactyl lead adopted from harvest/2026-08-27.
