id: RB-E-P2P
topic: "Peer-to-peer / local-first backend (Holepunch · Pear)"
category: p2p
group: app-architecture
status: reviewed   # long-form entry written + source-checked
confidence: medium
platforms: [react, react-native]
options:
  - { name: "Hypercore", tradeoff: "signed append-only log; the primitive everything builds on" }
  - { name: "Autobase", tradeoff: "multiwriter — linearize many writers' Hypercores into one shared view (collaboration)" }
  - { name: "Hyperbee", tradeoff: "ordered key-value / B-tree over a Hypercore; the queryable index/view layer" }
  - { name: "Corestore", tradeoff: "manages many Hypercores (naming, lifecycle)" }
  - { name: "Hyperswarm / HyperDHT", tradeoff: "peer discovery + encrypted connections over a DHT — no servers" }
  - { name: "Hyperdrive / Hyperblobs", tradeoff: "P2P filesystem / blob store" }
  - { name: "hrpc + Hyperschema", tradeoff: "typed RPC + binary schema between the app (UI thread) and a local Bare worker" }
  - { name: "Pear / Bare", tradeoff: "Pear = the P2P runtime + content-addressed distribution (desktop & mobile); Bare = the lightweight JS runtime for mobile workers (bare-kit)" }
recommend:
  default: "Holepunch (Hypercore logs held by Corestore, merged by Autobase, indexed in Hyperbee, synced over Hyperswarm, UI-to-worker calls over hrpc, shipped by Pear) — Pear desktop on react, Pear mobile via bare-kit on react-native — when serverless, offline-first, private or censorship-resistant is a requirement. When you want central control, SQL and a familiar ops story, the pick is conventional client-server (RB-E-DATA + a hosted DB) instead."
  when:
    - "offline-first / local-first / no-backend-ops / private / P2P → Holepunch (Hypercore + Autobase + Hyperbee + Hyperswarm)"
    - "multi-writer shared/collaborative state → Autobase over per-writer Hypercores"
    - "files or large binary blobs shared peer-to-peer → Hyperdrive / Hyperblobs (P2P filesystem / blob store)"
    - "app UI talking to a local Bare worker (bare-kit on react-native, Pear on desktop) → hrpc + Hyperschema (typed RPC + binary schema)"
    - "conventional CRUD with a central server/team → REST/GraphQL + TanStack Query (RB-E-DATA), not this"
    - "ANY Holepunch depth (replication, identity, schema, sessions, blind-pairing, Pear/Bare workflow) → holepunch-p2p-systems skill"
note: >
  Holepunch is an architecture fork, not a library slot: remove the server and its roles are
  reassigned rather than deleted. Data is a local signed append-only log (Hypercore); Corestore
  manages many of them; Autobase linearizes many writers' logs into one shared view; Hyperbee
  indexes it for queries; Hyperswarm/HyperDHT discovers peers and encrypts connections with no
  servers; Pear distributes the app content-addressed. Once chosen, a conventional data-cache
  (TanStack Query), hosted DB, REST API and central server are N/A by design; the data layer is
  queried locally via hrpc, and testing (brittle) and build (esbuild/bare-pack) follow the
  Holepunch ecosystem rather than the mainstream-React defaults. A Holepunch stack is therefore
  aligned, not a deviation.


  HEARTIT BACKBONE: ledgerhr (Pear desktop), ourpot and bitbarter (Pear mobile via bare-kit) all
  run on Holepunch → doctor reads their data, test and build layers against this entry, not
  against the client-server defaults.


  DEPTH: correctness, replication, identity, schema, sessions, blind-pairing and the Pear/Bare
  workflow are owned by the holepunch-p2p-systems skill; this entry owns only the fork.


  CROSS-REFERENCES: RB-E-DATA owns the conventional side of the fork (REST/GraphQL + TanStack
  Query + a hosted DB). RB-E-TESTING owns the brittle lane; RB-E-BUILD owns the
  esbuild/bare-pack lane.


  HISTORY:
  2026-06-25 GAP CLOSED: entry added after the evidence-loop self-audit found all three heartit
  apps on Holepunch with no entry to map them to.
defer_to_skill: holepunch-p2p-systems
