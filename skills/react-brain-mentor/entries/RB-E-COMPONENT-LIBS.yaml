id: RB-E-COMPONENT-LIBS
topic: "Component & headless-UI libraries (web)"
category: component-libs
group: ui
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-COMPONENT-LIBS.md
confidence: medium
platforms: [react]
options:
  - { name: "Base UI (1.x)", tradeoff: "unstyled accessible primitives (Radix/MUI lineage); render-prop customization" }
  - { name: "React Aria Components (1.x, Adobe)", tradeoff: "accessibility-first headless primitives; `render` prop pattern (not asChild)" }
  - { name: "Radix UI", tradeoff: "unstyled primitives; `asChild` composition; widely used under shadcn" }
  - { name: "shadcn/ui", tradeoff: "copy-paste components (own the code) + Tailwind; CLI + registries; Base UI is the DEFAULT headless layer since July 2026 (4.13) — Radix stays supported, and React Aria joined as a THIRD first-class base later that month (`init --base aria`; per-base scoped registries, all 8 style variants); 2026-06 added chat components + the first headless @shadcn/react package; 2026-08 GitHub registries now install from PRIVATE repos too (via gh CLI credentials or GH_TOKEN in CI — internal design systems as registries, zero config); 2026-09 every registry component imports `cn` from the standalone `cn` package instead of a local lib/utils.ts, replacing the copied clsx+tailwind-merge helper every project used to hand-maintain — same call site, one dependency, and `shadcn add` installs it for projects created before the change (lib/utils.ts survives, re-exporting it)" }
  - { name: "MUI (9) / Chakra (3) / Mantine (9) / Ant Design (6)", tradeoff: "batteries-included styled systems; MUI v9 is incrementally adopting Base UI primitives for new components (NumberField, MenuBar), not a full migration" }
  - { name: "HeroUI (3)", tradeoff: "React Aria + Tailwind; separate web + RN libraries sharing design tokens (not one cross-platform abstraction)" }
  - { name: "Astryx (Meta)", tradeoff: "Meta's open-source design system on React + StyleX: 150+ accessible, themeable components, compile-time atomic styling, agent-ready scaffolding (CLI + MCP); grown 8 yrs internally, 13,000+ Meta apps; batteries-included; beta — 0.6.0 (2026-09-10, verified vs the release post) adds RESPONSIVE THEME RULES, a Selector that adapts which surface it presents, a reworked Neutral palette and six templates, and the team describes a specification-backed path toward v1. Useful calibration: still 0.6.x with a documented CLI upgrade step between minors, so treat version churn as the cost of adopting it early" }
recommend:
  default: "Own-the-code: shadcn/ui (Base UI default since 2026-07; Radix still supported) + Tailwind — the default for product teams that want control."
  when:
    - "max accessibility / headless primitives → React Aria Components or Base UI"
    - "want batteries-included + don't want to own styling → MUI / Mantine / Chakra"
    - "internal admin/enterprise → Ant Design or MUI"
    - "Meta/StyleX-native, agent-ready design system → Astryx (beta at 0.6.x — vet component coverage before betting on it)"
    - "agents keep violating your design system (ad-hoc padding, off-theme colors, invented variants) → @shadcn/lint, an agent-first linter for Tailwind v4 design systems; shadcn/ui is NOT required and it runs on ESLint or Oxlint, so it drops into an existing lint lane (see note)"
    - "React Native UI → this entry is web-only; see RB-E-STYLING / RB-E-CROSSPLATFORM"
note: >
  ENFORCEMENT ARRIVED AS A SEPARATE TOOL (2026-09-21, verified vs the repo + README): @shadcn/lint
  is an "agent-first linter for Tailwind design systems" from the shadcn org — 2,240 stars, created
  2026-09-02 and pushed as recently as 2026-09-20, so it is three weeks old and busy. The premise is
  worth recording even for teams that never adopt it, because it names a failure this corpus has
  otherwise only described in prose: a coding agent will cheerfully add padding to a Button that
  owns its own padding, invent a variant, or reach past the theme, and TypeScript cannot catch any
  of it. You declare what is allowed in terms of your own components, variants and theme, and a
  violation produces an error that explains the rule and suggests a fix from what your design system
  actually offers — i.e. the diagnostic is written for a machine to act on, not just for a human to
  read. Two facts that decide whether it is reachable for you: it targets TAILWIND V4 projects and
  does NOT require shadcn/ui, and it ships for BOTH ESLint and Oxlint, which means it lands in the
  existing lint lane RB-E-DX already reasons about rather than adding a fourth. Young enough that it
  belongs in a when-clause and not a default; the honest risk is a three-week-old rule set, not the
  idea.
  Split three ways: headless/unstyled (Base UI, React Aria, Radix) vs batteries-included (MUI/Chakra/Mantine/Ant, plus Meta's StyleX-based Astryx) vs own-the-code (shadcn). Web only. HEADLESS-LAYER SHIFT (verified vs the shadcn changelog, 2026-07-10): 'Base UI is the default component library in shadcn/ui' — Radix explicitly NOT deprecated (both supported), but the center of gravity for new shadcn work is now Base UI; MUI v9 is incrementally adopting the same primitives. UPDATE (verified vs the shadcn changelog, 2026-07-20): React Aria is now the THIRD first-class shadcn base (`shadcn init --base aria`) — all three headless layers install through the same tooling with per-base scoped registries, so a project standardizes on one without cross-contamination; Base UI remains the default. Astryx (beta, 2026) pairs compile-time StyleX styling with agent-ready scaffolding (CLI + MCP) — Meta open-sourced its 8-yr internal system (13,000+ apps); see RB-E-STYLING for StyleX.
