id: RB-E-AUTH
topic: "Authentication & identity — sessions, OAuth, managed vs self-hosted"
category: auth
group: app-architecture
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-AUTH.md
confidence: low
platforms: [react, react-native]
options:
  - { name: "Better Auth", tradeoff: "TS-first, framework-agnostic, self-hosted (your DB owns the users); 2FA/passkeys/organizations via plugins; very active. 1.7.0 (2026-08-18) makes database joins stable under advanced.database.joins — a config rename if you had opted in; SECURITY FLOOR 1.7.16 (2026-11-03: twelve advisories incl. a CRITICAL @better-auth/expo authorization-proxy flaw and a high @better-auth/electron secret leak + 2FA skip; upgrade every @better-auth/* package together) — latest 1.7.28 (2026-11, verified vs npm). See note: NOVEMBER SECURITY RELEASE, MAGIC LINK CVE, STEWARDSHIP" }
  - { name: "Auth.js / NextAuth (maintenance)", tradeoff: "the long-time Next.js default, now under Better Auth's stewardship: security + bug fixes continue, the stated path transitions users to Better Auth; not formally deprecated. @auth/core 0.41.3 and next-auth 4.24.15, both 2026-07-20 (verified vs npm)" }
  - { name: "Clerk", tradeoff: "managed auth SaaS with prebuilt React components (sign-in, orgs, MFA) + a first-class Expo SDK, @clerk/expo 4.6.9 (2026-09-23, verified vs npm; the older @clerk/clerk-expo is deprecated); fastest to ship; per-MAU pricing + vendor dependency" }
  - { name: "Auth0 (react-native-auth0)", tradeoff: "the enterprise IdP — SSO/SAML/federation; RN SDK active: 6.0.0 stable (2026-10-28; latest 6.2.1, verified vs the release notes + npm) requires the New Architecture (RN ≥0.82, React ≥19), adds RN 0.88, moves to Auth0.Android v4 / Auth0.swift v3, makes DPoP opt-in (useDPoP defaults to false) and REMOVES the client-side Management API and legacy MFA methods deprecated in 5.11; see note: AUTH0" }
  - { name: "backend-bundled — Supabase Auth / Firebase Auth", tradeoff: "already included with the backend (@react-native-firebase/auth on RN, 27.1.1, 2026-11-10, verified vs npm); use it rather than bolting on a second identity system. v26+ requires the New Architecture; v27 (2026-10-19) makes iOS Swift-Package-Manager-only; see note: REACT NATIVE FIREBASE v26" }
  - { name: "expo-auth-session (DIY)", tradeoff: "Expo's browser-based OAuth/OIDC primitive — the hand-rolled lane on RN; you own token/session handling (Keychain via RB-E-STORAGE) and the correctness burden (see reading: The Copenhagen Book)" }
recommend:
  default: "Better Auth for self-hosted TypeScript auth, where your database owns the users; Clerk for managed auth with prebuilt UI and orgs/MFA out of the box (web SDK, @clerk/expo on React Native). One condition overrides both: if the backend already bundles auth (Supabase / Firebase), use that instead of adding a second identity system."
  when:
    - "running Better Auth → every better-auth / @better-auth/* package to ≥1.7.16 together NOW (2026-11-03: GHSA-4wq4-2ppv-q3hg CRITICAL — the @better-auth/expo authorization proxy can sign values it did not issue; high: Electron sign-in can return the server secret and skip 2FA; supersedes the ≥1.7.7 Magic Link floor); see note: NOVEMBER SECURITY RELEASE"
    - "new self-hosted / own-database auth → Better Auth (TS-first, framework-agnostic; 2FA/passkeys/orgs via plugins)"
    - "already on NextAuth / Auth.js → Auth.js (keep it on maintenance; plan the migration to Better Auth rather than deepening the investment)"
    - "managed service / fastest ship / prebuilt sign-in UI → Clerk (per-MAU pricing; @clerk/expo on RN)"
    - "enterprise SSO / SAML / an existing IdP → Auth0 (react-native-auth0 on RN)"
    - "backend is Supabase or Firebase → Supabase Auth / Firebase Auth (the backend's bundled auth)"
    - "on react-native-firebase < 26 → React Native Firebase v26 once the app is on the New Architecture (firebase.auth() becomes getAuth(app)); without New Arch, stay on v25 deliberately; → v27 when the iOS build can take Swift Package Manager (v27 drops the CocoaPods Firebase matrix)"
    - "on react-native-auth0 < 6 → v6 once on the New Architecture (RN ≥0.82): move Management API calls server-side and replace legacy MFA methods first (MIGRATION_GUIDE.md); if you relied on DPoP, set useDPoP: true explicitly"
    - "hand-rolling OAuth/sessions (expo-auth-session or custom) → expo-auth-session on RN (read the Copenhagen Book first; session tokens live in Keychain/Keystore via RB-E-STORAGE, never AsyncStorage — RB-E-SECURITY)"
    - "P2P / Holepunch app → n/a (no auth server: identity is keypair-based; RB-E-P2P owns it)"
    - "agent-facing product (AI agents authenticating to your app) → Agent Auth Protocol (Better Auth × Vercel; early — track it, do not build on it yet)"
note: >
  Auth is decided by who owns the user row: your database (self-hosted, Better Auth), a vendor
  (managed, Clerk), or the backend you already run (Supabase / Firebase). Feature lists converge;
  ownership does not, and it is expensive to reverse. A second identity system beside a
  backend's bundled one means two sources of truth about the same person. If you hand-roll
  sessions, the correctness of the session mechanics matters more than the library. Confidence
  is low because this entry's judgment is young, not because the options are immature.


  NOVEMBER SECURITY RELEASE (2026-11-03, verified vs better-auth.com/blog/security-release-2026-11-03
  and its GHSAs + npm): twelve advisories fixed in 1.7.16 / 1.8.0-beta.5, with the separately
  published plugins (@better-auth/expo, /electron, /passkey, /stripe, /kysely-adapter) on the same
  versions — upgrade every Better Auth package together. CRITICAL: the @better-auth/expo authorization
  proxy can sign values it did not issue (GHSA-4wq4-2ppv-q3hg). HIGH: phone numbers can be claimed
  before they are verified; @better-auth/electron sign-in can return the server's auth secret and
  social-provider client secrets and skip two-factor when electron() precedes twoFactor()
  (GHSA-9p5w-h4pr-fcrc). MEDIUM: revoked sessions stay valid with secondary storage or the cookie cache,
  OAuth treats an unverified provider email as verified, email-change links survive re-assignment, OTP
  attempt limits can be raced, MySQL serial IDs can return another request's record, @better-auth/stripe
  cross-customer billing actions, org/admin role bypasses. LOW: passkey verification does not enforce
  origin or user verification. → The floor is now 1.7.16 (latest 1.7.28); the Magic Link ≥1.7.7 floor
  below is superseded. Better Auth publishes on patch lines, so a "patch bump" can be the security
  release — read its release notes, not the version number.

  MAGIC LINK CVE (2026-09-30, verified vs the GitHub security advisory + the v1.7.7 release notes):
  GHSA-965c-763c-88jm, CVSS 9.1 CRITICAL, affects 1.4.0-beta.18 through 1.7.6 when ALL THREE hold:
  the Magic Link plugin is enabled with default token storage, at least one OAuth provider is
  configured, and state storage is database-backed. An attacker starts an OAuth sign-in flow for
  ANY target email, then repurposes the returned state value to complete Magic Link auth — no access
  to the victim's inbox, no completed OAuth callback, no user interaction, full session with the
  account's permissions. A second bug in the same release let OAuth Proxy accept a sign-in STATE
  value as a provider profile. Fix: upgrade to 1.7.7. This is not a drop-in version bump: upgrade
  every server sharing verification storage together, request fresh Magic Links (existing ones from
  before the patch are invalid), restart pending OAuth/SAML sign-ins, and update any CUSTOM
  identifier hasher to preserve purpose prefixes; no DB migration is required. Until upgraded,
  mitigate by switching to cookie-backed state storage, changing token storage config, or disabling
  Magic Link or OAuth.

  STEWARDSHIP (2026-07-16, verified vs the first-party announcement; registry re-verified
  2026-09-24): Better Auth JOINED VERCEL (2026-07-07) with a stated open-source and
  framework/platform-agnostic commitment; its Agent Auth Protocol work continues under Vercel.
  Better Auth had ALREADY acquired Auth.js/NextAuth and maintains it (security/bugs) while
  transitioning users toward Better Auth. The registry shows the two lanes: better-auth 1.7.7
  (2026-09-30) active; @auth/core 0.41.3 and next-auth 4.24.15 both last published 2026-07-20.
  DELIBERATE NO-MIGRATE-RULE (same policy as ANIMATION's Rive case): Auth.js is NOT formally
  deprecated, so it stays a when-clause, not churn; the tripwire on next-auth's npm deprecation
  flag adds the next-auth → better-auth migrate rule when it fires.


  CLERK EXPO SDK (2026-09-24, verified vs npm): @clerk/clerk-expo (last 2.20.0, 2026-08-04)
  carries an npm deprecation — "Migrate to @clerk/expo by following the Core 3 upgrade guide";
  @clerk/expo is at 4.6.9. → Expo apps on the old package migrate as part of Clerk's Core 3
  upgrade.


  REACT NATIVE FIREBASE v26 (2026-08-07, verified vs the Invertase release post): the biggest
  architectural cut in the library's nine years, and it is gated — every package with a native
  bridge now REQUIRES the New Architecture (Codegen TurboModules), so v26 is only reachable once
  the app is on New Arch; the maintainers' explicit advice otherwise is to stay on v25. Three
  changes travel with it: all 19 packages migrated JS→TypeScript (the prerequisite for TurboModule
  specs), the deprecated NAMESPACED API is removed so modular calls (getAuth(app)) are the only
  surface — matching the firebase-js-sdk docs people already copy from — and CI now diffs the
  TypeScript shapes against firebase-js-sdk so API drift fails on Invertase's side instead of in
  your build months later. Migration trap: TurboModules let APIs be synchronous where
  firebase-js-sdk is synchronous, so code calling .then() on what is now void breaks.
  v27 (2026-10-19, verified vs the v27.0.0 release + npm 27.1.1, 2026-11-10): iOS is SWIFT PACKAGE
  MANAGER ONLY (the CocoaPods Firebase matrix is dropped); moves to Firebase Android 35 / Apple 13 /
  JS 13; removes the discontinued @react-native-firebase/ml; initializeApp now reads
  automaticDataCollectionEnabled as a real boolean (JS false now disables it); Imagen removed from
  @react-native-firebase/ai. → v27 is gated on the iOS build moving to SPM, the way v26 was gated on
  New Arch.


  AUTH0 (2026-09-24, verified vs the react-native-auth0 CHANGELOG): 5.9 (2026-07-07) added
  passwordless OTP for database connections; 5.10 (2026-07-17) added MFA support; 5.11
  (2026-07-31) added IPSIE session_expiry enforcement and passkeys on web; 5.11.1 (2026-09-08)
  deprecates the client-side Management API and the legacy MFA methods on the auth client → code
  using either should move off them now. v6.0.0 (2026-10-28, verified vs the release + the
  MIGRATION_GUIDE + npm 6.2.1) carries that out: New Architecture only (RN ≥0.82, React ≥19), RN 0.88
  support, Auth0.Android v4 / Auth0.swift v3, DPoP becomes opt-in (useDPoP defaults to false), and the
  client-side Management API and legacy MFA methods are REMOVED.


  CROSS-REFERENCES: RB-E-STORAGE owns token storage (Keychain/Keystore); RB-E-SECURITY owns the
  threat model; RB-E-P2P owns keypair identity; RB-E-META-FRAMEWORKS owns the web server story
  that session handling is entangled with.


  HISTORY:

  2026-11-25 REOPENED: Better Auth November security release — floor 1.7.16 (twelve advisories, one
  critical @better-auth/expo, high @better-auth/electron secret leak + 2FA skip); react-native-auth0 v6
  (New Arch only, Management API + legacy MFA removed, DPoP opt-in); React Native Firebase v27 (iOS
  SPM-only).

  2026-10-01 REOPENED: Better Auth critical Magic Link account-takeover CVE (GHSA-965c-763c-88jm,
  CVSS 9.1) — mandatory upgrade to 1.7.7, promoted to the top when-clause.

  2026-09-24 CORRECTED: the Expo SDK was named as @clerk/clerk-expo, which npm now deprecates for
  @clerk/expo; "@auth/core last publish 2025-10" was superseded by the 2026-07-20 publishes.

  2026-09-10 GRADUATED drafted → reviewed: long-form Explanation written; confidence stays low.

  2026-07-16 GAP CLOSED: auth had no entry among the prior 42; opened on TWiR #290 (Better Auth
  joins Vercel).
