  - { pkg: "better-auth", label: "Better Auth", token: "better auth" }
  - { pkg: "next-auth", label: "NextAuth / Auth.js (maintenance)", token: "auth.js" }
  - { pkg: "@auth/*", label: "Auth.js (maintenance)", token: "auth.js" }
  - { pkg: "@clerk/*", label: "Clerk", token: "clerk" }
  - { pkg: "react-native-auth0", label: "Auth0", token: "auth0" }
  - { pkg: "expo-auth-session", label: "expo-auth-session (DIY OAuth)", token: "expo-auth-session" }
  - { pkg: "@react-native-firebase/auth", label: "Firebase Auth", token: "firebase" }
tripwires:   # standing caveats as executable conditions — evaluated by `harvest firsthand`; fired ⇒ do the then:, update prose, remove the row
  - when: { pkg: "next-auth", deprecated: true }
    then: "Auth.js/NextAuth formally deprecated on npm — the note's DELIBERATE NO-MIGRATE-RULE condition is met: add the next-auth → better-auth migrate rule (urgency: deprecated) with this flag as receipt"
    added: 2026-07-16
migrate:   # installed dep → sequenced upgrade knowledge (assembled by `react-brain migrate`)
  - from: { pkg: "@react-native-firebase/*", below: "26.0.0" }
    to: "React Native Firebase v26 (TurboModules + modular API)"
    urgency: upgrade
    effort: M
    requires: { pkg: "react-native", atleast: "0.82.0" }
    why: "v26 makes every natively-bridged package New-Architecture-only and removes the namespaced API — bump the packages together, switch firebase.auth()-style calls to modular getAuth(app), and drop .then() where the TurboModule API is now synchronous. Below New Arch the supported position is to stay on v25."
    receipts: ["https://invertase.io/blog/react-native-firebase-v26-release"]
