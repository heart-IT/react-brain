    why: "SECURITY: twelve advisories fixed 2026-11-03 — CRITICAL @better-auth/expo authorization proxy (GHSA-4wq4-2ppv-q3hg), high @better-auth/electron secret leak + 2FA skip, revoked-session and unverified-OAuth-email fixes; also covers the 1.7.7 Magic Link account takeover. Some fixes add a config step (trusted origins) — read the security-release post"
    receipts: ["https://better-auth.com/blog/security-release-2026-11-03", "https://github.com/better-auth/better-auth/security/advisories/GHSA-4wq4-2ppv-q3hg"]
