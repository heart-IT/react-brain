id: RB-E-CHARTS
topic: "Charting & data visualization"
category: data-viz
group: ui
status: reviewed   # long-form entry written + source-checked
confidence: low
platforms: [react, react-native]
options:
  - { name: "Victory Native (XL)", tradeoff: "RN; Skia-backed; mature, broad chart types" }
  - { name: "react-native-gifted-charts", tradeoff: "RN; declarative, quick to adopt" }
  - { name: "react-native-skia (build-your-own)", tradeoff: "RN; max control + perf, more code" }
  - { name: "react-native-livechart", tradeoff: "RN; Skia + Reanimated + Gesture Handler; realtime/finance focus, crosshair scrubbing — newer/niche" }
  - { name: "react-native-graph (Margelo)", tradeoff: "RN; Skia-based LINE graphs with gesture scrubbing; REBOOTED v1.2 (2026-04) onto current Skia APIs after ~2y dormancy — line-focused, check it covers your chart types" }
  - { name: "Recharts / visx / Chart.js", tradeoff: "web; visx = low-level D3 primitives (4.0.0), Recharts = batteries-included (3.10.1); both current as of 2026-08-18. The legacy web `victory` package is NOT one of these — it is dormant, see note" }
recommend:
  default: "RN: Victory Native (XL) for standard charts; react-native-skia when you need custom/realtime rendering. Web: Recharts (batteries-included) or visx (low-level D3)."
  when:
    - "realtime/finance RN charts → Skia-based (Victory Native XL, react-native-graph for scrubbing line charts, or react-native-livechart — the latter two newer/niche)"
    - "fully custom web viz → visx; quick standard charts → Recharts"
    - "heavy Skia/Reanimated perf → react-native-best-practices"
note: >
  Library picks are reasonable defaults but lightly vetted. Ignore react-native-livechart's
  satirical "degen mode" framing — not a selection axis. FRESHNESS (signals, 2026-07-10): the
  ACTIVE Victory line is victory-native XL (42.0.1, 2026-08, verified vs npm + GitHub); d3's 2-year
  publish gap is maturity, not abandonment (it's the stable substrate under visx). v42 (2026-08) is
  a FLOOR-RAISE major, not a feature release: minimum @shopify/react-native-skia >=2.6.0 (chart
  paths migrated to the immutable PathBuilder API) and minimum Reanimated >=3.19.1 — on older
  Skia/Reanimated stay on 41.x. It also retires the "slower-moving — watch it" caveat below:
  the repo shipped a major two months after the challenge.
  CHALLENGED 2026-08-18 → WEAKENED (the RN default SURVIVED, one caveat was missing). The attack:
  react-native-gifted-charts ships weekly (1.4.78, 2026-08-10) and has more stars (1,362 vs 1,210),
  so should it take the RN default from Victory Native XL? No, on both axes this entry claims.
  DOWNLOADS: victory-native 381,672/wk vs gifted-charts 147,977/wk (2.6× the other way, verified vs
  the npm API) — the popularity argument runs backwards. SUBSTRATE: victory-native peers on
  @shopify/react-native-skia + Reanimated + Gesture Handler, gifted-charts on react-native-svg — so
  the entry's "Skia-backed for standard charts, raw Skia when you need custom/realtime" axis is a
  real rendering difference, not branding. Victory Native XL is slower-moving than it was (npm
  41.26.0 2026-06-09, repo pushed 2026-07-06, 89 open issues) — watch it, but it is not stalled.
  WHAT THE CHALLENGE DID CHANGE: the web `victory` package is not "slow", it is DORMANT — npm
  37.3.6 published 2025-01-14, repo last pushed 2025-12-19. Nothing here recommends it (web goes to
  Recharts 3.10.1 / visx 4.0.0, both current), but the option row read as though it were live, and
  its detect label shared the "victory" token with victory-native, which made `react-brain signals`
  report a dormant web package as a stale recommended DEFAULT. The label now says so explicitly,
  which is also the documented way to keep a row out of the default set.
defer_to_skill: react-native-best-practices  # Skia/Reanimated render-perf depth
doc: "RB-E-CHARTS.md"   # long-form Explanation entry in content_dir
updated: 2026-09-10   # primitives-vs-charting-framework reading: agentic coding moved the crossover (D3 primitives vs Recharts spike, with its counter-arguments) — React Status #489
reading:
  - title: "Agentic Coding: Bet on the Primitives"
    url: "https://www.robinwieruch.de/agentic-coding-bet-on-primitives/"
    by: "Robin Wieruch"
    what: "The argument that most directly challenges how this entry (and every library-selection entry) is framed, made concrete on charts. Wieruch spiked the same design-system chart set twice in an hour — once on D3's math primitives with React rendering the SVG, once on Recharts with an identical component API — and the primitive version matched the design exactly (entrance animations, crosshair tooltips, legend filtering) while the Recharts version reached 80% faster and then hit a wall: the last 20% needed custom SVG anyway, and its entrance animation froze in that React stack with no fix but disabling it. His frame is worth borrowing: a high-level library is PREPAID IMPLEMENTATION LABOR, bought with flexibility — a primitive maps a value to a pixel and has no opinion about what you draw, a framework owns rendering, animation lifecycle and tooltips and hands you config props to negotiate with, and the difference only shows up when your requirements leave the author's assumptions. The claim is not that libraries lost; it is that agentic coding moved the CROSSOVER POINT toward primitives, so requirements that used to sit safely on the library side (three charts matching a design system, a bespoke form flow, a custom data grid) now often sit on the other. He argues the other side himself, and those caveats are the load-bearing part: a team without an established agentic workflow cannot place this bet, because the old labor math still applies to them; commodity UI on a library's happy path should stay there; every line you own is a line you maintain, without a community surfacing edge cases; deep-accessibility widgets (combobox, date picker, focus-managed modal) encode years of screen-reader testing not worth regenerating; and genuinely hard stable problems — date arithmetic, color interpolation, schema validation, floating-element positioning — stay dependencies. His last caveat is the sharpest: the spike worked because he could JUDGE the output, and an agent collapses the cost of writing a layer, not the cost of understanding it."
    claim: "Before installing a charting framework for design-system-specific charts, spike the D3-primitives version too — agentic coding moved the crossover; stay with the library for commodity UI, no agentic workflow, or deep accessibility needs."
    applies_when: { platforms: [react, react-native] }
  - title: "Introducing visx from Airbnb"
    url: "https://medium.com/airbnb-engineering/introducing-visx-from-airbnb-fd6155ac4658"
    by: "Airbnb Tech Blog"
    what: "The architecture of web React charting — use D3 for math/layout while React owns the DOM, and compose low-level primitives instead of opinionated chart components. First-principles framing that applies to visx, Recharts, and any D3+React stack."
    claim: "You ship a D3+React chart stack — the durable division of labor is D3 for math/layout while React owns the DOM, composing low-level primitives instead of opinionated chart components (applies to visx, Recharts, any D3+React stack)."
    applies_when: { deps: ["@visx/*", "recharts", "d3"], platforms: [react] }
  - title: "The Future of React Native Graphics: WebGPU, Skia, and Beyond"
    url: "https://shopify.engineering/webgpu-skia-web-graphics"
    by: "William Candillon (Shopify)"
    what: "How RN Skia renders graphics — incl. the canonical high-density line-chart-as-GPU-texture example, JSI, immutable display lists, a unified WebGPU backend. The rendering model under Victory Native XL and build-your-own Skia charts."
    claim: "You ship Skia-backed RN charts (Victory Native XL or raw react-native-skia) — the rendering model underneath: JSI, immutable display lists, a unified WebGPU backend, and the canonical high-density line-chart-as-GPU-texture pattern."
    applies_when: { deps: ["victory-native", "@shopify/react-native-skia"], platforms: [react-native] }
