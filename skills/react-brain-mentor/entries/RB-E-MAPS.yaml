id: RB-E-MAPS
topic: "Maps & geolocation UI"
category: maps
group: ui
status: reviewed   # long-form entry written + source-checked
confidence: low
platforms: [react, react-native]
options:
  - { name: "react-native-maps (1.29)", tradeoff: "The long-standing RN default: Apple Maps on iOS, Google Maps on Android; simple markers/polylines, limited styling, no programmatic offline-region API. Google's mobile Maps SDK loads are free (API key required). 1.29.8 (2026-09-20, verified vs npm), peer RN >=0.76." }
  - { name: "expo-maps — ALPHA", tradeoff: "Expo's modern maps module (Apple Maps iOS / Google Maps Android, SDK-versioned, 57.0.3): explicit alpha with frequent breaking changes and no Expo Go (2026-09-24, verified vs the Expo docs) — watch, don't bet yet." }
  - { name: "@rnmapbox/maps (10.x)", tradeoff: "Mapbox native SDK: custom vector/GL styles, offline region downloads, navigation stack; billed per monthly active user above a free tier. 10.3.5 (2026-07-22, verified vs npm), peer RN >=0.79; see note: PROVIDER PRICING." }
  - { name: "@maplibre/maplibre-react-native (11.x)", tradeoff: "Open-source Mapbox-SDK fork: Mapbox-compatible GL styles + offline, any tile source, no token or SDK fee; you source (or pay for) tiles yourself. 11.4.0 (2026-09-19, verified vs npm), peer RN >=0.80 and React >=19.1." }
  - { name: "react-native-better-maps (1.2, Nitro)", tradeoff: "MapKit + Google Maps on Nitro Modules, New Architecture only; native marker clustering + POI taps; still young (1.0.0 2026-06-29 → 1.2.1 2026-09-15, verified vs npm); see note: BETTER-MAPS FLOORS." }
  - { name: "web: react-map-gl / react-leaflet / mapcn", tradeoff: "react-map-gl (8.1.3, 2026-09-02) wraps MapLibre/Mapbox GL JS; react-leaflet (5.0.0, 2024-12-14, both verified vs npm) is classic raster Leaflet under a Hippocratic-2.1 license, not MIT; mapcn = shadcn-patterned map components on MapLibre + Tailwind (copy-paste model)." }
  - { name: "web: @vis.gl/react-google-maps (1.10)", tradeoff: "The vis.gl/OpenJS-governed React wrapper for the Google Maps JS API (components + hooks, markers/drawing); the maintained pick when the product is committed to Google's tiles/Places stack; web Dynamic Maps are billed per load above a free cap. 1.10.1 (2026-09-21, verified vs npm)." }
recommend:
  default: "React Native → react-native-maps for platform-native basics (markers, regions; Google's mobile SDK loads are free). Switch to MapLibre RN for custom vector styles or offline regions with no SDK fee, or @rnmapbox/maps for Mapbox's full commercial stack. Web → react-map-gl on MapLibre GL JS (mapcn for ready-made shadcn-style components). Lightly vetted (confidence: low) — prototype clustering + offline on-device."
  when:
    - "basic platform-native map + a few markers (RN) → react-native-maps (expo-maps is the Expo-native successor but ALPHA — track it, don't ship it)"
    - "custom map styling / offline regions / no SDK licensing fee → MapLibre (@maplibre/maplibre-react-native on RN, react-map-gl on web) + any tile source"
    - "turnkey commercial stack (style studio, navigation, support) and per-MAU pricing is acceptable → @rnmapbox/maps"
    - "large marker sets needing native clustering on New Arch → react-native-better-maps (1.2, still young; bitmap markers only — prototype first)"
    - "shadcn-patterned web map UI fast → mapcn"
    - "web app committed to Google Maps (tiles, Places, Street View) → @vis.gl/react-google-maps"
    - "web raster-tile map without WebGL → react-leaflet (Hippocratic-2.1 license — clear it before adopting)"
note: >
  The durable selection axis is the TILE/SDK PROVIDER, not the React wrapper: platform-native
  (Apple/Google — free mobile SDK loads, limited styling, no offline-region API) vs Mapbox (powerful,
  commercial, per-MAU) vs MapLibre + open tiles (no SDK fee, self-hostable, Mapbox-compatible
  styles). Wrappers are cheap to swap; the provider commitment (billing, offline rights, style
  ecosystem) is not.

  PROVIDER PRICING (2026-09-24, verified vs developers.google.com/maps pricing + mapbox.com/pricing):
  Google's "Maps SDK" (Android/iOS native) SKU has unlimited free usage; web "Dynamic Maps" is free to
  10,000 loads/month, then $7.00/1k (falling to $0.53/1k above 5M). Mapbox's Mobile Maps SDKs bill
  per monthly active user: free to 25,000 MAU, then $4.00/1k MAU (lower tiers above 125k); Mapbox's
  $0.50/1k price is for Vector Tiles API requests above 200,000, not mobile map loads. MapLibre has no
  SDK fee; tile hosting is your cost → on RN, cost does not argue against react-native-maps; custom
  styling and offline regions do.

  BETTER-MAPS FLOORS (2026-09-24, verified vs its README): RN 0.78+ with the New Architecture,
  react-native-nitro-modules >=0.35, iOS 16.0+, Android minSdk 24, Expo SDK 56+ in a development
  build (no Expo Go). Custom RN child views inside markers are not supported (bitmap marker images
  only); openstreetmap and mapbox providers are reserved names, not implemented.

  HISTORY:
    2026-09-24 CORRECTED: "Google ~$7/1k mobile map loads" was wrong — Google's native Maps SDK loads are free and $7/1k is web Dynamic Maps; Mapbox mobile is per-MAU ($4/1k above 25k), its $0.50/1k is Vector Tiles API; better-maps floors, peer floors and react-leaflet's license added.
    2026-09-24 REOPENED: version pins refreshed (better-maps 1.2.1, react-google-maps 1.10.1, maplibre-react-native 11.4.0).
    2026-07-13 GAP CLOSED: @vis.gl/react-google-maps added on its 2nd independent signal (TWiR #289 bench → React Status #482).
    2026-07-06 GAP CLOSED: entry created from react-native-better-maps 1.0 (TWiR #288) and mapcn (React Status #481).
