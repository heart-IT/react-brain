reading:
  - title: "Building a video call app with filters"
    url: "https://blog.margelo.com/building-videocall-app-with-filters"
    by: "Ritesh Shukla (Margelo)"
    what: >
      Architecture deep-dive: real-time RN video-call filters (background blur, virtual
      backgrounds, Center Stage auto-zoom, live drawing) by injecting processed VisionCamera
      frames into LiveKit's WebRTC VideoSource without touching encoder/transport/signaling.
      Covers off-thread segmentation (MediaPipe/Vision), Metal/Skia compositing, YUV↔I420/NV12
      conversion, and the monotonic-timestamp + buffer-pooling gotchas.
    claim: "You ship WebRTC calling (LiveKit / react-native-webrtc) — don't fork the stack for filters: segment off the hot path, GPU-composite, and inject processed VisionCamera frames into the existing VideoSource; mind YUV conversion and monotonic timestamps."
    applies_when: { deps: ["@livekit/*", "react-native-webrtc"], platforms: [react-native] }
  - title: "MoQKit: a native mobile SDK for MoQ on iOS and Android"
    url: "https://swmansion.com/blog/moqkit-native-mobile-sdk-moq-ios-android/"
    by: "Jakub Perżyło (Software Mansion)"
    what: "Architectural intro to Media over QUIC for mobile — the session/namespace/track model, why moq-lite over moq-transport, and where it sits between WebRTC and HLS. A durable real-time-media transport reference."
  - title: "What's New in VisionCamera V5?"
    url: "https://blog.margelo.com/whats-new-in-visioncamera-v5"
    by: "Marc Rousavy (Margelo; VisionCamera creator)"
    what: "The canonical v5 reference for this entry's default camera pick: the full Nitro rewrite (−3k LOC of hand-written JSI, ~15x lower call latency vs Turbo Modules), the Constraints API replacing Formats, in-memory photo capture, depth/RAW/multi-cam, and modular frame-processor plugins. Read before betting real-time work on v5."
    claim: "You ship VisionCamera — v5 is a full Nitro rewrite (Constraints API replaces Formats, ~15x lower call latency) but still stabilizing: adopt pinned-patch with a device-matrix pass; don't linger on frozen v4."
    applies_when: { deps: ["react-native-vision-camera"], platforms: [react-native] }
  - title: "Scanning Barcodes in React Native Apps: The Complete Guide (2026)"
    url: "https://margelo.com/blog/react-native-barcode-scanner"
    by: "Marc Rousavy (creator of VisionCamera and react-native-data-scanner)"
    what: "The cross-library selection guide the VisionCamera-scoped piece below doesn't cover, and its durable core is the ENGINE MAP: every RN scanning library wraps one of four native engines — Google ML Kit (VisionCamera's Barcode Scanner on both platforms, expo-camera on Android, data-scanner on Android), AVFoundation's AVCaptureMetadataOutput (VisionCamera's Object Output, expo-camera on iOS for most formats), VisionKit's DataScannerViewController (react-native-data-scanner on iOS 16+, expo-camera's launchScanner), and ZXing (which expo-camera bundles on iOS to decode PDF417/Code 39/Codabar). The consequence is the useful part: decoder quirks belong to the ENGINE, not the wrapper, so if ML Kit mis-reads an inverted barcode every ML-Kit-based library does, and iOS reporting UPC-A as EAN-13 shows up in everything built on Apple's APIs. The routing: one code and no custom UI → react-native-data-scanner (one call, no camera view to build); in-app camera with overlays or validation → VisionCamera + the barcode plugin; smallest iOS-only footprint → VisionCamera's Object Output; Expo Go → expo-camera; damaged/dense codes at industrial scale → a commercial SDK. Author bias is explicit (he wrote VisionCamera and data-scanner), and the post corrects a vendor claim that VisionCamera uses VisionKit — it never has. Note react-native-data-scanner is 0.1.2 on npm (verified 2026-08-18): the routing advice is sound, the package is early."
    claim: "You scan barcodes in React Native — pick by the native engine underneath (ML Kit / AVFoundation / VisionKit / ZXing): decoder quirks belong to the engine, not the wrapper. Need one code and no custom UI? A platform scanner call beats mounting a camera view."
    applies_when: { deps: ["react-native-vision-camera", "expo-camera"], platforms: [react-native] }
  - title: "QR and Barcode Scanning in React Native with VisionCamera V5"
    url: "https://blog.margelo.com/react-native-qr-barcode-scanner-visioncamera-v5"
    by: "Marc Rousavy (Margelo; VisionCamera creator)"
    what: "By VisionCamera's creator: three scanning APIs (CodeScanner / useBarcodeScannerOutput / frame processors), narrowing barcodeFormats and outputResolution for latency, the frame-vs-preview coordinate gotcha, and MLKit vs Apple's native AVCaptureMetadataOutput vs commercial SDKs. The reference for RN code scanning."
    claim: "You ship VisionCamera and scan codes — three APIs (CodeScanner / useBarcodeScannerOutput / frame processors); narrow barcodeFormats and outputResolution for latency, and mind the frame-vs-preview coordinate gotcha."
    applies_when: { deps: ["react-native-vision-camera"], platforms: [react-native] }
