id: RB-E-SECURITY
topic: "App security — device trust, secrets, dependency risk"
category: security
group: tooling-ops
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-SECURITY.md
confidence: high
platforms: [react, react-native]
options:
  - { name: "jail-monkey (v3)", tradeoff: "client-side jailbreak/root + mock-location + debug detection; v3 adds New-Arch support; NOT a substitute for server-side Play Integrity / DeviceCheck" }
  - { name: "react-native-keychain / expo-secure-store", tradeoff: "store tokens/secrets in Keychain/Keystore, not AsyncStorage (see RB-E-STORAGE)" }
  - { name: "dependency CVE scanning", tradeoff: "npm/pnpm audit; route depth to the review skill's security phase" }
  - { name: "supply-chain hardening", tradeoff: "install-script blocking (npm v12 default), install-age gating (min-release-age / npmMinimalAgeGate), provenance, and since 2026-07 npm's own publish-time malware scan — provenance alone is not enough" }
  - { name: "Trusted Types (web)", tradeoff: "React integrates the browser Trusted Types API for XSS prevention; dangerouslySetInnerHTML needs an explicit policy" }
  - { name: "rnsec (RN/Expo security scanner)", tradeoff: "zero-config static scanner — 63 rules across storage/network/auth/secrets/crypto, CI-ready (exit codes, PR comments, JSON/HTML reports); young + single-author (~500★, v1.3) — a cheap CI layer, not a substitute for per-diff review" }
  - { name: "DeepSec (Vercel Labs)", tradeoff: "open-source AI security-scan harness — agents trace data flows on YOUR infra with YOUR Claude/Codex subscription; produces severity-rated findings (NOT auto-fix PRs), ~10–20% false-positive rate per Vercel; framework-agnostic, new" }
recommend:
  default: "Secrets in Keychain/secure-store (never AsyncStorage); harden the supply chain (block install scripts, gate install-age); device trust via server-side attestation; route per-diff secret/injection checks to the review skill."
  when:
    - "device-trust requirement → server-side Play Integrity / DeviceCheck (jail-monkey is client-side only, defeatable)"
    - "web XSS surface → Trusted Types + sanitized dangerouslySetInnerHTML"
    - "RSC/Server Functions on web → patch React to 19.2.8 / 19.1.9 / 19.0.8 (recurring server-function DoS CVEs); does not affect RN"
    - "want a cheap CI gate for RN-specific security footguns → rnsec scan (young — treat findings as leads, route confirmations to the review skill)"
note: >
  DURABLE SCOPING FACT: the React Server Components DoS family (CVE-2026-23864, CVSS 7.5;
  React2DoS CVE-2026-23869) and the Dec-2025 RSC source-exposure/RCE issues are SERVER-SIDE
  (react-server-dom-*; Next.js App Router) and do NOT affect React Native; patched across
  React 19.0.5 / 19.1.6 / 19.2.5. The family RECURS — treat the floor as a moving target, not
  a one-time patch: GHSA-wx67-qw84-cm4g (High, CVSS 7.5, 2026-07, verified vs the advisory) is
  another server-function DoS (crafted HTTP requests → OOM / excessive CPU) affecting
  react-server-dom-webpack/parcel/turbopack 19.0.0–19.0.7, 19.1.0–19.1.8 and 19.2.0–19.2.7,
  patched in 19.0.8 / 19.1.9 / 19.2.8. Same scoping as before — no server, no RSC-capable
  bundler, no exposure. The 2025–26 SUPPLY-CHAIN wave (Shai-Hulud worm, the
  @tanstack/* npm compromise, axios RAT) is the bigger practical risk — hence npm v12 blocking
  install scripts by default + install-age gating. Live CVEs belong in a security feed, not this
  encyclopedia; for per-diff secret/injection/dependency checks defer to the review skill.
  PROVENANCE (2026-07-09): rnsec was surfaced by Native Weekly — whose author ALSO authors rnsec —
  so it was independently vetted before inclusion (repo checked: ~500★, 63 rules, CI integrations,
  active v1.3 2026-04). Kept with the young/single-author caveat; watch whether it earns adoption.
  INCIDENT LEDGER UPDATE (2026-07-10): the Vercel April-2026 incident (verified vs Vercel's
  bulletin) — a compromised third-party AI tool (Context.ai) led through an employee's Google
  Workspace to decryption of customers' plaintext-decryptable "non-sensitive" env vars; npm
  packages unaffected. Lessons: mark platform env vars SENSITIVE, and treat AI dev-tools as
  supply-chain surface. The TanStack npm compromise now has its first-party postmortem (reading).
  HARDENING TOOLKIT ADDITION (2026-07-10, verified vs the nuqs post): npm STAGED PUBLISHING
  (draft → 2FA-gated validate → finalize) + local tarball-hash reproduction — the maintainer-side
  countermeasure to the TanStack-style CI-compromise chain ("assume GitHub itself is compromised");
  joins install-script blocking and install-age gating as the third supply-chain layer.
  PLATFORM-SIDE FIX (2026-07-16 back-audit, verified vs the GitHub changelog): actions/checkout
  v7 ships safer pull_request_target defaults — closing the exact 'Pwn Request' door the
  TanStack postmortem reading documents; pin checkout ≥7 in CI.
  REGISTRY-SIDE LAYER (2026-07-28, verified vs the GitHub changelog): npm now scans every newly
  published package for malware BEFORE it becomes installable — default and non-negotiable, with
  three outcomes (publish, hold for manual review, block, with an appeal path) and a typical 5–15
  minute publish delay. Packages with legitimate security-relevant capability must now declare it
  as DUAL-USE: a `contentPolicy` field in package.json plus a text-only DISCLOSURE file describing
  the functionality and its intended use; the declaration must persist across versions and
  publishing requires 2FA. This is the first defense in the chain that runs on the REGISTRY rather
  than in your install or CI — it raises the floor against the Shai-Hulud/axios-RAT family but
  catches only "the malware we can detect", so it stacks with, and does not replace, install-script
  blocking, install-age gating and egress control. Maintainers: budget the delay into release
  pipelines (this repo publishes via OIDC trusted publishing).
  FIRST-PARTY UMBRELLA (2026-08-07, verified vs the GitHub post): "Disrupting supply chain
  attacks on npm and GitHub Actions" (github.blog, 2026-07-28) is the one link that bundles the
  whole 2026 program — staged publishing (May), npm v12 install-script defaults (June),
  72-hour read-only lock on high-impact accounts after email changes or 2FA-recovery use (June),
  Actions hardening (checkout defaults, workflow-execution policies, read-only cache for
  untrusted workflows), and a 3-day default Dependabot cooldown (July) — install-age gating is
  now a PLATFORM default, not just a local countermeasure. See reading.
  LIVE COUNTEREXAMPLE (2026-08-07, verified vs the Aikido incident report): the keyv compromise
  (2026-08-04) — maintainer GitHub account takeover → poisoned versions published WITH VALID
  GitHub-Actions provenance → preinstall-hook dropper (downloads Bun, harvests npm/GitHub/AWS/
  Vault/Stripe/Slack credentials) → self-replicating worm: 444 packages / 1,381 versions /
  ~2B combined monthly installs within a day. Receipts for two standing claims at once:
  provenance alone is not enough (the signatures were valid), and registry-side scanning catches
  only what it can detect (the worm shipped a week after publish-time scanning went default,
  2026-07-28). Install-script blocking + install-age gating remain the layers that bite.
  Incident is ongoing — promote to a reading when a definitive postmortem lands.
defer_to_skill: review
