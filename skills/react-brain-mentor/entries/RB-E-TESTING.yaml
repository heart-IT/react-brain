id: RB-E-TESTING
topic: "Testing strategy & tooling"
category: testing
group: tooling-ops
status: reviewed   # long-form entry written + source-checked → encyclopedia/RB-E-TESTING.md
confidence: high
platforms: [react, react-native]
options:
  - { name: "Jest (30.5) / Vitest (5)", tradeoff: "Unit runners: Vitest is faster on web, Jest is the RN default. Both majors converged on per-argument mocking (Jest `fn.whenCalledWith`, Vitest `vi.when(spy).calledWith`). jest 30.5.2 (2026-09-18), vitest 5.0.1 (2026-09-15; both verified vs npm). See note: JEST 30.5, VITEST 5." }
  - { name: "React Testing Library (14)", tradeoff: "Behavior-first component tests with web and RN variants; the 14 is RN Testing Library, which adds React 19 support + async APIs and renders host elements only. @testing-library/react-native 14.0.1 (2026-06-23), web @testing-library/react 16.3.3 (2026-08-27; both verified vs npm). See note: RNTL RENDERER." }
  - { name: "MSW (Mock Service Worker)", tradeoff: "Network-level API mocking; the same mocks serve unit, e2e and dev. msw 2.15.0 (2026-07-08, verified vs npm)." }
  - { name: "Playwright (1.63) / Maestro / Detox / Meticulous", tradeoff: "E2E: Playwright for web; Maestro is Expo's recommended native e2e and bundles an MCP server for coding agents; Expo archived Detox; Meticulous is record-based AI e2e. @playwright/test 1.63.0 (2026-09-04), detox 20.51.4 (2026-06-16; both verified vs npm), Maestro CLI 2.10.0 (2026-08-31, verified vs GitHub). See note: PLAYWRIGHT 1.62, MAESTRO." }
  - { name: "Storybook 10", tradeoff: "Component workshop; web + RN run side by side; Vite 8 + Playwright/Vitest test integration + MCP. storybook 10.6.0 (2026-09-02, verified vs npm; 11 is in alpha)." }
  - { name: "Radon IDE (Software Mansion)", tradeoff: "VS Code / Cursor RN debugging: device panel, click-to-inspect, React Profiler." }
  - { name: "Argent (Software Mansion) — NEW/experimental", tradeoff: "Agentic toolkit that gives an AI assistant control of the iOS Simulator (drive + inspect the running app) to shorten the debug loop; new, niche. v0.25.2 (2026-09-18, verified vs GitHub releases)." }
  - { name: "react-native-harness (Callstack) — NEW", tradeoff: "Jest-style describe/it tests running ON real devices/simulators (iOS/Android/web) with native-module access — the layer between Node-Jest and black-box Maestro. 1.5.0 (2026-09-14, verified vs npm + GitHub) adds `harness ci` for unattended runs; young, pin it. See note: REACT-NATIVE-HARNESS." }
recommend:
  default: "Unit/component: Vitest (web) or Jest (RN) + React Testing Library. E2E: Playwright (web), Maestro (RN). MSW for API mocks; Storybook for component dev."
  when:
    - "RN e2e → Maestro (Expo's recommendation; Expo archived Detox)"
    - "existing Detox suite → Maestro for new flows (Expo archived Detox; Detox itself still publishes, 20.51.4)"
    - "API-heavy tests → MSW (the same mocks serve unit + e2e + dev)"
    - "Holepunch / Bare app → brittle (the ecosystem's TAP runner; idiomatic, not a deviation — see RB-E-P2P)"
    - "unit/integration tests that must exercise real NATIVE modules → react-native-harness (early; pin versions)"
    - "web component tests in a real browser → Playwright (1.62+ stories + galleries), else Storybook 10 when the workshop is already there"
    - "native E2E suite too flaky to block CI → fix the E2E API first (assert every step, find elements visually, gate new tests on repeated runs — see the Shopify reading)"
    - "RN debugging inside VS Code or Cursor → Radon IDE (device panel, click-to-inspect)"
    - "an AI agent must drive the iOS Simulator → Maestro MCP (maestro mcp), else Argent (experimental)"
    - "test discipline (what to test, TDD) → agentic-engineering-patterns"
note: >
  Test behavior the way users exercise it, at the cheapest layer that gives confidence: Vitest (web)
  or Jest (RN) with Testing Library for components, MSW so one set of network mocks serves every
  layer, and one e2e tool per platform — Playwright on web, Maestro on native. Maestro holds the
  native default because Expo recommends it and archived its Detox docs, and because it is where
  agent-driven testing is consolidating. On Jest vs Vitest the platform decides, not taste: Jest is
  RN's preset.

  JEST PRESET MOVED (verified vs the RN 0.85 release blog, 2026-04-07): RN 0.85 moved the Jest preset
  out of the core package — set `preset: '@react-native/jest-preset'` in jest.config.js (was
  `preset: 'react-native'`).

  JEST 30.5 (2026-08-28, verified vs the v30.5.0 release): `fn.whenCalledWith(...)` per-argument
  mocking (asymmetric matchers accepted, toHaveBeenCalledWith equality semantics), describe-level
  retries via jest.retryTimes(), and a new file watcher; its own notes flag a big
  jest-runtime/resolve/haste-map change with regression risk → upgrade with a full-suite run, not a
  lockfile bump.

  VITEST 5 (2026-09-03, verified vs the release + the announcement post): a performance release with
  numbers published as a reproducible benchmark suite (vitest-dev/benchmarks — generated apps from a
  5-file utility package to a 1,280-module monolith, across every pool × environment). Wins: −53% on
  a deps-heavy app and −15..−25% on vm pools, Browser Mode and large isolated suites, but ±3% where
  environment setup already dominates (forks + jsdom + isolation) → when the reporter says
  `environment 79%`, test speed is a jsdom-version problem, not a runner problem (the Sentry RTL
  reading), and Vitest 5 will not fix it. Mechanisms: inline projects share one Vite server,
  fsModuleCache graduated from experimental (on-disk transform cache reused across runs and
  processes), fewer main↔worker round trips, vm pools reuse compiled code, and Vitest bundles its own
  deps. New surface: `vitest doctor` re-runs your suite under alternative configurations and
  recommends faster options (performance hints print by default); a provider-independent Trace View
  for Browser Mode records interactions/assertions as DOM snapshots replayable in the UI and HTML
  reporter (no separate viewer, unlike Playwright traces); `vi.when(spy).calledWith(...)` with a
  `toHaveBeenExhausted` assertion; inline projects inherit the root config by default (`extends:
  true` no longer needed), and config files in `test.projects` may nest their own projects. Breaking
  changes: pretty-format replaces loupe.inspect (snapshot/error output shifts), `sequential`
  options removed in favor of `concurrent`, locators are objects rather than strings, deprecated
  entry points removed, and `bench` is no longer a top-level import but a test-context fixture inside
  a normal `test()`.

  RNTL RENDERER (2026-07-10, verified vs the docs + the mdjastrzebski/test-renderer repo): RN Testing
  Library v14 runs on its own react-reconciler-based test-renderer that renders HOST elements only —
  which is why its query model moved to host-element/role queries. React core's react-test-renderer
  is deprecated → do not use it in new test code.

  PLAYWRIGHT 1.62 (released 2026-07-24, verified 2026-07-30 vs the release notes + registry; 1.63.0
  is current, verified vs npm 2026-09-24): component testing is rebuilt around STORIES + GALLERIES — a story wraps a
  component in a scenario, a gallery renders stories on demand, and
  `mount('components/Expandable/Stateful')` navigates to the gallery and returns a scoped Locator →
  "Storybook for the workshop, Playwright for e2e" is no longer the only sensible split on web. Also:
  an `AbortSignal` `signal` option on most operations, WebP screenshots for visual comparison
  (quality 100 = lossless), and `testConfig.retryStrategy: 'isolated'`, which defers all retries to
  the end and runs them one by one in a single worker — the fix for flaky retries that interfere with
  the rest of the suite.

  MAESTRO (verified vs docs.maestro.dev, 2026-07-07): Maestro 2.0 added AI test-healing, and Maestro
  bundles an MCP server so coding agents can drive simulators/emulators/devices, inspect UI and
  generate E2E flows (`claude mcp add maestro -- maestro mcp`). Detox has a 'Copilot' beta, but Expo
  archived its Detox docs, so Detox is a legacy suite to maintain, not a new pick.

  REACT-NATIVE-HARNESS (2026-09-14, verified vs the v1.5.0 release and npm): v1.5 adds Windows platform
  support, `harness ci` commands and a Metro config enhancer. The CI commands are the meaningful part:
  an on-device test layer is only useful once it runs unattended.

  CROSS-REFERENCES: RB-E-P2P owns Holepunch testing (brittle); RB-E-A11Y shares the role-query thread
  (TkDodo reading); agentic-engineering-patterns owns test discipline.

  HISTORY:
  2026-09-24 CORRECTED: react-native-harness 1.5 date 2026-09-17 → 2026-09-14 and Playwright 1.63.0
  date 2026-09-10 → 2026-09-04 (npm publish times); Playwright 1.62 release date is 2026-07-24; "React Testing Library (14)" disambiguated —
  14 is RNTL, web RTL is 16.
  2026-09-21 REOPENED: react-native-harness pin 1.3 → 1.5 (Windows, `harness ci`, Metro enhancer).
  2026-09-03 REOPENED: Vitest 5.
  2026-08-28 REOPENED: Jest 30.5.
  2026-07-30 REOPENED: Playwright 1.62 stories + galleries.
  2026-07-10 REOPENED: RNTL v14 renderer flip; react-test-renderer deprecated.
  2026-07-07 GAP CLOSED: Maestro MCP.
